<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock API Example</title>
<style>
:root { --bg: #fff; --side: #f1f1f1; --line: #e0e0e0; --ink: #333; --mute: #666; --accent: #0066cc; --soft: rgba(0, 102, 204, .1); color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1a1a1a; --side: #111; --line: #404040; --ink: #e0e0e0; --mute: #999; --accent: #4da6ff; --soft: rgba(77, 166, 255, .15); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
aside { background: var(--side); padding: 12px; border-right: 1px solid var(--line); }
main { padding: 16px 24px; max-width: 820px; min-width: 0; }
h1 { font-size: 18px; margin: 4px 0 12px; } h2 { font-size: 20px; margin: 0 0 4px; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 14px 0 4px; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
.ch { display: flex; justify-content: space-between; padding: 3px 8px; border-radius: 6px; color: var(--ink); }
.ch.on { background: var(--soft); color: var(--accent); } .ch small { color: var(--mute); }
.row { padding: 10px 0; border-bottom: 1px solid var(--line); }
.meta { color: var(--mute); font-size: 13px; }
.post { padding: 12px 0; border-bottom: 1px solid var(--line); }
.post p { margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.hidden { opacity: .5; }
select { max-width: 100%; }
button, select, textarea, input { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
button.on { background: var(--soft); border-color: var(--accent); }
textarea { width: 100%; min-height: 70px; margin-top: 8px; }
.badge { font-size: 12px; padding: 0 6px; border-radius: 10px; background: var(--soft); color: var(--accent); margin-left: 6px; }
.err { color: #c62828; }
@media (max-width: 700px) { .app { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } main { padding: 16px; } }
</style>
</head>
<body>
<div class="app"><aside id="side"></aside><main id="main"></main></div>
<!-- The mock: drop this tag and set XRPC to a real Group Host to leave it. -->
<script src="dist/mock-api.js" data-as="bob.example"></script>
<script>
// A tiny client written against the XRPC queries, as a reference for the real page. Everything here comes from fetch().
const XRPC = 'https://mock.invalid';
const NS = 'garden.msg';
async function x(nsid, params = {}, body) {
  const qs = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== undefined));
  const res = await fetch(`${XRPC}/xrpc/${nsid}?${qs}`, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const json = await res.json();
  if (!res.ok) throw new Error(json.message || json.error);
  return json;
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (iso) => { const m = (Date.now() - Date.parse(iso)) / 60000; return m < 60 ? `${Math.round(m)}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`; };
const profiles = new Map();
async function names(dids) {
  const need = [...new Set(dids)].filter((d) => !profiles.has(d));
  for (let i = 0; i < need.length; i += 25) {
    const qs = new URLSearchParams(need.slice(i, i + 25).map((a) => ['actors', a]));
    const { profiles: ps } = await (await fetch(`${XRPC}/xrpc/app.bsky.actor.getProfiles?${qs}`)).json();
    for (const p of ps) profiles.set(p.did, p);
  }
}
const who = (did) => esc(profiles.get(did)?.displayName || profiles.get(did)?.handle || did);
const route = () => Object.fromEntries(new URLSearchParams(location.hash.slice(1)));

async function render() {
  const r = route(), group = await x(`${NS}.getGroup`, { group: mockApi.group });
  const me = mockApi.viewer;
  let side = `<h1>${esc(group.record.name)}</h1><div class="meta">${group.memberCount} members</div>
    <p><select id="as"><option value="">Visitor</option>${mockApi.accounts().filter((a) => a.handle.endsWith('.example') || a.staff).map((a) => `<option value="${a.did}" ${a.did === me ? 'selected' : ''}>${esc(a.displayName || a.handle)}${a.staff ? ' (staff)' : ''}</option>`).join('')}</select></p>
    <a class="ch ${!r.c && !r.t ? 'on' : ''}" href="#">Latest</a>`;
  let section;
  for (const c of group.channels) {
    if (c.section !== section) side += `<h3>${esc((section = c.section))}</h3>`;
    side += `<a class="ch ${r.c === c.thread.uri ? 'on' : ''}" href="#c=${encodeURIComponent(c.thread.uri)}">${esc(c.thread.title || c.thread.record.title)}${c.thread.state?.locked ? ' 🔒' : ''}<small>${c.threadCount}</small></a>`;
  }
  document.getElementById('side').innerHTML = side;
  document.getElementById('as').onchange = (e) => { mockApi.signIn(e.target.value || null); };
  const main = document.getElementById('main');
  try { main.innerHTML = r.t ? await threadPage(r.t) : await board(r.c, group); } catch (e) { main.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function board(parent, group) {
  const { threads } = await x(`${NS}.listThreads`, parent ? { parent, limit: 50 } : { group: group.uri, limit: 50 });
  const chan = group.channels.find((c) => c.thread.uri === parent);
  let chat = '';
  if (chan) {
    const { posts } = await x(`${NS}.getThread`, { thread: parent, order: 'newest', limit: 5 });
    await names(posts.map((p) => p.author));
    chat = `<h3>Chat · ${chan.thread.postCount} messages</h3>${posts.reverse().map((p) => `<div class="meta ${p.state?.hidden ? 'hidden' : ''}"><b>${who(p.author)}</b> ${esc(p.record.textContent)} · ${ago(p.record.createdAt)}${(p.reactions || []).map((r) => ` ${r.emoji}${r.count}`).join('')}</div>`).join('')}`;
  }
  await names(threads.flatMap((t) => t.posters));
  return `<h2>${chan ? esc(chan.thread.record.title) : 'Latest'}</h2><div class="meta">${esc(chan?.description || 'Every thread, newest activity first.')}</div>${chat}<h3>Threads</h3>` +
    threads.map((t) => `<div class="row"><a href="#t=${encodeURIComponent(t.uri)}">${t.state?.pinnedUntil ? '📌 ' : ''}${esc(t.title || t.record.title)}</a>
      <div class="meta">${t.posters.map(who).join(', ')} · ${t.postCount} posts · ${ago(t.lastPostAt || t.record.publishedAt)} · score ${t.score}${t.viewer?.notify ? `<span class="badge">${t.viewer.notify}</span>` : ''}</div>
      <div class="meta">${esc(t.excerpt || '')}</div></div>`).join('') || '<p class="meta">No threads yet.</p>';
}

async function threadPage(uri) {
  const { thread: t, posts } = await x(`${NS}.getThread`, { thread: uri, limit: 100 });
  await names(posts.map((p) => p.author));
  const vote = t.viewer?.direction;
  return `<p class="meta"><a href="#c=${encodeURIComponent(t.parent || t.record.parent)}">← back</a></p><h2>${esc(t.title || t.record.title)}</h2>
    <div class="meta">${t.postCount} posts · score ${t.score} ${mockApi.viewer ? `<button data-vote="up" class="${vote === 'up' ? 'on' : ''}">▲</button> <button data-vote="down" class="${vote === 'down' ? 'on' : ''}">▼</button>` : ''} ${t.state?.locked ? '🔒 locked' : ''}</div>` +
    posts.map((p) => {
      const mine = new Set((p.viewer?.reactions || []).map((r) => r.emoji));
      const rx = [...new Set(['❤️', ...(p.reactions || []).map((r) => r.emoji)])].map((e) => { const n = p.reactions?.find((r) => r.emoji === e)?.count || 0; return `<button data-react="${e}" data-subject="${p.uri}" class="${mine.has(e) ? 'on' : ''}">${e} ${n || ''}</button>`; }).join(' ');
      return `<div class="post ${p.state?.hidden ? 'hidden' : ''}"><b>${who(p.author)}</b> <span class="meta">${ago(p.record.createdAt)}${p.uri === t.opening ? ' · opening post' : ''}${p.replyCount ? ` · ${p.replyCount} replies` : ''}</span><p>${esc(p.record.textContent)}</p>${mockApi.viewer ? rx : ''}</div>`;
    }).join('') +
    (mockApi.viewer ? `<textarea id="reply" placeholder="Reply"></textarea><p><button id="send">Reply</button> <span id="err" class="err"></span></p>` : '<p class="meta">Sign in to reply.</p>');
}

// writes: plain com.atproto.repo calls into the viewer's own repo
const now = () => new Date().toISOString();
const create = (collection, record) => x('com.atproto.repo.createRecord', {}, { repo: mockApi.viewer, collection, record: { $type: collection, ...record } });
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const r = route();
  try {
    if (b.dataset.react) {
      const subject = b.dataset.subject, { posts } = await x(`${NS}.getThread`, { thread: r.t, limit: 100 });
      const mine = posts.find((p) => p.uri === subject)?.viewer?.reactions?.find((x) => x.emoji === b.dataset.react);
      if (mine) { const [, , repo, collection, rkey] = mine.uri.split('/'); await x('com.atproto.repo.deleteRecord', {}, { repo, collection, rkey }); }
      else await create(`${NS}.reaction`, { subject, emoji: b.dataset.react, createdAt: now() });
    } else if (b.dataset.vote) {
      const { thread } = await x(`${NS}.getThread`, { thread: r.t, limit: 1 });
      const cur = thread.viewer?.recommend;
      if (cur) { const [, , repo, collection, rkey] = cur.split('/'); await x('com.atproto.repo.deleteRecord', {}, { repo, collection, rkey }); }
      if (thread.viewer?.direction !== b.dataset.vote) await create(`${NS}.recommend`, { subject: r.t, ...(b.dataset.vote === 'down' ? { direction: 'down' } : {}), createdAt: now() });
    } else if (b.id === 'send') {
      const text = document.getElementById('reply').value.trim();
      if (text) await create(`${NS}.post`, { thread: r.t, textContent: text, createdAt: now() });
    }
  } catch (err) { const el = document.getElementById('err'); if (el) el.textContent = err.message; else alert(err.message); }
});
window.addEventListener('hashchange', render);
window.addEventListener('mockapi:change', render);
render();
</script>
</body>
</html>
