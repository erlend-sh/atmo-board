lexicon. Maybe start displaying .profile sooner rather than later?\n\nAlso @pixeline.be re: calls - you can make them when you like — eg 4pm/5pm/6pm CEST. But no pressure - do calls if they are useful. I do recommend at least a kick off call and a weekly or biweekly “check in” time for updates","likes":2,"re":35},{"u":"pixeline.be","at":"2026-04-29T00:26:17Z","text":"Perhaps we could prepare together an offprint article sharing tips for atproto builders on “how to market your app” introducing the lexicons, the webmanifest, etc ?","likes":0,"re":null},{"u":"byarielm.fyi","at":"2026-04-29T02:35:59Z","text":"Oh yeah my thought wasn’t listers doing listing, just them setting up what they need to transition to new lexicon (if they use one, and setting up to use one if they do t) and if they want to setup a submit UI for apps.\n\nBut maybe an offprint with just a simple “publish record to this lexicon” is better? I pinged Dame to see if they had thoughts on the launch day idea since they wanted atproto.garden to be community too iirc\n\nWill make an issue on atstore","likes":1,"re":35},{"u":"dame.is","at":"2026-04-29T03:17:46Z","text":"I know Boris said a launch day is “artificial”, but I don’t think there’s much of a downside to giving people some clear dates and organizing around a specific time as a launch pad like @byarielm.fyi suggested.\n\nMy original intention with atproto garden was to get like 10-15 app creators onboard with submitting theirs prior to an announcement, and then announcing with their help + a call to action for creators to submit theirs. Obviously this scenario is slightly different cause it’s a lexicon and multiple directories, but it could still work.","likes":1,"re":null},{"u":"dame.is","at":"2026-04-29T03:19:13Z","text":"this is awesome compiling and summarizing, ty for taking the time to do this!","likes":2,"re":34},{"u":"jluther.net","at":"2026-04-29T18:16:11Z","text":"Unfortunately, we don’t plan to implement the app lexicons on Bluesky Directory. This is primarily because all of our bandwidth is allocated to paid work right now. :frowning:\n\nBut it’s also a matter of strategy. We’ve talked a lot lately about what’s next for Bluesky Directory. It’s been a cool project, but our efforts to monetize the site haven’t succeeded. We bring in enough to pay its operational costs, but that’s about it. We’ll absolutely keep it going, but we don’t plan to add any new features.\n\nWe still love Bluesky, but for us, the ATmosphere is the future, so that’s where we’re going to focus. We really want to start building [atmospheredirectory.com](http://atmospheredirectory.com) (which we own), but again, we can’t do it without a way to fund it. When we do build it, we’ll implement the lexicons, for sure!\n\nUntil then, we want to stay involved in the WG.","likes":3,"re":null},{"u":"bmann.ca","at":"2026-05-04T16:58:42Z","text":"Hey @jluther.net – the community is building it at [https://atstore.fyi](https://atstore.fyi).\n\nIt’s gone ahead with a lexicon of its own, and then will adopt/migrate to the shared community lexicon once it’s defined.\n\nThat means you can use the same lexicon and data and do whatever you like with it as well.\n\nHear you on the funding issue. It’s awesome that people have *some* time to contribute to community efforts, but have to get people paid at some point.","likes":0,"re":41},{"u":"jluther.net","at":"2026-05-04T17:10:05Z","text":"I was looking at atstore.fyi over the weekend, it’s great!","likes":0,"re":42},{"u":"ngerakines.me","at":"2026-05-04T19:45:00Z","text":"I did a review pass and left some comments on the PR!","likes":1,"re":null},{"u":"pixeline.be","at":"2026-05-10T11:12:54Z","text":"Thank you @ngerakines.me, @knowtheory.net, and @hipstersmoothie.com for the PR comments. I’ve pushed a revised version that incorporates your feedback.\n\nTLDR;\n This version moves the shared pieces into reusable definitions, follows AT Protocol conventions more closely, and clarifies how third-party entries can point to canonical app profiles.\n\nI also took @knowtheory.net ’s localization point a bit further by adding a dedicated localization record, so app authors can publish official translated presentation metadata. For richer app-store-style media, I followed @byarielm.fyi’s suggestion and added support for Web App Manifest URIs instead of adding separate hero/screenshot fields directly to the lexicon.\n\nOne point I’d like feedback on: for the app description, I aligned the limits with a Bluesky post: maxLength: 3000 and maxGraphemes: 300. Does that feel right for app descriptions, or should this lexicon use different limits?","likes":2,"re":null},{"u":"bmann.ca","at":"2026-05-10T20:56:40Z","text":"> **pixeline.be:**\n> Web App Manifest URIs instead of adding separate hero/screenshot fields directly to the lexicon.\n\nThis is a great idea.\n\n> **pixeline.be:**\n> One point I’d like feedback on: for the app description, I aligned the limits with a Bluesky post: maxLength: 3000 and maxGraphemes: 300. Does that feel right for app descriptions, or should this lexicon use different limits?\n\nWe expanded all the limits for the conference profile and effectively you won’t get to something “bsky post sized” when sharing because you’ll need to add text about this in any case.\n\nI looked up OpenGraph limits and this article points out that 300 is like max, and most things trim much more [What is the maximum length of open graph title and description? - OGTester](https://ogtester.com/blog/what-is-maximum-length-of-og-title-and-og-description)\n\nFor the conference profile we ended up having a longer “bio” - does extended description make sense?\n\nFeels like there is enough variability here or opportunity for someone to do a “standard site” compatible field that is any many characters as people want.\n\n+1 to keep it at 300.","likes":1,"re":45},{"u":"ngerakines.me","at":"2026-05-11T21:28:19Z","text":"It’s looking good so far!","likes":1,"re":null},{"u":"pixeline.be","at":"2026-05-11T22:50:39Z","text":"@bmann.ca @ngerakines.me What is still missing / needs rework so that this PR can be merged and go live ? Not clear on the exact process to follow.","likes":0,"re":null},{"u":"bmann.ca","at":"2026-05-11T23:10:50Z","text":"Does @byarielm.fyi have any more feedback? any “not over my dead body” objections from people who consider themselves part of the working group?\n\nIf you all are happy with it - I can approve the merge as your sponsor.","likes":2,"re":48},{"u":"ngerakines.me","at":"2026-05-12T00:13:11Z","text":"I saw some comments that gave me the impression there were more changes, but tbh perfect is the enemy of good. Whomever feels this is “ready” leave a comment saying so in the PR and I’ll go ahead and approve once I do one final validation check.","likes":1,"re":null},{"u":"pixeline.be","at":"2026-05-13T10:46:40Z","text":"I created an App Lexicon Generator and in the process, realized how much complexity the Web App Manifest idea brings to the trade, as it seems it’s not really widely known.\n\nYou can test the app lexicon generator here [https://community-app-lexicon-generator.vercel.app](https://community-app-lexicon-generator.vercel.app) if you need an app that has a manifest, you can use [https://mathr.app](https://mathr.app)\n\nI’m thinking we should perhaps back pedal and while keeping the web app manifest entry in the lexicon, add our own “images” entry (as an array where owner can label the image as a “hero”, a “screenshot”, “icon”, “ads”, …\n\nWhat do you think?","likes":3,"re":null},{"u":"bmann.ca","at":"2026-05-13T13:01:29Z","text":"Great to test it out in practice.\n\nI like the *idea* of web manifest, but maybe it’s even just part of the process of scanning it if it exists to create the lexicon entries and just do the images array as you suggest.","likes":0,"re":51},{"u":"ngerakines.me","at":"2026-05-13T13:18:52Z","text":"It looks great and generating one with it for [https://lexicon.garden/](https://lexicon.garden/) was really easy.\n\n[image](https://discourse.atmosphere.community/uploads/default/original/2X/0/008ef2bd8bfade27c599c287f696a180824ee076.png)","likes":1,"re":51},{"u":"pixeline.be","at":"2026-05-13T15:16:37Z","text":"Thanks @ngerakines.me and @bmann.ca ! I do fear the Wep App Manifest is adding an unnecessary hurdle and will add a “images” entry, similar to the “links” entry. That will give maximum flexibility.","likes":0,"re":53},{"u":"pixeline.be","at":"2026-05-13T15:57:13Z","text":"PR updated with the new “images” array and waiting for review [Add community.lexicon.app lexicons by pixeline · Pull Request #76 · lexicon-community/lexicon · GitHub](https://github.com/lexicon-community/lexicon/pull/76)","likes":1,"re":null},{"u":"ngerakines.me","at":"2026-05-13T20:36:53Z","text":"Looks good to me. I’ve approved the PR. Let’s give it 24-48 hours for other people to comment on and if nothing urgent comes in, I’ll merge it.","likes":1,"re":55},{"u":"pixeline.be","at":"2026-05-15T14:26:55Z","text":"I just had an idea I’d like to run through this WG. It is not at all a blocker for accepting the PR.\n\nWouldn’t it be cool if the app lexicon lists the scope of lexicons it uses? That would enable app listers to detect and display the interoperability of, say, bluesky with blacksky and northsky, offprint.app & leaflet, etc, etc.\n it could be a “lexiconScope” of type array.\n\nAFAIK, there is no simple way to find that out, is there ?","likes":0,"re":null},{"u":"byarielm.fyi","at":"2026-05-16T15:29:08Z","text":"Finally taking a look, thanks for following up on this, been busy PhD’ing -\n\nReally love the shape this is taking and happy with it. No concerns or objections on the lexicon. Just a question: why was web manifest URI pulled out from under the links field?\n\n@jluther.net any comments or concerns?\n\nLastly, @thisismissem.social does these proposed lexicons seem reasonable to adapt for more refined purposes like Eurosky’s directory, where profiles may not have a “made in europe” tag?","likes":0,"re":54},{"u":"byarielm.fyi","at":"2026-05-16T15:32:14Z","text":"The closest would be the client-metadata.json - if the app is requesting permission, they’re using the lexicon in some way. But e.g. sprk.so might request bsky permissions so users can cross-post, but they don’t show those lexicons in most places of the app.","likes":1,"re":57},{"u":"pixeline.be","at":"2026-05-16T18:21:09Z","text":"> why was web manifest URI pulled out from under the links field?\n\nIt got “promoted” to its own space because it contains a lot of interesting (reusable) data (screenshots, icons, description, name, short name, theme colors). But then as I explained above, I realized it’s adding a lot of friction: many app developers do not seem to know about the manifest (given most apps don’t have one), so since that version of the lexicon made it a requirement to add visuals, it means we’d also need to educate them on that, on top of the lexicon.\n It does not really hurt to keep it there, and I use it in my [app lexicon generator](https://community-app-lexicon-generator.vercel.app/) to prefill the lexicon. But true, it could also move back to being just a link entry.","likes":0,"re":58},{"u":"byarielm.fyi","at":"2026-05-16T22:14:26Z","text":"Yeah it seems weird to have the main app URI be in the “links” section but not the manifest. My inclination is they all go in links, you’ve setup names/categories for the main ones and that should be fine.\n\nBtw really like the lexicon generator! Very nicely done, and you can still easily slot in webmanifest if people use that to help set their record.\n\nbut individual apps can use any link really to get info on the site :slight_smile:","likes":1,"re":60},{"u":"jluther.net","at":"2026-05-18T13:58:08Z","text":"No questions or concerns here, thanks!","likes":1,"re":58},{"u":"pixeline.be","at":"2026-05-18T15:37:26Z","text":"Quick PR update: I pushed another revision based on the latest GitHub, Discourse, and Bluesky feedback.\n\nMain changes:\n\n- moved Web App Manifest back into links, using a dedicated linkRoleWebManifest\n- replaced ambiguous entry.locale with entry.langs, meaning “language of this listing text”\n- added platforms as token-backed values instead of relying on tags\n- added lexicons.produces / lexicons.consumes for interoperability discovery\n- added accountIndicators so apps can declare records that suggest an account probably uses the app\n- removed purposeOther; if no image purpose fits, publishers can omit purpose\n\nI kept tags focused on freeform discovery/category labels, and left license/self-hosting metadata for a possible follow-up after v1 lands.","likes":2,"re":null},{"u":"pixeline.be","at":"2026-05-24T11:07:09Z","text":"Hello @ngerakines.me I’ve made a few changes that did not trigger additional reactions. Would you mind having a final look and if all looks good, merge it whenever convenient?","likes":1,"re":56},{"u":"pixeline.be","at":"2026-06-06T07:02:09Z","text":"I think we would all love to ship this. Anything I can do to speed up the process ? @ngerakines.me @bmann.ca :folded_hands:","likes":1,"re":null},{"u":"pixeline.be","at":"2026-06-24T00:37:58Z","text":"@bmann.ca any chance you could unblock this? I understand bandwidth is scarce but I don’t expect approving this should take much time at this stage.","likes":1,"re":null},{"u":"bmann.ca","at":"2026-06-24T16:01:16Z","text":"It looks like Nick @ngerakines.me got a chance to review, merge, and deploy - so this now an officially deployed lexicon!\n\n[Lexicon Community (@lexicon.community)](https://bsky.app/profile/lexicon.community/post/3mp2apraxks2u)\n\nThanks everyone! Now to see if we can start aggregating common app records together!","likes":3,"re":66},{"u":"mfzx.net","at":"2026-06-24T23:04:48Z","text":"Just to make sure, is this a valid way to express that an application is capable of handling *any* record, specifically with regard to [general-purpose tools such as PDSls](https://pds.ls/at://did:plc:erqwpimsmwnzohwoiojsy22z/community.lexicon.app.entry/3mp2yz335sv2x):\n\n```\n{\n  \"lexicons\": {\n    \"consumes\": [ \"*\" ],\n    \"produces\": [ \"*\" ]\n  }\n}\n```\n\n**Edit:** And for that matter, would `app.bsky.*` be a valid entry for Bluesky clients?","likes":0,"re":null},{"u":"byarielm.fyi","at":"2026-10-06T20:08:28Z","text":"@pixeline.be @jluther.net Quick thoughts on bumping the description to 40000 maxLength and 4000 graphemes? Apple and Google both have 4,000 character limits on their descriptions.\n\nFor the ATStore listings it’s much larger, but every single one would fit into a 4000 cap. Right now, there are 77/178 (43%) claimed listings that have descriptions >300 characters and 131/315 (42%) unclaimed listings over the 300 character limit.\n\nI’m hoping I can merge this quick so we can start migrating ATStore lexicons soon.","likes":1,"re":null},{"u":"byarielm.fyi","at":"2026-10-06T20:19:58Z","text":"Another, semi-related suggestion I’d like to add: including a `tagline` or related field. This seems like a common way folks list apps with a little more info in smaller cards. Apple equivalent is ~subtitle (30 char) or ~promo text (170 char), Google’s is a short description (80 char). A quick look through ATStore and Atmosphere Accounts (think they’re using the existing 300 char field) indicates lengths are median ~44-47 char, while 90% are within 89 and 75 char, respectively.\n\nSo my suggestion is adding:\n `“promoText”: {`\n `“type”: “string”,`\n `“maxLength”: 1000,`\n `“maxGraphemes”: 100,`\n `“description”: “A short promotional description of what the app does.”`\n `},`\n\nQuick look indicates ATStore, [atmosphereaccounts.com](http://atmosphereaccounts.com), [blueskydirectory.com](http://blueskydirectory.com), and Eurosky portal uses short descriptions.\n @joebasser.com for this one","likes":0,"re":null},{"u":"pixeline.be","at":"2026-10-06T20:20:30Z","text":"I don’t see any issue with this.\n Did you submit a PR on the GH repository? I did not get any notification.","likes":0,"re":69},{"u":"byarielm.fyi","at":"2026-10-06T20:21:03Z","text":"Just about to, and community lexicon is on tangled now: [Pulls · lexicon.community/lexicons · Tangled](https://tangled.org/lexicon.community/lexicons/pulls?state=merged&q=state%3Aopen&state=merged)\n\nEdit: Put up a PR for the 4,000 char limit. I have a fork branch ready for when that’s merged to add the tagline/short description, if that’s also agreeable.","likes":0,"re":71},{"u":"pixeline.be","at":"2026-10-06T20:36:22Z","text":"My only worry is the meaning of the field. Right now `description` is “a short description”, and directories will show it in cards and search results. With 4000 graphemes allowed, every consumer has to truncate it on their side, and each one will cut it in a different place.\n\nThe stores use two fields for this. Apple has a 30-char subtitle and Play has an 80-char short description, next to the 4000-char full text. I’d suggest we follow the same model:\n\n- keep description as it is (3000 / 300)\n- add an optional longDescription (40000 / 4000) to profile, entry and profileLocalization\n\nIt’s an additive change, so nothing breaks for apps that already validate against 300. For the ATStore migration you can put the full text in `longDescription` and the first sentence or two in `description` , so it shouldn’t slow down your migration.","likes":0,"re":70},{"u":"byarielm.fyi","at":"2026-10-06T20:37:11Z","text":"Yeah I could do that. Was one of the directions I thought of ha. Probably makes more sense this way actually, since folks may already be using it that way. Will update the PR","likes":1,"re":73},{"u":"byarielm.fyi","at":"2026-10-16T20:20:43Z","text":"Anyone have objections to adding a long description? @mfzx.net @yamarten.bsky.social @nikolas.ws\n\nPR is here: [Add app long descriptions up to 4000 characters · Pull #3 · lexicon.community/lexicons · Tangled](https://tangled.org/lexicon.community/lexicons/pulls/3/round/3)","likes":1,"re":null},{"u":"ngerakines.me","at":"2026-10-16T21:23:54Z","text":"No objection here. Ship it!","likes":1,"re":75}],"full":true},{"id":904,"ch":"Discussion","title":"Mapping web pages to canonical AT records","tags":[],"total":57,"last":"2026-10-09T19:49:00Z","posts":[{"u":"chrisshank.com","at":"2026-06-16T19:34:19Z","text":"I’d like to use this thread to riff on a community practice of mapping web pages to their canonical AT record. This is something that standard.site already does as a way to [verify](https://standard.site/docs/verification/) publications and their documents using `<link>` tags. Unfortunately Rich Harris [pointed out](https://bsky.app/profile/rich-harris.dev/post/3modibcucbk22) that this isn’t technically valid, so there is [discussion](https://bsky.app/profile/awarm.space/post/3modj2o2q722x) for a breaking change for standard site to use the `<meta>` tag. Making this work with any lexicon/record has quite important [ramifications](https://bsky.app/profile/chrisshank.com/post/3mogapsjyg225) for the entire ecosystem (I’m writing a short piece to better contextualize this right now).\n\nSummarizing some of the previous conversation, I proposed this:\n\n`<meta property=\"at:uri\" content=\"at://…\" />`\n\nMiguel [brought up](https://bsky.app/profile/aka.dad/post/3mogj2swans2k) that standard.site needs more than one record per page so it might make sense to append the NSID to the property. This could also make it easier to query:\n\n`<meta property=\"at:uri:<nsid>\" content=\"at://…\" />`\n\nBoris [mentioned](https://bsky.app/profile/bmann.ca/post/3mogji6umf22y) that at:did could be useful:\n\n`<meta property=\"at:did\"  content=\"did:plc:…\" />`","likes":11,"re":null},{"u":"bnewbold.net","at":"2026-06-16T19:50:06Z","text":"As a side-note, we (collectively) will need to figure out a path forward for AT URIs not being valid URI syntax as part of the IETF working group process. We are roughly scheduled to work on the repo and sync documents first, so it might even a while before there is a consensus solution.\n\nI think going ahead with a different HTML tag/setup is a reasonable choice in the near term. I think it would probably also be reasonable to just stick with the existing deployed system and syntax for a while longer.\n\nI’d nudge towards “at-uri” instead of “at:uri”, but that is just aesthetics. For better or worst, there is an “at-uri” syntax variant to refer to accounts, like “at://did:plc:abc123” (no path segment). A nice thing about full AT URIs is that the NSID is baked in to the URI itself, so you don’t need to have that be part of the “property” field. I think it is usually fine to have multiple of the same meta or link tag with the same property? So wouldn’t need to have separate property values for repeated tags.","likes":7,"re":null},{"u":"tynanpurdy.com","at":"2026-06-16T19:50:35Z","text":"I’m not gonna weigh in on the technical implementation because I know that’s not my wheelhouse.\n\nI do want to emphasize though that having some way on a page by page basis, and even cooler on an element basis, to indicate what AT record is being rendered would be hugely beneficial for interop between web clients of all kinds. Right now, a lot of interop and enhanced rendering of lexicon in contexts outside of the client in which are URLs shared involve a manual list of compatible clients and verified URL schemes. A stop gap for this is to include the full URI in the link, but that’s clunky as hell. If it were trivially easy to detect what record is being rendered by a webpage, then it becomes trivial to resolve that link and then pull down the record to do whatever kind of fancy embedding and rendering you’d like, regardless of what the domain name of the link is. Pair this with perhaps an on-protocol way to declare the URL scheme for a client app and what kinds of records it renders under what you were else schemes. Then you’ve got a really great system for interop between the web and atproto, where you always know what record you’re dealing with regardless of the front end that you’ve been directed to.\n\nIn practice, this could look like\n\nmyrandom.website/0hj3p2kehjk4j → at://uri\n bsky.app/0hj3p2kehjk4j → at://uri\n\nBoth of those could be equally easy to fetch the actual underlying record just from the link without having to know about myrandom.website ahead of time.","likes":6,"re":null},{"u":"bmann.ca","at":"2026-06-16T19:50:54Z","text":"> **chrisshank.com:**\n> Boris [mentioned](https://bsky.app/profile/bmann.ca/post/3mogji6umf22y) that at:did could be useful:\n> `<meta property=\"at:did\"  content=\"did:plc:…\" />`\n\nSpecific use case is for “claiming” pages. Standard Site does this kind of indirectly, but I should be able to put my DID in a page, and then in a system like Semble, “claim” that URL, and Semble could verify that. Very hand wavy description and I’m not set on this.\n\nAs well, `at:[something]` follows a vendored set of attributes like `og:`\n\nAram pushed us previously towards `Schema.org`, but regardless this conversation may be useful:\n\n[Ideas on extending Schema.org embed displays for atproto](https://discourse-tmp.atmosphere.community/t/ideas-on-extending-schema-org-embed-displays-for-atproto/631/)","likes":5,"re":null},{"u":"bmann.ca","at":"2026-06-16T19:51:28Z","text":"I’m putting the colon because I think we’re going to need more at properties. What’s your counter to that?","likes":2,"re":2},{"u":"bnewbold.net","at":"2026-06-16T19:58:17Z","text":"I edited/updated my post to talk about multiple properties. I think there is a fair amount of flexibility that can be done with a single property value. But doing colons aligns with opengraph. I don’t have a super strong opinion either way. Might be good to mock up examples with both syntax and try reading with common HTML parsing libraries (eg, beautifulsoup, CSS selectors) and see how they feel.","likes":3,"re":5},{"u":"chrisshank.com","at":"2026-06-16T19:58:24Z","text":"> **bnewbold.net:**\n> I think it is usually fine to have multiple of the same meta or link tag with the same property? So wouldn’t need to have separate property values for repeated tags.\n\nYa it’s valid to have [multiple open graph tags](https://ogp.me/#array) with the same property name.","likes":2,"re":null},{"u":"mfzx.net","at":"2026-06-16T20:07:11Z","text":"I would argue the usage of `<link>` tags for mapping pages to the DID of the controlling user is valid, and should be kept. The AT-URI can’t be used as an `href` because the syntax doesn’t accommodate for colons in the authority, but *the bare DID* would be correctly interpreted as a valid *URN* with the `did` scheme.\n\nI understand the desire for consistency between the methods for “linking to the record for this page” and “linking to the user for this page”, but I think it’s worth retaining the [existing `rel=me` method](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/me) for making the latter claim:\n\n```\n<link rel=\"me\" href=\"did:plc:erqwpimsmwnzohwoiojsy22z\" />\n```\n\n> **Edit:** The HTML specification states that `href` values must be URLs, so this usage is technically invalid. As mentioned in the first post in the thread, this causes issues for certain producers who validate the `href` as a URL, so I wouldn’t recommend this after all. Full support to `property=\"at:did\"` for this use case.","likes":3,"re":4},{"u":"byjp.me","at":"2026-06-16T20:56:24Z","text":"> **tynanpurdy.com:**\n> having some way on a page by page basis, and even cooler on an element basis, to indicate what AT record is being rendered would be hugely beneficial for interop\n\nI built a demo of this using RDFa lite — I put a demo Browser Extension together & set up two of my atproto sites ([StS2](https://sts2.byjp.me/did:plc:ephkzpinhaqcabtkugtbzrwu/3mn7o2o5zs255) & [Passing Reads](https://www.passingreads.org/books/54m5q9vp7e4auwzc8rqyzgkdxr)) to have the necessary tags to explore. [Try it out here](https://bsky.app/profile/byjp.me/post/3mlwb6jb3fk2o), or [see the Github repo](https://github.com/jphastings/where-its-AT).\n\nThe only downside is that RDFa also requires that a `resource` is an IRI, with the same issue of `did:plc:abc123` not being a valid authority.\n\nIf we’re interested in being able to tag *elements* as well as a whole page/document (I think we should be!) then just using `<meta>` is limiting, but also most mechanisms that feel “right” also expect valid URIs, so we’re in the same boat.\n\nI think the three options are:\n\n1. Accept that at-uris aren’t valid (yet) and use RDFa lite (or something similar) to allow tagging of pages and elements\n2. Use <meta> tags to link whole pages, and defer being able to tag element level\n3. Swap to something entirely custom (like data-at-uri=\"at://…\")\n\nI’m definitely in favour of (1), despite the authority issue, especially looking at the longer term — I’d be super interested to hear what excites you about this too @tynanpurdy.com; personally I love the idea of being able to right-click an interesting thing on an AT-powered website and explore it (with PDSls, with Aturi, go straight to Mu.social or any number of other things).\n\n(2) I think unblocks the issues standard.site has been having with at-uris not being valid URIs, though I think it misses the opportunity to bring element-level into the mix.\n\n(3) feels… less than ideal. It’s a bit like HTML microdata (but would support nested-but-unrelated at-uris)","likes":2,"re":3},{"u":"chrisshank.com","at":"2026-06-16T21:34:54Z","text":"If we end up with tags for records and dids then it makes me wonder what having one for a collection (feed?) or a user’s specific collection would mean?\n\n`<meta property=\"at:collection\" content=\"<nsid>\" />`\n `<meta property=\"at:uri\" content=\"at://<did>/<nsid>\" />`","likes":1,"re":null},{"u":"tynanpurdy.com","at":"2026-06-16T21:51:16Z","text":"To me, it is about following through on the promise that the data is separate from the app. When you share a link, you are now baking the app and the content together in transport. For all sorts of reasons, the client you were using to find a thing when you decided to share it with me may not be the client I want to use to view it. So to make that journey work from end to end, you need some way to preserve the distinguished relationship between the client and the content it is representing. Now, most of the time just labeling the webpage as a whole will do the trick, but I do foresee you get a ton of cool opportunities, especially at the browser level, when all the contents of a webpage can individually be associated with their source content.\n\nTo put it into a concrete example, let’s say I am on somebody’s custom hand rolled blog. The page as a whole is representing the standard site document. But viewable in line are comments from Bluesky. Let’s say this was a particularly spicy blog post and there are a ton of comments. If I want to open up this thread in one of the several different Bluesky tree thread viewers, I might have to click the post link out, which will probably take me back to the Bluesky app, which I may not even want to use and then I have to copy that Bluesky link and then take it to the tree, viewer and paste it it. That’s a lot of work and decisions about which client I interfaced with were made for me. Imagine instead, I could hover over that Bluesky post and the browser recognized what it was and offered me an option to open in a compatible client and I could pick my preferred tree viewer directly.\n\nAll in the interest of user agency.","likes":5,"re":9},{"u":"doriantaylor.com","at":"2026-06-16T22:12:50Z","text":"wat\n\nsince when are `at:` URIs (or `did:`) not valid in `href=`\n\nwhat is this business about it having to be a hostname\n\n`mailto:` is valid; `tel:` is valid…","likes":1,"re":null},{"u":"chrisshank.com","at":"2026-06-16T22:13:42Z","text":"I think per-element mappings to AT records are orthogonal with mapping web pages, they are both important. But right now if standard.site is going through with a breaking change then we have a small window of time to flesh out a more agnostic way to map web pages to AT records, and per-element mapping can be figured out in parallel. Many web pages will have both per-page and per-element mappings.","likes":3,"re":9},{"u":"mfzx.net","at":"2026-06-16T22:22:26Z","text":"[The syntax for URIs](https://datatracker.ietf.org/doc/html/rfc3986#section-3.2) only allows for colons to appear within the authority component when a numeric port is included as the second “segment” of the authority. It is possible to unambiguously differentiate `hostname:port` from `did:method:identifier`, but the presence of more than two “segments” and an non-numeric port “segment” conflicts with the specification, so most (if not all) producers and consumers outside of the ATP ecosystem reject `at:` URIs entirely when a DID is used as the authority. The `mailto:` and `tel:` schemes don’t allow for colons in their authority components, so they can be processed by any URI-handling code.","likes":2,"re":12},{"u":"doriantaylor.com","at":"2026-06-16T22:42:07Z","text":"oh iiiii see yeah `at:` and `at:/` and `at:///` would all be fine but `at://` will select `authority` rather than `path-rootless` or whatever\n\nbummer lol","likes":1,"re":14},{"u":"mfzx.net","at":"2026-06-16T23:09:07Z","text":"Open questions:\n\n1. Allowing for future extensions is wise, but I think the existing semantics of “link this page to a user and/or record” could be collapsed into a single segment-less property, if deemed more ergonomic than at:did/at:uri:`<meta property=\"at\" content=\"did:plc:erqwpimsmwnzohwoiojsy22z\" /> <meta property=\"at\" content=\"at://did:plc:erqwpimsmwnzohwoiojsy22z/standard.site.publication/3mn4tlpcnd42y\" /> ` I’m interested in what other types of ATP-related link relations you were envisioning. These two seem like the most “essential” ones to me, and it would make sense to promote them to a segment-less property.\n2. Which syntax should be required for referring to users, a bare DID or an AT-URI with no path? If the bare DID form is chosen, it may be preferable to provide a generic did property for use in both ATP and non-ATP contexts: <meta property=\"did\" content=\"did:plc:erqwpimsmwnzohwoiojsy22z\" />","likes":2,"re":5},{"u":"bmann.ca","at":"2026-06-16T23:11:58Z","text":"I think if you want to talk about other use cases than standard site – which wants to solve this NOW but also get *some* other input, that element tagging is out of scope for this thread.\n\nThat is, yes, (2) and using `<meta>` seems to be the likely desired path, and focusing on page-level meta.","likes":2,"re":9},{"u":"doriantaylor.com","at":"2026-06-16T23:22:10Z","text":"why is there a `//` in `at://` anyway if the thing it refers to isn’t a hostname? (even if it *is* a DNS name it may not even have an A/AAAA or CNAME record and doesn’t mean “connect to this host” like an ordinary URL—ie *locator*—means it anyway)\n\nif it’s any consolation tim berners-lee said the `//` was probably not necessary and he regrets putting it in there.","likes":1,"re":null},{"u":"mfzx.net","at":"2026-06-16T23:40:06Z","text":"I’ve been curious about this myself, and would even go as far as questioning the presence of an `at` scheme at all. The DID specification allows for [DID URLs](https://www.w3.org/TR/did-1.1/#did-url-syntax), which could be used with the `/{collection}/{rkey}` path syntax to refer to records; this form is equivalent to removing the `at://` prefix from an existing AT-URI. This form would be *fully compliant with URI parsers*, unlike AT-URIs. On the other hand, it does make sense to create a dedicated scheme for ATP, since a DID URL doesn’t specify any method for actually *locating* the resource it refers to, and applications would have to infer the process of resolving the DID document and fetching the record from the PDS.\n\nIn the end though, what was chosen for AT-URIs has to remain consistent even if better ergonomics and syntax are possible with different forms; existing records use `at://` and every service expects `at://`.","likes":1,"re":18},{"u":"doriantaylor.com","at":"2026-06-16T23:44:11Z","text":"yeah DIDs were designed to embed into URI syntax; they’re [just another URI scheme](https://www.iana.org/assignments/uri-schemes/uri-schemes.xhtml#:~:text=did).\n\nI thiiiiink @christian.bsky.social explained to me why `at:` exists at some point or other but it dissipated from my brain.\n\nI mean, it can still be a URL (qua “locator”) and not necessarily rely on DNS; (i mean, again, `mailto:` and `tel:` have dereferencing semantics and the latter is emphatically not DNS).","likes":1,"re":19},{"u":"pfrazee.com","at":"2026-06-17T00:43:13Z","text":"Two quick things\n\n1. Our bad. This incompatibility was an oversight when we put together the at:// url spec. It’s really a frustrating one too, because the DID scheme has provided very marginal value overall. But I digress. We should’ve caught this and I apologize for the trouble it’s causing now.\n2. Whatever the community chooses here is fine to me. There’s a lot of good understanding of the problem and standard site (and the surrounding decisions) has always been community driven.\n\nThat said, I do want to ask how pressing this issue is? As has been stated elsewhere, we do expect to address the core issue – likely through the IETF WG. If the pain here is low enough that it could sit for, say, a year, then we could just eat the short-term pain or writing workarounds in some of our tools.\n\nIf there’s energy to just move to the meta tags and people are good with it, then go for it. Just curious if it goes beyond a wart that got jammed up on svelte.","likes":5,"re":null},{"u":"chrisshank.com","at":"2026-06-17T02:19:03Z","text":"I think the `<link>` validity was more the spark to the conversation for me. The more interesting questions are can we reach consensus on a shared format that can work with for *any* AT record, how do we make this common practice across the atmosphere, and what are the downstream benefits for the ecosystem. I’m not sure that the way that standard.site is currently doing it with an NSID in the `rel` attribute would be the right approach to generalize.\n\nEven if `<link>` validity wasn’t a concern I think we would need to be careful not stepping on established web practices, even if they’re conceptually similar. `<meta>` personally feels like the compelling direction atm.\n\n```\n<link rel=\"canonical\" href=\"at://…\" />\n<link rel=\"me\"  href=\"did:plc:…\" />\n```\n\nvs.\n\n```\n<meta property=\"at:uri\" content=\"at://…\" />\n<meta property=\"at:did\"  content=\"did:plc:…\" />\n```","likes":2,"re":21},{"u":"pfrazee.com","at":"2026-06-17T02:57:52Z","text":"> **chrisshank.com:**\n> I’m not sure that the way that standard.site is currently doing it with an NSID in the `rel` attribute would be the right approach to generalize.\n\nIs that not what the `<link>` tag is designed for?","likes":1,"re":22},{"u":"byjp.me","at":"2026-06-17T06:08:27Z","text":"Element tagging is out of scope in this thread, but all else being equal, I’d be interested in `<meta itemprop>` as it both allows non-URI content (at:// is valid) and it’s *also* [allowed in flow content](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta#technical_summary). Meaning using it would resolve our standard site issue:\n\n```\n<head>\n  <meta itemprop=\"renders-at-uri\" content=”at://did:plc:whoever/site.standard.publication/abc123”>\n<head>\n```\n\nAnd leave the door open for discussing element tagging in a separate thread:\n\n```\n<blockquote>\n  <meta itemprop=\"renders-at-uri\" content=”at://did:plc:vc7f4oafdgxsihk4cry2xpze/app.bsky.feed.post/3l6n7c6cyx42i”>\n  people will think anything on bluesky. \"he's got thousands of followers! he must have good posts.\" no they aren't. that isn't true.\n<\/blockquote>\n```\n\nI really don’t want to restart the closed conversation about element tagging, but I wanted to highlight that—unlike `<link rel=\"canonical\">` tags ([see](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/link#:~:text=A%20%3Clink%3E%20element%20can%20occur%20either%20in%20the%20%3Chead%3E%20or%20%3Cbody%3E%20element%2C%20depending%20on%20whether%20it%20has%20a%20link%20type%20that%20is%20body%2Dok) [here](https://html.spec.whatwg.org/multipage/links.html#body-ok:~:text=canonical,-Hyperlink))—`<meta itemprop>` specifically is allowed in flow content *and* can hold any text we want (avoiding the URI issue).\n\n(I picked `renders-at-uri` as I think it’s semantically descriptive of what the link is *doing*—rather than eg. `at:uri` which, like the at-uri itself, is only descriptive of what it *is*—but I have no attachment to it specifically)","likes":2,"re":23},{"u":"essentialrandom.bsky.social","at":"2026-06-17T21:38:29Z","text":"Throwing in my strong support for stronger semantics in this representation, since it’s being rediscussed (I had meant to bring it up with the original design too, so it makes me happy to see :P)\n\nThe original issue being that:\n\n```\n<link rel=\"site.standard.document\" href=\"at://did:plc:xyz789/site.standard.document/rkey\">\n```\n\nis duplicating the same information twice, and tells me nothing(ish) about what that content actually is.\n\nIt also forces standardization over `standard.site.publication`, even if a different lexicon were to come along or I wanted to use mine.\n\nCompare to (syntax slightly apocryphal):\n\n```\n<meta rel=\"alternate\" content=\"at://did:plc:xyz789/my.own.lexicon/rkey\" />\n<meta rel=\"alternate\" content=\"at://did:plc:xyz789/site.standard.document/rkey\" />\n<meta rel=\"author\" content=\"at://did:plc:xyz789\" />\n```\n\nwhich tells me both records are an alternate representation of this page, and who the author is.\n\n### #p-3996-proposal-1Proposal\n\nFor an actual proposal, I think this could work by literally taking a page out of OpenGraph:\n\n```\n<meta property=\"at:author\" content=\"at://did:plc:xyz789\" />\n<meta property=\"at:alternate\" content=\"at://did:plc:xyz789/my.own.lexicon/rkey\" />\n<meta property=\"at:alternate\" content=\"at://did:plc:xyz789/site.standard.document/rkey\" />\n```\n\nWith this syntax, the part after `at:` in property encodes the semantic meaning of the link, and not its lexicon or data type.\n\n### #p-3996-encoding-uri-type-2Encoding URI type\n\nI’m not sure why it seems people want to encode `at:did` vs `at:uri` as part of the property itself. There may be a reason I’m not seeing, but it seems fairly easy to tell at parse time whether you’ve been handed a bare `did` or a full `uri`.\n\nThe one case I can think of where that’d be convenient is styling with CSS: selectors cannot distinguish an `AtUri` and a `Did`, and thanks to `:has()` you can now style body elements according to meta tags in the head. It’s very *cursed*, but you *can*.\n\nAnyway, if we *do* want to carry that distinction explicitly, it could be its own attribute without getting baked into the property name:\n\n```\n<meta data-at-type=\"did\" property=\"at:author\" content=\"at://did:plc:xyz789\" />\n```\n\n### #p-3996-extending-the-data-types-3Extending the data types\n\nThe above keeps the `property` slot meaning *what the record represents*, the way `og:title` / `og:description` / `article:author` do, rather than encoding the value’s shape.\n\nThis opens up a whole lexicon-agnostic layer of standardization on ATproto. Other things that could be standardized with the same system:\n\n- at:event => the event the page represents [edit:] an event mentioned on the page, see later reply)\n- at:replies-to => what this blogpost is written in reply to (e.g. another standard.site document)\n- at:tag => A list of tags (represented via AtUris not as strings, which will happen as soon as fanfictions people start building tagging systems)\n- at:copyright => Who owns the copyright of this content (their did)\n\nThere’s a lot of vocabularies one could take inspiration from, like [IANA link relations](https://www.iana.org/assignments/link-relations/link-relations.xhtml), [schema.org](http://schema.org), [dcterms](https://www.dublincore.org/specifications/dublin-core/dcmi-terms/)… people building will make up their own regardless, but we could settle on an obvious few to carry over (in a different thread).\n\n**Most important:** with this, my application doesn’t need to hard-code every possible `at:alternate` lexicon just to parse a page and check whether it carries a given property. This is unlike `site.standard.document`, where I’d have to know the lexicon up front. It also still hands me *more* information than a bare `at:did` or `at:uri` would, and allows for the same `AtUri` to appear more than once carrying different semantic meanings.","likes":4,"re":null},{"u":"mfzx.net","at":"2026-06-17T23:09:44Z","text":"Strong support towards `at:alternate` and `at:author`. Small notes:\n\n1. `at:event` seems like a slightly redundant specialization of `at:alternate`; both links carry the same base semantics (there is a record that corresponds to this page) and `at:event` would simply serve as a shortcut for consumers that only care about events, regardless of the actual collection being used. I think this shortcut, along with ones for other broad types of records, should be kept but placed in the `at:alternate` namespace to make this specialization explicit: `<meta property=\"at:alternate:event\" content=\"at://did:plc:…/community.lexicon.calendar.event/…\" /> <meta property=\"at:alternate:profile\" content=\"at://did:plc:…/app.bsky.actor.profile/self\" /> <meta property=\"at:alternate:track\" content=\"at://did:plc:…/fm.plyr.track/…\" /> ` Generic consumers can process each link as if they were `at:alternate` links without a specific type, and consumers focused on a specific app modality can skip past links that aren’t useful to them.\n2. I’d use a similar kind of specialization for `at:replies-to`, using the generic namespace `at:ref`: `<meta property=\"at:ref:bookmark_of\" content=\"at://did:plc:…/standard.site.document/…\" /> <meta property=\"at:ref:in_reply_to\" content=\"at://did:plc:…/app.bsky.feed.post/…\" /> <meta property=\"at:ref:review_of\" content=\"at://did:plc:…/sh.tangled.repo.pull/…\" /> <meta property=\"at:ref:rsvp_to\" content=\"at://did:plc:…/community.lexicon.calendar.event/…\" /> `","likes":1,"re":25},{"u":"essentialrandom.bsky.social","at":"2026-06-17T23:26:49Z","text":"To clarify `at:alternate` vs `at:event` (I did not do a good job in the original post) the difference to me would be:\n\n- `at:alternate` with `event` record ⇒ the page represents the event itself\n- `at:event` ⇒ the event is mentioned in the page, but is not the subject of the page (think a blogpost that’s promoting an event or was made as part of it).\n\nThat said, I would (personally) leave honing in on the full semantic to a side thread once people agree on the general direction. That seems an even longer discussion to have :stuck_out_tongue:","likes":3,"re":26},{"u":"spacegirl.ing","at":"2026-06-18T02:27:20Z","text":"I’ve been lurking but I just want to chime in and put support behind the `at:alternate` OpenGraph-style proposal.\n\n> **essentialrandom.bsky.social:**\n> The above keeps the `property` slot meaning *what the record represents*, the way `og:title` / `og:description` / `article:author` do, rather than encoding the value’s shape.\n\nNow that @essentialrandom.bsky.social points it out, it seems obvious that the `property` attribute has been mistakenly discussed as a shape-defining field rather than a semantic-defining field.\n\n> **essentialrandom.bsky.social:**\n> **Most important:** with this, my application doesn’t need to hard-code every possible `at:alternate` lexicon just to parse a page and check whether it carries a given property. This is unlike `site.standard.document`, where I’d have to know the lexicon up front. It also still hands me *more* information than a bare `at:did` or `at:uri` would, and allows for the same `AtUri` to appear more than once carrying different semantic meanings.\n\nI think this is important to highlight, reiterating the semantic vs shape difference and rebutting the proposed `at:{nsid}`-type format, that here the general principle is that the NSID of whatever lexicon is involved should not be in the *property* but in the *content*.","likes":0,"re":25},{"u":"doriantaylor.com","at":"2026-06-18T05:02:22Z","text":"Tangentially, how much would break if you ripped off the bandaid and got rid of the `//`?","likes":0,"re":21},{"u":"chrisshank.com","at":"2026-06-19T02:37:51Z","text":"thanks for articulating this @essentialrandom.bsky.social, @mfzx.net, and @spacegirl.ing, I’m on board with this direction! Some question on my mind are:\n\n- What is the smallest set of semantic properties for the ecosystem to reach consensus on?\n- I propose we start with three properties. Similar to Open Graph, I think they should follow [array semantics](https://ogp.me/#array).\n\n```\n<\!-- The DID of the web page's author -->\n<meta property=\"at:author\" content=\"at://<did>\" />\n\n<\!-- The canonical AT URI of the web page -->\n<meta property=\"at:uri\" content=\"at://<did>/<nsid>/<rkey>\" />\n\n<\!-- An open set of non-standard relationships of the web page. -->\n<meta property=\"at:rel:{...}\" content=\"...\" />\n```\n\n- How do we make the language extensible without harming future naming?\n- Name spacing all other relationships lets us keep the consensus small to start with, and to allow more non-standard/domain-specific relationships to naturally emerge out of the community. If an new ecosystem-wide property arises, governance over this standard should be able to easily amend it. For example, `standard.site` defining the publication of the web page.\n\n```\n<meta property=\"at:rel:publication\" content=\"at://did:plc:abc123/site.standard.publication/rkey\" />\n```\n\n- What does ecosystem governance of this look like? This is TBD, but maybe we can follow existing governance structures of standard.site or lexicon.community?\n- Are any of those properties required? (like Open Graph requires `og:title, og:type, og:image, og:url)`\n- I don’t think so. In some cases there might only be an author, in other cases there might only be a canonical URI.","likes":1,"re":25},{"u":"mfzx.net","at":"2026-06-19T03:58:02Z","text":"`at:uri` and `at:rel` would be the smallest set I’m comfortable with. `at:author` *may* be redundant if the page also includes a canonical `at:uri` link, and I’m not sure how a page that doesn’t include a canonical `at:uri` link would be making any useful claims. In my understanding, linking to a record with `at:uri` implies the page was authored by the referenced DID, a claim that can be verified by fetching the record and checking for lexicon-specific fields that link in the reverse direction; just linking to the author doesn’t allow for verification of the claim of authorship in the same way. Not entirely opposed to `at:author`, just wondering when it’s intended to be used, and what you make of the overlap between it and `at:uri`.","likes":0,"re":30},{"u":"essentialrandom.bsky.social","at":"2026-06-19T08:18:02Z","text":"Personally, I think `at:uri` does not convey enough meaning. Since it just sounds like the broad concept of an AtUri, people are likely to assume it means any generic `AtUri`, rather than look up whether it has stronger semantic.\n\nI’d prefer `at:canonical` and `at:alternate`, [modeled after the rel attribute](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel):\n\n- rel=\"canonical\" => Preferred URL for the current document. at:canonical => preferred AtUri for this page.\n- ref=\"alternate\" => Alternate representations of the current document. at:alternate => Other AtUris this page may represent.\n\nI’m ambivalent about prefixing thing with `at:rel:`, but I’m not strongly opposed. I think some allowance for namespacing is good in general. For example, I could see myself prototyping with e.g. `at:com.fujocoded:my-cool-idea`…even if it is a bit of a mouthful.\n\nThe semantic could be:\n\n- at:[name] => something there’s some agreement on, honor system\n- at:[namespace]:[name] => experimentation, or something based on an existing system (e.g. rel or org.schema).\n\n> **chrisshank.com:**\n> Similar to Open Graph, I think they should follow [array semantics](https://ogp.me/#array).\n\nAgreed.\n\n> **chrisshank.com:**\n> What does ecosystem governance of this look like?\n\nHard to tell, but that’s also where we can look at the current, concrete cases without trying to solve further out than what we can see now. Eventually, the collection in the `AtUri` does provide further meaning, so you can do a lot even if we start with a simple `at:alternate`.\n\n> **mfzx.net:**\n> Not entirely opposed to `at:author`, just wondering when it’s intended to be used, and what you make of the overlap between it and `at:uri`.\n\n`at:uri` is not enough to imply `at:author`: presence of the entry in a PDS does not mean the authorship is with the PDS’s owner. This is going to quickly become common with communities, but even now publications can have different authors that publish the content in the publication’s PDS. Sometimes there’s even multiple authors.\n\n### #p-4043-getting-concrete-1Getting concrete\n\nSince we have some examples of what caused issues, I would start with a couple `at:[name]`s that match those needs.\n\nOn standard.site I see these two:\n\n```\n<link\n  rel=\"site.standard.publication\"\n  href=\"at://did:plc:abc123/site.standard.publication/rkey\"\n/>\n<link\n  rel=\"site.standard.document\"\n  href=\"at://did:plc:xyz789/site.standard.document/rkey\"\n/>\n```\n\nAnd I also I have a concrete need for a way to represent events, and the people associated with a page.\n\nWhich means my concrete choices would be `at:canonical`, `at:alternate`, `at:author`, `at:me`.\n\nThis would allow for:\n\n### #p-4043-publication-main-page-2Publication main page\n\n```\n<meta property=\"at:canonical\" content=\"at://did:plc:abc123/site.standard.publication/rkey\" />\n```\n\n### #p-4043-article-page-3Article page\n\n```\n<meta property=\"at:canonical\" content=\"at://did:plc:xyz789/site.standard.document/rkey\" />\n<meta property=\"at:alternate\" content=\"at://did:plc:abc123/site.standard.publication/rkey\" />\n<meta property=\"at:author\" content=\"at://did:plc:author\" />\n```\n\n### #p-4043-event-page-4Event page\n\n```\n<meta property=\"at:canonical\" content=\"at://did:plc:xyz789/community.lexicon.event/rkey\" />\n```\n\n### #p-4043-personal-site-5Personal site\n\n```\n<meta property=\"at:me\" content=\"at://did:plc:my-did\" />\n```\n\nor even\n\n```\n<meta property=\"at:me\" content=\"at://did:plc:my-did/com.atprotofans.profile/self\" />\n```\n\nwhich also indicates my favorite profile to display me as.\n\n### #p-4043-extra-notes-6Extra notes\n\nAs a last thing, we could encourage people to do:\n\n```\n<meta property=\"...\" data-at-type=\"record\" data-at-collection=\"site.standard.publication\" content=\"at://did:plc:abc123/site.standard.publication/rkey\" />\n```\n\nSo that people who requested that this info can be surfaced more easily, can have a way not to parse the whole thing. However, we should still consider “content” as the ultimate source of truth, and this as a convenience.\n\nIn the meantime, to give people space to experiment, `at:[namespace]:[name]` should also be considered valid by any tooling built around this.","likes":4,"re":null},{"u":"bmann.ca","at":"2026-06-20T04:07:01Z","text":"@chrisshank.com governance is a place where these things are documented.\n\nMoving it into a git repo is probably a good move as iterations slow / stop.\n\nMaybe Ms Boba’s post here is pretty close to final?\n\nAnd realistically — adoption. Does this solve Standard Sites problem? Will that change be implemented quickly? What other apps (including a PR to the Bluesky app) might adopt this now?\n\nIs this helpful for Sill or Semble?\n\nAnd then we see what happens and what other needs come up.","likes":2,"re":32},{"u":"chrisshank.com","at":"2026-06-22T21:09:00Z","text":"Thanks for sharing you’re thoughts @essentialrandom.bsky.social! I really like the core properties being `at:canonical`, `at:alternate`, `at:author`, `at:me`, and everything else being a custom namespace.\n\n- Wondering ifat:author should have the same profile semantics as at:me? Or maybe we should hold off on linking to a profile record until the community has more consensus on profile lexicons?\n- I do worry that at:alternate is a little too abstract. Based on you described it I’m sort of thinking about it as “AT URIs that contextualize the canonical AT record”. That results in an implicit relationship between the lexicons of at:canonical and at:alternate. For example, if I’m making a standard.site reader, I would first find the at:canonical, if it’s NSID is site.standard.document, then I would then try to find the publication by looking up the at:alternate with a site.standard.publication NSID. As opposed to just looking up the at:standard.site:publication property (or whatever it ends up being called).","likes":0,"re":32},{"u":"bnewbold.net","at":"2026-06-23T20:17:18Z","text":"I haven’t done a ton of research, but I like the direction of @essentialrandom.bsky.social’s proposal here.\n\n`at:canonical` and `at:alternative` make sense to me. Separate `at:author` (meaning the author of the content in this specific page/URL) and `at:me` (meaning an account associated with the overall website or section of website) make sense to me. The `at:me` mechanism somewhat overlaps with the handle resolution mechanism when it comes to domain names, but folks often have multiple or different domains associated with an overall online persona. Eg, you might have `username.gitforge.io` as a technical blog and want to associate that with `@userna.me` as a shorter social handle.","likes":2,"re":32},{"u":"doriantaylor.com","at":"2026-06-23T21:25:52Z","text":"just a quick footnote here that there is a whole schwackadoo of prior art here going back like two decades, eg the [open graph schema looks like this](https://github.com/facebook/open-graph-protocol/blob/master/ns/ogp.me.ttl); dublin core ([which looks like this](https://www.dublincore.org/specifications/dublin-core/dcmi-terms/)) is even older, and of course there is [schema dot org](https://schema.org/). link relations in general are a wheel that do not need reinventing.\n\nIf you insist, though, the polite thing to do would be to yoke the terms to other schemas via [`owl:equivalentProperty`](https://www.w3.org/TR/2012/REC-owl2-syntax-20121211/#Equivalent_Object_Properties) and [`rdfs:subPropertyOf`](https://www.w3.org/TR/rdf12-schema/#ch_subpropertyof).","likes":0,"re":null},{"u":"mfzx.net","at":"2026-06-23T21:56:50Z","text":"As far as I know, all prior work on link relations assumes links are well-formed URIs, which is incorrect for AT-URIs as explained previously. It would be nice to be able to naively use `<link rel=\"canonical\" href=\"at://did:plc:…/site.standard.document/…\" />` and so forth, but defining our own mechanisms for link relations allows us to define ATP-specific semantics that prior work has no concept of.","likes":1,"re":36},{"u":"mfzx.net","at":"2026-06-23T22:21:17Z","text":"For `at:author` and `at:me`, will the recommended syntax be a bare DID or an AT-URI with no path? My personal preference would be a bare DID. Should both forms be allowed, or should it be strictly one or the other?","likes":0,"re":null},{"u":"doriantaylor.com","at":"2026-06-24T00:32:37Z","text":"link relations with a prefix are just [a prefix mapping](https://www.w3.org/TR/rdfa-core/#A-prefix).\n\n`<link prefix=\"at: https://authority.lol/ns/atproto#\" rel=\"at:potato\" href=\"did:plc:hlguahglaugahgl\"/>`\n\nif there’s a problem with the reference not being a valid URI then I suppose you could do\n\n`<meta property=\"at:potato\" datatype=\"at:AtProtoNotAURIWoopsie\" content=\"at://whatever.lol\"/>`\n\n(I mean, I would just rip the bandaid off and change that before it gets really, reeeeallly baked in there)","likes":0,"re":37},{"u":"essentialrandom.bsky.social","at":"2026-06-24T10:07:34Z","text":"> **doriantaylor.com:**\n> just a quick footnote here that there is a whole schwackadoo of prior art here going back like two decades, eg the [open graph schema looks like this](https://github.com/facebook/open-graph-protocol/blob/master/ns/ogp.me.ttl); dublin core ([which looks like this](https://www.dublincore.org/specifications/dublin-core/dcmi-terms/)) is even older, and of course there is [schema dot org](https://schema.org/).\n\nAs I was mentioning above\n\n> **essentialrandom.bsky.social:**\n> There’s a lot of vocabularies one could take inspiration from, like [IANA link relations](https://www.iana.org/assignments/link-relations/link-relations.xhtml), [schema.org](http://schema.org), [dcterms](https://www.dublincore.org/specifications/dublin-core/dcmi-terms/)… people building will make up their own regardless, but we could settle on an obvious few to carry over (in a different thread).\n\nI’ve done a lot of research in my time about schemas like this, and I went specifically to look at them again when I proposed the above. The issue being: even having some previous (old-ish) knowledge of this, I could not come up with a proposal from them that would be immediately parsable by most.\n\nThere is more nuance to these vocabularies than someone who doesn’t have an in-depth understanding of these can “just get”. This would make an excellent working group where people who know this deep history could come up with a set of recommendations that are easy to adopt for other cases. In the meantime, the need is concrete and a solution already shipped (and broke), which is why basing it on rel links makes sense to me. Good enough for now, safe enough to try, not *completely* made again from scratch.\n\nWe don’t have to reinvent things, but for the very simple case, this seems a good shortcut that gives an on ramp without closing off future work. A thread on adapting previous vocabularies in would be very welcome.","likes":1,"re":null},{"u":"essentialrandom.bsky.social","at":"2026-06-24T10:41:39Z","text":"> **chrisshank.com:**\n> I do worry that `at:alternate` is a little too abstract. Based on you described it I’m sort of thinking about it as *“AT URIs that contextualize the canonical AT record”.* That results in an implicit relationship between the lexicons of `at:canonical` and `at:alternate`.\n\nI saw it more as “alternate representations of the content on this page”. MDN says of canonical:\n\n> Preferred URL for the current document.\n\nSo `at:canonical` would be like “the preferred AtURI when referring to this page”. The “if you gotta choose one, this is the most appropriate”.\n\nAlternate is:\n\n> Alternate representations of the current document.\n\nSo this is other AtURIs the current document could represent. Imagine for example a page that has a blog post but the website (or post) is also about a certain event. You could use `at:alternate` to indicate that the page is also representing an event. It doesn’t say *too much* about what the relationship is, but it gives a hint. If you drop that page in a event viewer, it can choose to use the hint to e.g. let you RSVP.\n\n> **chrisshank.com:**\n> For example, if I’m making a standard.site reader, I would first find the `at:canonical`, if it’s NSID is `site.standard.document`, then I would then try to find the publication by looking up the `at:alternate` with a `site.standard.publication` NSID. As opposed to just looking up the `at:standard.site:publication` property (or whatever it ends up being called).\n\nMaking a `at:publication `(or `at:standard.site:publication`) still remains open as future extensions! People may try to use the more precise type if/when one exists, but it’s good to have a generic fallback so there isn’t an explosion of types just because. The ecosystem already ““knows”” (or is trying to figure out) how to handle NSIDs, and this is a way to help them find them by looking up simple properties. Then it may also help add more precise context where there’s available grammar (e.g. me vs author) not representable in the record itself.\n\nI don’t think we should hurry into a bunch of namespaces/properties that we don’t have a discoverability or grammar history for, especially when they just duplicate existing info. It doesn’t feel impossibly harder to aggregate `at:alternate` and get the NSID (and we can add `data-` properties to help), but it will spare us a lot of chaos and confusion in the future.\n\n> **mfzx.net:**\n> Should both forms be allowed, or should it be strictly one or the other?\n\nYou can try to mandate one, but I think the history of the web shows “people will be people and there’s a vested interest in being accommodating”. The old software adage “be liberal on what you accept but precise in what you return” comes to mind: there should be The Preferred Format™ (I’m for consistency, so all with `at://`), but enforcement may be less strict.","likes":3,"re":null},{"u":"rochebit.net","at":"2026-06-25T12:09:13Z","text":"I’ll add another +1 liking the at:canonical and at:alternate proposals, but I think that current usage I’ve seen of the site.standard.document property in link tags is intentionally different.\n\nI agree with how you’ve defined canonical and alternate, which is representative of the historical usage beyond atproto. I expect that some services will interpret both of those as indications that instead of sending a user to that page, they should direct the user to a rendering (either within that service or on another app) of the atproto content. This is a great flow when the lexicons can be natively supported, and is currently how bsky.app links (who’s pages set the alternate link tag) are handled in mu.social - it just opens mu.socials rendering of that page rather than sending the user to the actual page linked.\n\nBut I’ve also seen many blogs use this alternate meta tag, and I’m not sure if they would be expecting mu.social to do the same thing if mu.social started natively supporting rendering this site.standard.document lexicon. Especially with the current state of analytics in atproto, the author get’s something tangibly different depending on where the content is consumed. So I think we still need another “base” property (e.g, at:related) to indicate the connection to the post (validating 2-way linking, etc) without impacting user flow. We could say then they should continue to use the lexicon as the property (like is done now with site.standard.document), but I think there is value in having a unified cross-lexicon version.","likes":1,"re":null},{"u":"chrisshank.com","at":"2026-07-03T20:22:46Z","text":"Close to finishing a draft of this community protocol and a small reference implementation/test suite. In the mean time I did stumble upon some more history about this topic:\n\n- older discussion about a atprotocol:creator property. semble is using tag <meta name=\"atprotocol:creator\" content=\"at://did:plc:bnqkww7bjxaacajzvu5gswdf\">\n- Frontpage is also adding <link rel=”alternate”> with at URIs.\n- Mu.social incorporating events.\n- Leaflet attempts to parse AT URIs from bluesky clients using the alternate embed link.\n\n```\n<link rel=\"alternate\" type=\"application/json+oembed\" href=\"https://embed.bsky.app/oembed?format=json&amp;url=at%3A%2F%2Fdid%3Aplc%3Aukp7pzzht32uigg6bg4vxr5t%2Fapp.bsky.feed.post%2F3mpjy3qyzyk2m\">\n```","likes":2,"re":null},{"u":"chrisshank.com","at":"2026-07-08T05:13:28Z","text":"Here’s the first draft of the community proposal + reference implementation. Happy for any feedback, might be best to do that on tangled though.\n\n[chrisshank.com/at-tags](https://tangled.org/chrisshank.com/at-tags/)","likes":3,"re":null},{"u":"jauntywk.bsky.social","at":"2026-07-09T22:02:05Z","text":"I want to second my strong interest in element tagging, which I admit is somewhat out of scope, but also, it seems like this is such an elegant way to get both!\n\nI filed at-tags#1 before seeing the discussion here.\n\n[Representing multiple resources, ala microdata #1](https://tangled.org/chrisshank.com/at-tags/issues/1)","likes":1,"re":24},{"u":"bnb.im","at":"2026-07-22T04:30:45Z","text":"Just wanted to voice support for this. I’m building an AT Protocol native link aggregator and I’d like to support users dropping in a link to any `app.bsky.feed.post` record, regardless of web UI, and have it render as a post rather than as a link.\n\nRight now it’s exceptionally hard to do that, it doesn’t really seem like there’s a way to sniff any platform except for Blacksky. I can hack it with Bluesky but it’s not ideal.","likes":3,"re":null},{"u":"chrisshank.com","at":"2026-07-22T20:20:43Z","text":"@jauntywk.bsky.social once we nail head tags, I would love to sort out element tagging.\n\n@bnb.im love to hear about examples like this!\n\nI’m planning to update the draft to use the standard `name` attribute, rather than the non-standard `property` attribute that Open Graph uses. The WHATWG considers OG tags an [incomplete proposal](https://wiki.whatwg.org/wiki/MetaExtensions#Proposals_That_Don't_Meet_the_Requirements_For_a_Registration) because of this. I checked in with the [HTML standard](https://html.spec.whatwg.org/multipage/semantics.html#other-metadata-names) and I don’t think there are any concerns of collisions, nor has anyone [claimed](https://wiki.whatwg.org/wiki/MetaExtensions#Meta_Name_Extensions) the `at:` namespace yet. This means the latest draft is:\n\n```\n<meta name=\"at:canonical\" content=\"at://did:plc:xyz789/nsid/rkey\" />\n\n<meta name=\"at:alternate\" content=\"at://did:plc:abc123/nsid/rkey\" />\n\n<meta name=\"at:author\" content=\"at://did:plc:author\" />\n\n<meta name=\"at:me\" content=\"at://did:plc:my-did\" />\n```\n\nIt’s worth noting that link relationships are also [extendable](https://html.spec.whatwg.org/multipage/links.html#concept-rel-extensions) and no one has [claimed](https://microformats.org/wiki/existing-rel-values#HTML5_link_type_extensions) the `at:` namespace for them either. I also learned that the IndieWeb [drafted a spec](https://indieweb.org/rel-atproto) for the `atproto` rel, but its for linking the ATProto profile URL, not a DID. I’m still in the boat that we shouldn’t be using `<link>` though.","likes":1,"re":null},{"u":"bnb.im","at":"2026-07-22T21:22:03Z","text":"does the set of `name` values need to be bounded? It could be *extremely* interesting to do `<meta name=\"at:lexicon:<$type>\" content=\"at://did:plc:abc123/nsid/rkey\" />`\n\nthat way it’s more extensible in the future for whatever `$type`s become mainstream","likes":0,"re":47},{"u":"chrisshank.com","at":"2026-07-22T22:32:06Z","text":"@bnb.im the proposal includes namespaces for additional relationships to be defined, so the community is more than welcome to add their own AT-specific relationships.\n\n[Namespaces - chrisshank.com/at-tags](https://tangled.org/chrisshank.com/at-tags/#namespaces)\n\nAs we talked about earlier in the thread, I would be weary of lexicon specific tags as we are more trying to define semantic relationships rather than the shape of a relationship.\n\n> **spacegirl.ing:**\n> I think this is important to highlight, reiterating the semantic vs shape difference and rebutting the proposed `at:{nsid}`-type format, that here the general principle is that the NSID of whatever lexicon is involved should not be in the *property* but in the *content*.","likes":0,"re":null},{"u":"essentialrandom.bsky.social","at":"2026-07-23T07:16:41Z","text":"Catching up after some out-of-the-loop time!\n\n@chrisshank.com, thank you so much for writing out the proposal (and for holding the “[keep lexicon types out of tags](https://discourse.atmosphere.community/t/mapping-web-pages-to-canonical-at-records/904/25)“ fort :smiling_face_with_horns:).\n\nSpeaking of, the current draft indicates namespaced properties as `at:<namespace>:<property>`, which means `at:lexicon:app.bsky.feed.post` is a perfectly valid tag. I wouldn’t want to close off the system to avoid this happening, but I would spell the “this is about semantic meaning, not lexicon” more strongly in the spec.\n\nSpeaking of which, [the example in that same section](https://tangled.org/chrisshank.com/at-tags/#namespaces) uses `<meta name=\"at:standard.site:pub\" content=\"at://.../site.standard.publication/...\" />` which breaks this nuance at first glance. A better example may be something like `<meta name=\"at:standard.site:syndicated-by\" content=\"at://.../site.standard.publication/...\" />` to indicate that the *publication* syndicates this content.\n\nThe way I’d frame it is:\n\n- name should add additional nuance that the content by itself doesn’t carry ⇒ deleting name should result in a meaningful loss of…well, meaning\n- the “AtUri” carries the record type, but the name tag carries the relationship of the record to the page (before: “the record in this page is a publication”, after: “this page is syndicated by the publication in this record”.)\n\nI know people have repeatedly brought up using `at:{nsid}` here, which is why I believe it’s important to document a rule of thumb for how to tell whether it’s a good idea.\n\nHappy to open a PR if there’s support for this!","likes":1,"re":null},{"u":"chrisshank.com","at":"2026-07-23T19:38:38Z","text":"@essentialrandom.bsky.social I’ll add that context and fix that example!\n\nIn other news, the biggest point of contention with this proposal about whether to use `<link>` or `<meta>` tag might have been answered today at IETF. It doesn’t sound like they will be moving forward with updating the URI spec, which, to my understand, means we can’t use `<link>`.\n\n[Tynan Purdy ⁂ (@tynanpurdy.com)](https://bsky.app/profile/tynanpurdy.com/post/3mrdjxjy4nk2y)\n\nI’ve also drafted PR that implement this proposal for the social-app and semble\n\n[Add meta tags for AT URIs (#11243)](https://github.com/bluesky-social/social-app/pull/11243)\n\n[update meta tags (#837)](https://github.com/cosmik-network/semble/pull/837)\n\n[Add meta tags for AT URIs (#164)](https://github.com/eurosky-social/eurosky-social-app/pull/164)\n\n[Add meta tags for AT URIs (#365)](https://github.com/hyperlink-academy/leaflet/pull/365)\n\n[Add AT Tags support to the website and browser extension ·...](https://tangled.org/atpota.to/aturi/commit/fc6101c41f7a15c4777c1352a9019ecafee2d309)","likes":2,"re":50},{"u":"chrisshank.com","at":"2026-07-24T02:23:06Z","text":"I created a discussion on per-element microdata format [here](https://discourse.atmosphere.community/t/at-microdata-format/992).","likes":1,"re":null},{"u":"chrisshank.com","at":"2026-07-25T16:29:47Z","text":"First proposal for a custom property that defines the AT record for a blogs comment section.\n\n[Custom property for a blog's comments #2](https://tangled.org/chrisshank.com/at-tags/issues/2)","likes":1,"re":null},{"u":"gui.do","at":"2026-07-30T12:11:32Z","text":"Shipped the head-tag version on [Sifa ID](https://www.sifa.id) yesterday and the pages are already rendering with this on Sifa profiles. A single profile page renders records from across (currently) 16 collections: positions, skills, certifications, talks. E.g. [my own profile](https://sifa.id/p/gui.do) renders 380 records. Personal pages.sifa.id websites also split those across per-section pages, so career.html and education.html render different subsets and emit identical head tags.\n\nThe head tags only ask which record the page *is*. There is one answer (the profile record) and zero alternates. Something like a career or education entry isn’t another *version* of the page, it’s a *piece* of the page/your CV.\n\nSo the head is complete at one tag, describes none of the 380 pieces, and can’t tell two of those pages apart. Not that this blocks me, the pages work fine as they are.\n\nBut if element-level tagging happens, the `itemid` variant makes sense to me: a career entry *is* a record with its own identity, not a property of the div that renders it.\n\nHappy to be a test case :slight_smile:","likes":2,"re":null},{"u":"tynanpurdy.com","at":"2026-07-31T19:23:35Z","text":"Thanks for sharing Guido. Perhaps this reveals a case for a page tag not targeting a particular record URI, but a lexicon collection? Though I would wonder what the linking purpose behind that would be. My inking would be that if a page doesn’t represent any one particular record that it simply should not tag one. There are going to be lots of webpages in this situation, namely any page that shows an aggregation of multiple records. A Sifa page that shows, for example, all of my professional experience, doesn’t represent a single canonical record. Maybe linking to my profile record makes sense if the page is scoped to just *my* experiences. But that’s a product decision for you. I largely agree that element tagging is what will cover these use cases. A feed on Mu, for example, might use the feed definition record as the canonical, with individual posts tagged with their own post URIs.\n\nAll this to say, if there isn’t a clear canonical record, it’s ok not to tag one!","likes":4,"re":54},{"u":"jimray.bsky.team","at":"2026-10-01T22:19:24Z","text":"Hey all, I started a new thread that’s very germane to this one and also includes a few more ideas as we continue exploring how to bring more of the Atmosphere into the Bluesky app.\n\n[Connecting records, web pages and apps](https://discourse.atmosphere.community/t/connecting-records-web-pages-and-apps/1303)","likes":3,"re":null},{"u":"snarfed.org","at":"2026-10-09T19:49:00Z","text":"Fwiw, as more prior art here, [ActivityPub Discovery](https://swicg.github.io/activitypub-html-discovery/) describes the fediverse corrolary to exactly this problem.","likes":2,"re":null}],"full":true}]};

  <nav aria-label="Channels">
    <button class="nav-item ${r.v === 'latest' ? 'on' : ''}" data-act="latest"><span class="ico">${I.home}</span><span class="lbl">Index</span>${total ? `<span class="count" title="${total} unread across all channels">${total}</span>` : ''}</button>`;

  for (const [d, dir] of Object.entries(DIRS)) html += `<button class="nav-item ${here === d ? 'on' : ''}" data-act="dir" data-dir="${d}"><span class="ico">${I[dir.icon]}</span><span class="lbl">${dir.label}</span></button>`;
  html += `<button class="nav-item ${here === 'events' ? 'on' : ''}" data-act="events"><span class="ico">${I.calendar}</span><span class="lbl">Events</span></button>`;
  if (u?.staff) html += `<button class="nav-item ${r.v === 'review' ? 'on' : ''} ${REVIEW.length ? 'unread' : ''}" data-act="review"><span class="ico">${I.review}</span><span class="lbl">Review</span></button>`;
  // MAIN holds pinned channels (pinning itself isn't built yet); other sections follow.
  const pins = ['Discussion', 'Resources & Learning', ...(u && u.tl > 0 ? ['ATmosphereConf', 'Community Infrastructure', 'ATProto Science'] : [])];
  // Event channels open their Events tab; the rest open the channel.
  const item = (c) => {
    const n = channelBadge(c), tab = evTabOf(c);
    const on = tab ? (r.v === 'events' && r.tab === tab) || hereCh === c : hereCh === c;
    return `<button class="nav-item ${on ? 'on' : ''} ${n ? 'unread' : ''}" ${tab ? `data-act="evtab" data-tab="${tab}"` : `data-act="channel" data-key="${c.key}"`}><span class="ico">${chIcon(c)}</span><span class="lbl">${esc(c.title)}</span></button>`;
  };
  const dirChs = (d) => CH.filter((c) => (d === 'events' ? evTabOf(c) : dirOf(c) === d) && can.see(c));
  const dirLabel = (d) => (d === 'events' ? 'Events' : DIRS[d].label);
  const pinned = pins.map((n) => chan[n]).filter((c) => c && can.see(c)), everyCh = CH.filter((c) => can.see(c));
  // On Index, "show all" reveals every directory with all its channels.
  const allMain = r.v === 'latest' && S.sideAll === 'main';
  const loose = CH.filter((c) => c.section === 'Community' && !dirOf(c) && !evTabOf(c) && !pinned.includes(c) && can.see(c));
  html += `<div class="sec"><span>Main</span></div>${[...pinned, ...(allMain ? loose : [])].map(item).join('')}`;
  if (r.v === 'latest') {
    if (allMain) for (const d of [...Object.keys(DIRS), 'events']) {
      const cs = dirChs(d);
      if (cs.length) html += `<div class="sec"><span>${dirLabel(d)}</span></div>${cs.map(item).join('')}`;
    }
    if (everyCh.length > pinned.length) html += `<button class="side-all" data-act="sideall" data-dir="main">${allMain ? 'show fewer' : `show all ${everyCh.length} channels`}</button>`;
  }
  for (const s of sections.filter((s) => s !== 'Community')) {
    const cs = CH.filter((c) => c.section === s && !dirOf(c) && !evTabOf(c) && can.see(c));
