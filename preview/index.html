pe or Domain. Those are useful as human-readable entry points, but they shouldn’t be the foundation of the lexicon. The foundation should be these lower-level signals, from which higher-level groupings can be derived.\n\nI’m very interested in collaborating on a minimal version of this.\n I can also share my current dataset (~75 apps) to test different approaches against something real.\n\nAlso +1 on the “garden” framing — it fits well with the idea of something that grows organically rather than being strictly defined upfront.\n\nalso a last thought: we could probably also do an analysis of what [schema.org](http://schema.org) for apps [SoftwareApplication - Schema.org Type](https://schema.org/SoftwareApplication) can teach us","likes":3,"re":41},{"u":"apex.atproto.ceo","at":"2026-03-18T20:21:23Z","text":"Really wish I had known this existed before I finished and published [AlternativeProto](https://alternativeproto.net)! Though my app does specifically aim to list alternatives to existing non-atproto apps, not just atproto apps in general, and the lexicon reflects that. Nonetheless I’d be happy to switch and just do the “alternative to” thing using a sort of sidecar record.","likes":2,"re":null},{"u":"byarielm.fyi","at":"2026-03-18T20:32:12Z","text":"Ha sorry I didn’t catch you before you worked on it! But I think it’s good to have folks who have actually built these things out already, gives a better framing for the minimal set for community lexicons.\n\nAnd given I have almost 200+ apps (apps, not even including tools) in my semble collection, a central lexicon hub developers can submit to will be useful - even if others want to expand with more detail for their own use cases.","likes":1,"re":45},{"u":"zicklag.dev","at":"2026-03-19T00:06:35Z","text":"> **byarielm.fyi:**\n> And given I have almost 200+ apps (apps, not even including tools) in my semble collection,\n\nWow, that’s crazy. :astonished_face:","likes":0,"re":46},{"u":"pixeline.be","at":"2026-03-19T10:09:21Z","text":"This thread has surfaced a lot of good perspectives and directions.\n\nA possible next step would be to start moving from discussion into action. What do you think about the [working group template](http://discourse-tmp.atmosphere.community/t/lexicon-community-working-group-template/576) shared by @bmann.ca in the initial post ? Should we set up a WG to design a community “App” lexicon ? Personally, I’m in!","likes":3,"re":null},{"u":"byarielm.fyi","at":"2026-03-21T03:44:52Z","text":"Yup I think this is the next reasonable step! I’d be happy to be involved w the WG but can’t commit to lead on either front (comms or WG lead).\n\n@bmann.ca do we just work on that in here and when we come to a consensus set a new thread? The template explains what to fill in / setup but not if there’s how/where to work/establish a filled-in template.","likes":2,"re":48},{"u":"bmann.ca","at":"2026-03-21T05:51:34Z","text":"Thanks for digging in!\n\nI think I can be your TSC point of contact while I’m still on it :wink: basically I bug the lead for updates once a month.\n\nTheoretically everyone is in Vancouver next week and could talk live too.\n\nI’d say make a new thread posting the template in. I can turn on wiki mode so y’all can group edit.\n\nWe can make a dedicated category here if you want, eg like Lexicon Community > Community Lexicon Calendar","likes":0,"re":49},{"u":"pixeline.be","at":"2026-03-21T12:01:48Z","text":"I’ve started working on a lexicon proposal based on this discussion. Would this work as NSID: `community.lexicon.app.entry` or directly `community.lexicon.app` ?\n\nFor now, i went ahead with the former [pixeline.be/community.lexicon.app.entry at main](https://tangled.org/pixeline.be/community.lexicon.app.entry)","likes":4,"re":null},{"u":"zicklag.dev","at":"2026-03-21T22:37:25Z","text":"I don’t have a ton strong focus for this with my attention dedicated to Roomy & the conference at the moment, but I do want to get a little more involved in some ATProto stuff and will give some best effort involvement.","likes":1,"re":48},{"u":"zicklag.dev","at":"2026-03-21T22:39:57Z","text":"> **pixeline.be:**\n> Would this work as NSID: `community.lexicon.app.entry` or directly `community.lexicon.app`\n\nHmm, it feels maybe best to have it scoped so that it could be alongside other record types like `app.collection` or something like that.","likes":1,"re":51},{"u":"pixeline.be","at":"2026-03-22T08:50:52Z","text":"yes, my thoughts exactly ( app.review)","likes":0,"re":53},{"u":"deniz.blue","at":"2026-03-23T18:13:08Z","text":"It would be nice if this lexicon could also embed information about what kind of records under a collection has a special page for it. For example, BlueSky clients handle profiles and posts by their own lexicons. Events have their own pages. This could be used to have very simple to implement redirectors like [aturi.to](https://aturi.to) or [eventsl.ink](https://eventsl.ink)","likes":2,"re":null},{"u":"byarielm.fyi","at":"2026-03-28T20:51:41Z","text":"Anyone from this group at AtmosphereConf and want to meet on this?","likes":1,"re":null},{"u":"grishalr.protoimsg.app","at":"2026-03-29T02:04:55Z","text":"> It would be nice if this lexicon could also embed information about what kind of records under a collection has a special page for it.\n\nyes, agreed 100%! it would replace the manual mapping im doing.","likes":0,"re":55},{"u":"chefkene.bsky.social","at":"2026-03-29T21:31:01Z","text":"Hi all, @erlend.sh saw a post of mine on bsky and shared this discussion with me and I wanted to share some practical experience that might be useful.\n\nI’ve been building an ATProto App Directory powered by LinkedClaims: [ATProto App Directory — powered by LinkedClaims](https://demos.linkedtrust.us/appviews/). It currently lists 22 apps and appviews with community ratings where every review is a verifiable claim tied to the reviewer’s Bluesky identity.\n\nA few things I’ve learned from building this that might inform the lexicon design:\n\nOn app entries: Right now I’m maintaining a static list of apps with fields like name, URI, description, and type (app vs appview). This is exactly the kind of manual mapping that a standardized community.lexicon.app record would eliminate. Being able to discover app entries from the network rather than curating a list by hand would be a huge improvement.\n\nOn reviews/ratings: Each rating in the directory is stored as a verifiable claim with: subject (the app URI), star rating, a text statement, and a sourceURI (the reviewer’s Bluesky profile). Anyone can verify a review on LinkedTrust. If the group is considering scoping for something like app.review alongside app.entry, I’d be happy to share more about this data model and what’s worked.\n\nOn record types (re: @deniz.blue’s point): I’m currently doing manual type mapping (app vs appview) with badge rendering for each. Embedding that kind of metadata in the lexicon so clients know how to handle different record types would definitely simplify things.\n\nHappy to demo this for anyone interested, and I am joining remotely at AtmosphereConf if folks want to connect (@byarielm.fyi saw your message).","likes":3,"re":57},{"u":"grishalr.protoimsg.app","at":"2026-04-02T04:11:00Z","text":"Building on this discussion, from the users POV and thinking it would be nice to have a `preferred_apps` key (unsure where this would go maybe community.lexicon.preferredApps) where the users states their preference and this links back to the community app directory. this could help with re-directing to the user’s preferred clients from their handles. this would be helpful for the centralized notifications app and maybe other apps, too.\n\nalso, it could be nice for data studies and trends. thinking it would be interesting to see if there are swings to/from feed clients.\n\nthere might be more use cases for this, too. i think we couldve leveraged it for atmosphereconf profiles by rendering an icon for each preferred app.","likes":1,"re":null},{"u":"bmann.ca","at":"2026-04-02T17:03:56Z","text":"I will encourage people to minimize this lexicon.\n\nYou could add likes or preferred apps or a lot of the things above - but individual apps can add them! Apps / client interfaces.\n\nWe did this for conference talks - used the community events lexicon and then added a bunch of data to the record that was completely custom.\n\nMaking a “talk” lexicon now with some experience could also be useful - but only in context of a need.","likes":3,"re":59},{"u":"moja.blue","at":"2026-04-05T04:14:24Z","text":"**Visualization layer: a 2D map for the app directory**\n\nI’ve been following this thread with interest. The discussion so far focuses on the data layer — what fields the lexicon needs. I’d like to propose the complementary piece: how we present it.\n\nThe problem Boris named is real. 21 spreadsheets and awesome lists. Lists are good for lookup but bad for overview. You can find what you already know exists, but you can’t see what’s missing.\n\nA 2D map solves this. Apps are placed on two axes:\n\n- Y-axis: what users do (Communicate, Discover, Create, Analyze, Moderate, Manage)\n- X-axis: audience scope (Everyone → Community → Creators → Power Users)\n- Maturity is expressed as color (Established / Growing / Emerging / Experimental)\n\nPopulated cells show density. Empty cells show gaps — areas where no one has built anything yet. This is the information no list can give you.\n\nThe map consumes whatever data the app lexicon produces. It doesn’t compete with atproto.garden or BlueskyDirectory — it’s a different view of the same data. Directory as data layer, map as visualization layer.\n\nI’m building a working prototype. Will share a URL shortly.","likes":0,"re":null},{"u":"moja.blue","at":"2026-04-05T04:21:40Z","text":"Here’s the working prototype:\n\n[https://moja.tngl.io/atproto-ecosystem-map](https://moja.tngl.io/atproto-ecosystem-map)\n\nGrid view shows density and gaps at a glance. Click any cell to drill down. Empty cells with “?” mark opportunities. Color encodes maturity. Scatter view plots the same data spatially.\n\nThe product data is placeholder — the real value is the UI pattern itself. Plug in whatever the app lexicon produces and the map updates.\n\nSource: [https://tangled.org/moja.blue/atproto-ecosystem-map](https://tangled.org/moja.blue/atproto-ecosystem-map)","likes":1,"re":null},{"u":"jluther.net","at":"2026-04-06T15:10:36Z","text":"Sorry, just getting caught up on the discussion! Somehow, I had the notification level set to Normal instead of Watching, so I wasn’t getting notified. :man_facepalming:\n\nThe @pixeline.be draft is a great start. :raising_hands: I’ll discuss with the crew here (Bluesky Directory) and post our thoughts based on our experience operating the directory and internal discussions we’ve had about building its successor. Probably will take a couple of days.","likes":2,"re":null},{"u":"jluther.net","at":"2026-04-10T21:39:15Z","text":"Sorry, this week got away from me! I will post more thoughts next week.\n\nAs a preface–I’m a product person. While I’m “very technical,” as my mother (RIP) used to say, I’m not an engineer, so I won’t wade into the technical design of lexicons here. My contributions here will be from the PoV of 1) product manager of an ATmosphere app directory, and 2) end user of ATmosphere apps and app directories.\n\nLuckily, there *are* incredibly smart engineers at Limeleaf. I came back from ATMosphereConf all revved up to start building the ATProto-focused successor to Bluesky Directory that we’d been discussing internally. To that end, Blain drafted three ideas for lexicons at [ATmosphere Directory lexicons](https://nc.limeleaf.coop/s/MEnwHX2BNWc8cXz).\n\nWe’re not proposing these as replacements for/additions to the current draft. We just wanted to show the group how we were thinking about approaching it, not as app developers, but as developers of an app directory.\n\nAnyway, more next week. We’re excited that this work is underway! Have a great weekend!","likes":4,"re":51},{"u":"byarielm.fyi","at":"2026-04-12T01:02:52Z","text":"Bringing this back to focus again.\n\nMany of the ideas around “this would be helpful for this UI” I think should fall into the leave it for specific app add-ons — or perhaps an optional catch-all field — for now.\n\nThere’s a mix of different things people want or think would be useful, but I think there’s also clearly overlap. We should focus on establishing those overlaps as community lexicon. Then we can always come back to adding more later. But IMO we shouldn’t delay establishing a base because of differences in how people might want to represent more categorical or organizational fields.\n\nIf someone wants to formalize the WG that’d be great, I’m not sure I’m ready to step into that role (yet, could change, life is weird, etc).","likes":2,"re":null},{"u":"byarielm.fyi","at":"2026-04-12T06:33:19Z","text":"I completely missed this link! I see you’ve got the WG template started. If you post it as a new thread in Discussion, per Boris:\n\n> I’d say make a new thread posting the template in. I can turn on wiki mode so y’all can group edit.\n> We can make a dedicated category here if you want, eg like :spiral_calendar:Lexicon Community > Community Lexicon Calendar\n\nthen with wiki mode we can do editing + any discussion on the template there to move us along.","likes":1,"re":51},{"u":"pixeline.be","at":"2026-04-13T09:51:34Z","text":"Done! [Community App Lexicon WG](http://discourse-tmp.atmosphere.community/t/community-app-lexicon-wg/761)\n\n@bmann.ca can you turn on the wiki mode ?","likes":2,"re":66}],"full":true},{"id":748,"ch":"Discussion","title":"New atproto community discord","tags":["discord","chat"],"total":37,"last":"2026-07-28T22:45:02Z","posts":[{"u":"bmann.ca","at":"2026-04-09T16:34:20Z","text":"Talking to Patak from npmx about their active and friendly Discord, I am wondering if we should kick off a new atproto community Discord.\n\nThe goal would be to collectively do this, and form a community culture together from scratch. This might also come alongside a new atproto community co-op (stay tuned on that).\n\n### #p-3068-background-1Background\n\nATProto Touchers Discord (which I made a short link for [https://discord.atprotocol.dev](https://discord.atprotocol.dev)) exists, and has lots of activity.\n\nIt’s kind of unmanaged / unmoderated other than nuking spam accounts, various people have admin status (including me). The bsky team at one point was sending support requests here but not being active there (fixed now, I think).\n\nFor atmosphereconf 2025, @psingletary.com setup a Social / Events Discord [https://eventsdiscord.atprotocol.dev](https://eventsdiscord.atprotocol.dev). It’s not very active likely because it’s not promoted often. Patrick manages it.\n\nI have a “builder’s collective” Discord I started where some private groups of various kinds are – e.g. conference producers channels. I don’t want to be personally responsible for growing such a space, hence this proposal to kick off a new one that we grow together.\n\n### #p-3068-paths-forward-2Paths Forward\n\nGather a group of people interested in working on having a friendly, managed community space for growing the atproto community.\n\n- Onboarding and community welcome for new joiners\n- Groups and roles with public/private access so we can have it as a shared resource\n- Resource for regional groups that want it (some run Signal Groups)\n\n### #p-3068-options-3Options\n\nCould we approach current ATProto Touchers admin to transform the current space into something a little more managed and welcoming?\n\nEvents Discord purpose is ideally is folded into a new community discord, so we have social & tech altogether rather than separate.\n\n> I don’t want to kick off a whole discussion about things to use other than Discord. People are welcome to run other things, but we have a Discord we could make more welcoming, we have examples like npmx of great spaces running it (they also use Signal Groups / Calls).","likes":9,"re":null},{"u":"bmann.ca","at":"2026-04-09T16:42:06Z","text":"I haven’t pinged current ATproto Touchers admins on this yet.\n\nMy thinking on this is that forming a collective group of people to start from scratch is in itself a community barn raising process, where we can help form norms.\n\nAt the same time, ATproto Touchers has a lot of people and activity in it! Could totally revamp that in place as well.\n\nNot my decision to make!","likes":4,"re":null},{"u":"psingletary.com","at":"2026-04-09T16:50:48Z","text":"If the AT Proto Touchers is amenable to it that seems like a great place to do it, I’d be willing to volunteer so roles / channels could be migrated from Social events and we’d be mostly on that server\n\nOtherwise, I’m willing to revamp Social events to cover sever channels / roles for developers\n\nHowever, I think we need to make a team effort to clearly state where all the right places to have conversations should be\n Maybe we start with atproto.dev/resources listing all the discords / forums / websites and figure out how to consolidate so people can find the right places for conversations\n\nThis way we can define the difference between what happens in discord and what happens in discourse and what gets documented in wiki","likes":6,"re":2},{"u":"bmann.ca","at":"2026-04-09T17:08:31Z","text":"I made [https://links.atprotocol.dev](https://links.atprotocol.dev) with some of these things.\n\nAnd yes aggregating disparate spaces and resources is important. It’s the lists of lists problem again where everyone makes their own list!\n\nOn my backlog is to list out the resources that the community fund has / hosts / can share.","likes":2,"re":3},{"u":"ezraboeth.com","at":"2026-04-09T17:10:36Z","text":"What’s the driving factor behind wanting to create a *new* Discord? Like, what’s the specific problems with the AT Proto API Touchers one? It sounds like it may be lack of a dedicated governance structure and moderation. Is that it?","likes":4,"re":null},{"u":"pds.dad","at":"2026-04-09T17:28:40Z","text":"I vote for sticking with the ATProto Touchers Discord, it feels like home. I think the bulk of the community is there, It’s where a lot of folks have been directed to for over a year now and has a pretty good group of people helping with community support\n\nI keep the #pds-operators channel’s notifications on all and try to help there when I have the availability. Happy to keep doing that where ever it’s decided and take on some other moderation burden if needed as well as branching out to some other channels a bit more.","likes":9,"re":null},{"u":"paullieberman.org","at":"2026-04-09T18:16:47Z","text":"Maybe make sure the group’s scope is well defined. I shied away from the Atprotocol Touchers because I thought it meant the people defining and developing the protocol itself, not those of us using it to build things.","likes":5,"re":null},{"u":"bmann.ca","at":"2026-04-10T00:25:06Z","text":"I think this is an example of how the space doesn’t do a good job of welcoming people and directing them where to go.","likes":2,"re":7},{"u":"bmann.ca","at":"2026-04-10T00:28:20Z","text":"Because the current space isn’t set up as a collaborative community space, dedicated volunteers to support a welcoming experience for new joiners, etc.\n\nSo, my idea for a *new* Discord would be to get collaborative buy in and setup from everyone, so everyone could help grow a community experience together from the beginning.\n\nI also want to float the idea generally before approaching current server owners and seeing what they think.\n\n(I may be overthinking this and it’s not that hard to evolve what is there now if everyone agrees, but I kind of like a ground floor approach)","likes":4,"re":5},{"u":"bmann.ca","at":"2026-04-10T00:31:34Z","text":"Oh for sure, I know that established people are fine with it and found their way there. If current admins are OK with it, we may be able to evolve it. [More below](http://discourse-tmp.atmosphere.community/t/new-atproto-community-discord/748/9)\n\nI think less about moderation but more about welcoming setup and guidance.\n\nCan you think of anything you see in npmx that you’d like to see in Touchers?\n\nIs there anything about Touchers you really love? anything you’d like to improve?","likes":3,"re":6},{"u":"baldemo.to","at":"2026-04-10T02:10:09Z","text":"I do agree that there’s a bit of a divide in the server.\n\n- On the one hand, it functions as a space to ask for technical advice with particular implementation issues/questions regarding atproto and sharing your work.\n- On the other, it’s meant to function as a space for broader discussions surrounding the broader atproto ecosystem outside particular implementations. Things like WGs, conferences/meetups, sociotechnological discussions, stuff like that.\n\nI think that there’s some tension between the two. It’s not *impossible* to divvy up these goals, but, since people tend to gravitate towards a few main channels, I feel like compressing these makes it more difficult to talk about both constructively and consistently. It’s kind of why I’ve stopped checking the server as much. I’m definitely more interested in the latter than the former, since those are the discussions I can better engage with (Given I’m not really a programmer).\n\nI’m softly in favor of another server for these discussions, but I’d like to know what other people think as well.","likes":4,"re":9},{"u":"thisismissem.social","at":"2026-04-10T02:31:18Z","text":"I think it would be best to keep the current discord, since doing otherwise would further fracture the community.","likes":6,"re":null},{"u":"psingletary.com","at":"2026-04-10T13:19:06Z","text":"making the discord a community server with onboarding and resource pages would go a long way to do that\n additionally a help channel + people with helper roles (they could be mods, but don’t have to be) would go a long way with personal interaction rather than *just* onboarding process","likes":3,"re":8},{"u":"teonbrooks.com","at":"2026-04-10T13:45:01Z","text":"Just joined the Discord. I like the idea of consolidating into one. I think we should maybe change the name but that’s a bikeshedding event onto itself.\n\nIt would be great to have a Community category for all the local meetups. Would be useful for planning/coordinating meetups. @atproto.nyc, where you at? :slight_smile:","likes":5,"re":null},{"u":"vagabond.quest","at":"2026-04-10T15:44:25Z","text":"Joined *The* *Touchers* a few times, but never stayed because it’s all work and no play.\n\nAgree a lot with @psingletary.com about onboarding improvements (and fun).\n\nNeed space to welcome general bsky users and help guide to new AT experiences.","likes":3,"re":null},{"u":"chaosgreml.in","at":"2026-04-10T18:51:47Z","text":"@psingletary.com - you need another admin? Ran a very large discord during the pandemic and learned a lot about community management and cultivation, so happy to help!\n\nI think we can do a good job growing touchers, even possibly fully rebranding it.\n\nI’d like to see it really have a team of admins from different groups and communities operating in a commons-structured way.\n\nThere’s a lot we can do to make it better, but also, we should ask the most important question:\n\n***Is Discord even the right platform?***\n\nIt is closed-source, has kind of terrible performance in general, continues to clutter the interface with games-focused content, doesn’t integrate natively with atproto, and has somewhat of a very overwhelming interface for many people.\n\nHave we considered *any* of the open source solutions that are actually focused on what we’re focused on? I know there’s a lot of great feedback about Mattermost, we’re using Zulip with EAR (i’m finding it interesting), so I thought it was worth a mention.","likes":6,"re":15},{"u":"pds.dad","at":"2026-04-10T18:54:15Z","text":"I know for our welcome channel we usually ask some maintainers and other core members to keep an eye on the welcome channel and send a “welcome” message. And that seems to work mostly and kind of open the door to see if there’s another channel to direct them where they might find what they are looking for.\n\nI think what @psingletary.com said about changing to a community server and doing some onboard listing what channels/sections are what, maybe even like a FAQ thing. Like, “Here because your PDS is blowing up? Maybe check #pds-operators” etc, and it’s a list that can be built over time. I think all of that would go a long way and help out some.","likes":6,"re":10},{"u":"bmann.ca","at":"2026-04-10T18:57:17Z","text":"Yes, that’s what I’m thinking. Very much a welcome channel and go from there as you suggest.","likes":1,"re":17},{"u":"chaosgreml.in","at":"2026-04-10T19:31:27Z","text":"and we can set up sets of channels that work for folks and they can add them by adding emoji, so they can opt into the parts of the server that are relevant for them.\n\nIt’s a helpful way to allow people to stay in one place and grow into different parts of the space over time.\n\nIt’s also more honest to our identity as a community that doesn’t believe there’s a hard line between user, builder, and developer.","likes":3,"re":18},{"u":"byarielm.fyi","at":"2026-04-11T04:59:58Z","text":"It would be helpful if there were explainers for discord notification management in onboarding. Ways to manage the channels people see too (can’t think of which groups I’m in that do this but there’s a few). I’ve heard from a few people in ATscience sphere that discord can be a lot when there’s many channels or people. These are features that would help a lot (personally I just auto mute everything lol).\n\nAnd since I think the community will want an ATnative option in the future it makes most sense to work with the existing Touchers channel. Lots of information in there.","likes":3,"re":null},{"u":"grishalr.protoimsg.app","at":"2026-04-11T15:20:58Z","text":"i’m new here so feel like my input doesn’t hold much weight and i’m sure people who have been in this community will feel different.\n\ni’d agree that there can be a more “welcoming” presence from established community members/leaders/admins. i don’t think i’ve seen any responses come through the #welcome channel. fwiw i think Germ and npmx’s discords do a great job of engaging right away with people who join.\n\ni think the social discord run by @psingletary.com breaks down the local “camps” really well but bc of the fracture i don’t think everyone knows about them. @teonbrooks.com there’s a “jfk” channel in there with some nyc people.\n\nalso, i think the social channel brings the fun with the wordle channel! i’ve been enjoying the connection with a handful of people playing wordle every day. even without talking much between each other we still come together to continue the streak.\n\nall to say i don’t really have an opinion on a *new* discord server but i agree there should be a consolidation and rethink of how the current ones are used.","likes":2,"re":null},{"u":"moja.blue","at":"2026-04-12T00:12:46Z","text":"Consolidating Discord servers solves the problem temporarily. As the community grows, the same fragmentation will return. There is a third option beyond consolidation vs. fragmentation.\n\nI run multiple Discord servers and use a shared channel called “Street” bridged by a bot across all of them. Each server stays independent, but cross-server conversation happens through this channel. Distributed servers, connected flow.\n\nThis mirrors the ATProto architecture itself: PDSes are distributed, the AppView connects them.","likes":4,"re":null},{"u":"bmann.ca","at":"2026-04-12T01:58:48Z","text":"Interesting idea!\n\nPersonally I don’t worry about Discord proliferation.\n\nMy goal in bringing up this thread was seeing who wanted to work on making *one* Discord more welcoming.\n\nIt seems like people are interested in improving the Touchers Discord which is great.","likes":2,"re":22},{"u":"bmann.ca","at":"2026-04-12T05:19:50Z","text":"You’ve got as much as a voice as anyone! Even more so since we want opinions from people who haven’t gone through all the history!\n\nAlso: not a fracture, just a legacy of setting up the other discord for the conference last year. Personally, I’d much rather not have the giant list of airports but in fact have regionals request and name channels themselves.\n\nThat, and projects like a channel for “atmosphere-website” that I haven’t been comfortable making because a) I’m the newest admin on Touchers and b) really should be someone not-me doing more setup and admin.\n\n@psingletary.com how do you feel about those comments, would you want to help build out touchers?","likes":3,"re":21},{"u":"trezy.codes","at":"2026-04-12T16:23:21Z","text":"I’ll throw in with the “improve touchers” crowd. As far as I can tell it’s already got the largest, most active audience, so it seems the most natural core destination.\n\nI’m also happy to help with admin/moderation on Discords. I currently help with or manage several large servers. Onboarding is usually my main focus. Despite its many flaws, Discord provides a lot of great tools for streamlining onboarding, including some magic for managing notifications out-of-the-gate.\n\n@moja.blue mentioned cross-server conversation. Discord doesn’t provide anything native for that, but it *does* provide a sharing mechanism for announcements channels. It could be valuable to have a core announcements channel in Touchers for major announcements (i.e. api changes, spec changes, [atproto.com](http://atproto.com) blogs, etc) that other servers can subscribe to. This would allow us to have a single announcement space for these things with broader impact, shared across other community servers like npmx, germ, cartridge, etc.\n\nTL;DR - Let’s see about improving touchers, I’m happy to help, there’s lots of useful Discord features that aren’t currently utilized by touchers.","likes":5,"re":null},{"u":"bmann.ca","at":"2026-04-12T20:10:55Z","text":"Yes! There are definitely immediate improvements and things like an announce channel, and having a “network news” channel to follow other discords with are low hanging fruit.\n\nThanks for also putting your hand up here to help out.\n\nI’m going to make a wiki page where we can put some top changes we’re suggesting and then bring this up with current admins.","likes":3,"re":25},{"u":"psingletary.com","at":"2026-04-12T23:37:18Z","text":"fyi i only own/admin social events, i have no roles on touchers","likes":0,"re":16},{"u":"psingletary.com","at":"2026-04-12T23:39:13Z","text":"this is an interesting point about converting to *.atproto.camp meetups\n would like to see that in touchers so we can move away from social events","likes":0,"re":21},{"u":"psingletary.com","at":"2026-04-12T23:39:57Z","text":"sure!\n\n(stupid frigging character limit)","likes":0,"re":24},{"u":"gui.do","at":"2026-04-13T00:12:30Z","text":"Not saying that is the best option (as I’m not in the mentioned Discord channel and do know what happens there), but ***IF*** you’d decide on setting up something new instead of using/repurposing an existing and channel…\n\n*(and I’m kinda surprised it hasn’t come up yet in this long thread?)*\n\n… I would suggest us all throwing our weight behind an atproto native Discord alternative and make that our own.\n\nWe have the tech and smarts to do it, might as well do something with it #EatOurOwnDogfood","likes":1,"re":null},{"u":"bmann.ca","at":"2026-04-13T01:49:46Z","text":"It hasn’t come up because it’s off topic from what is being discussed.\n\nJust like npmx we’re aiming to be pragmatic about what’s working today.\n\nIt’s more likely to replace this discourse forum sooner - lots of stuff possible when permissioned data is available.","likes":1,"re":30},{"u":"gui.do","at":"2026-04-13T10:33:17Z","text":"well you started this discussion with\n\n> **bmann.ca:**\n> I am wondering if we should kick off a new atproto community Discord.\n\nWhich I interpreted as that starting something new / from scratch was on the table, but that was my bad then\n\nIn my experience as a community manager it is always infinitely better/easier to go where the community already is and just use that and live with the consequences. So yeah, definitely do that and don’t start something new if you don’t have to, that is where my “***IF***” came in :wink:\n\nSo I guess I should go sign up for that ATProto Touchers Discord then :sweat_smile:","likes":3,"re":31},{"u":"bmann.ca","at":"2026-04-16T08:01:52Z","text":"I’ve started a new page, in wiki mode, summarizing a few suggested improvements\n\n> **:**\n> Continuing the discussion from\n> New atproto community discord\n> , where the outcome was, let’s ask current Touchers server owner and admins if we can upgrade / improve the server rather than start a new one.\n> This page is set up wiki mode, please make edits and suggestions directly.\n> @psingletary.com\n> &\n> @trezy.codes\n> are volunteering to be new mods/admins to help implement and upgrade.\n> @baileytownsend.dev\n> did you want more powers or do you just want to continue being your friendly Touchers denizen …\n\nPlease add / edit with other suggestions.","likes":1,"re":null},{"u":"vicwalker.dev.br","at":"2026-07-18T13:14:23Z","text":"I know I’m very late to this discussion.\n\nMy biggest issue with using the ATProto Touchers for this is that the server is heavily developer-oriented. That would scare away people who want to be part of the community but aren’t technical.\n\nA good revamp of the Discord server organization could help a lot. As starters, the Community Server feature can help guide new users joining and help them curate better what topics they are interested in or not (hiding channels and keeping the experience less overwhelming).\n\nI have experience setting up onboarding for community servers and organizing channels, so I could help with that. Though I must say I’m not interested in moderating Discord servers anymore (I’ve reached my limit years ago), so once the changes are done, I prefer to be just a member.","likes":3,"re":null},{"u":"bmann.ca","at":"2026-07-24T00:42:04Z","text":"Thank you for your feedback!\n\nI think at this point we’re close enough to a variety of non Discord options to be mature enough that we could start on a new system. The current server owners don’t seem to have interest in working on this / onboarding new mods.\n\nI understand your feedback on setup for devs. It *is* the dev discord chat today, and we’ve got the (under utilized) social one. If we’re starting fresh, integrating it so everyone can find places to hang would be good.\n\n“Someone” needs to gather 2-3 people to take on what system we move to (test existing things), and set it up for onboarding, moderation crew, etc.","likes":2,"re":34},{"u":"sophie-isla.myatproto.social","at":"2026-07-24T22:09:19Z","text":"Seems like Roomy would be a natural choice both because they are fully on board with implementing atproto and because they (specifically [@zicklag.dev](https://roomy.space/user/did:plc:ulg2bzgrgs7ddjjlmhtegk3v)) are so active here. It has good dog food and reciprocity vibes.\n\nI second [vicwalker.dev.br](https://discourse.atmosphere.community/u/vicwalker.dev.br)’s desire to make spaces that are welcoming for enthusiasts who are not as knowledgeable. The more we can make spaces that break down barriers between the different layers of technical expertise the more the community will thrive.","likes":4,"re":35},{"u":"bmann.ca","at":"2026-07-28T22:45:02Z","text":"I am happy to support a working group which wants to take this on, and do the research in which platform would work, who would be mods, what communities should be consulted to use this / who wants this (e.g. regional groups mostly have their own local solution) etc etc\n\nI *might* be able to help raise some funding, but that would be part of the work too – figuring out what is needed for this, and how much we do need to pay people?\n\nIf anyone on this thread wants to take this on, I suggest you gather 2-3 leads + additional supporters and see who wants to work on it.\n\nMy personal short list would be [Chatto](https://chatto.run/), [Roomy](https://roomy.space/), and [Colibri](https://colibri.social). And maybe also a “bridging” strategy (e.g. does running a “mature” [Mattermost](https://mattermost.com) instance make sense, and bridge that with an atproto native solution?), but I don’t feel strongly about that and I see that as part of the work of a working group to figure out.","likes":3,"re":36}],"full":true},{"id":761,"ch":"Lexicon Community","title":"Community App Lexicon WG","tags":["lexicon"],"total":76,"last":"2026-10-16T21:23:54Z","posts":[{"u":"pixeline.be","at":"2026-04-13T09:51:13Z","text":"### #p-3125-app-lexicon-working-group-proposal-draft-1App Lexicon Working Group — Proposal Draft\n\n> **Status:** DRAFT\n> **Authors:** pixeline.be (Alexandre Plennevaux), byarielm.fyi (Ariel M. Lighty), [jluther.net](http://jluther.net) (John Luther)\n> **Date:** 2026-04-25\n\n### #p-3125-part-1-lexicon-design-proposal-2Part 1: Lexicon Design Proposal\n\n### #p-3125-context-3Context\n\nThe AT Protocol ecosystem is growing fast. Multiple independent efforts currently track apps, tools, and services — from Semble collections (200+ apps) to [BlueskyDirectory.com](http://BlueskyDirectory.com), [atproto.brussels](https://atproto.brussels), [AlternativeProto](https://alternativeproto.net/), [sdk.blue](https://sdk.blue), and more. At one point, there were 21 separate lists.\n\nThere is no shared, machine-readable way to describe what an app *is*, what it *does*, or how it *plugs into ATProto*. This makes discovery fragmented and maintenance duplicative.\n\n### #p-3125-prior-art-4Prior Art\n\n- atproto.garden (dame.is): The most developed starting point. Defines garden.atproto.directory.submission — a record type stored on users’ PDS with fields like name, tagline, description, url, category, tags, projectState, creators, logo, screenshots, and lexicon metadata. Open source at github.com/dame-is/atproto-garden.\n- store.stucco.software (nikolas.ws): Working implementation that creates records to PDS and checks rel=me for verification. Building an AppView that listens to the firehose.\n- [BlueskyDirectory.com](http://BlueskyDirectory.com) (jluther.net): Largest meta-listing. Willing to participate.\n- [atproto.brussels](https://atproto.brussels/atproto-apps) (pixeline.be): Maintains a curated directory with fields like name, url, platform, short description, category, alternative_to, last_checked. Experiments with PDS-stored user ratings (brussels.loves.appRating).\n- SoftwareApplication - Schema.org Type : Established web vocabulary for describing software applications.\n- W3C Web Application Manifest / MASL: Manifest structures for web apps, noted as structurally similar by ngerakines.me and bmann.ca.\n- ATProto OAuth client metadata: Already contains some app info (name, logo, urls) for apps that implement OAuth.\n\n### #p-3125-design-principles-distilled-from-the-thread-5Design Principles (distilled from the thread)\n\n1. Start minimal — resist scope creep (bmann.ca’s consistent message). Ship a small, useful set; iterate via PRs.\n2. Apps first — leave SDKs, infrastructure, and libraries for a future, separate lexicon.\n3. Resolve, don’t store — handles should be resolved from DIDs, not stored redundantly (byarielm.fyi).\n4. Signals over taxonomy — rather than a rigid category tree, expose small composable signals (type, capabilities, tags) that consumers can assemble into their own views (pixeline.be).\n5. `self` rkey convention — if the app’s official ATProto account publishes its own record with rkey self, that’s a self-attestation of ownership (zicklag.dev).\n6. Verification is out-of-band — verification (via rel=me, .well-known, or other methods) is a concern for directories/clients, not the lexicon itself. The lexicon just provides the data.\n7. App icon — apps upload their icon as .png or .jpeg to a designated space on the lexicon to make it easy to display the right app icon. I suggest 1000x1000 (bsky.app compresses to this (if not mistaken). \"appIcon\": { \"type\": \"blob\", \"accept\": [\"image/png\", \"image/jpeg\"], \"maxSize\": 1000000 } (dave.self.surf)\n8. App svg — same as above, support .svg so others can display the logo on their app (eg., let me show my roomy icon in the footer). (dave.self.surf)\n\n### #p-3125-proposed-lexicon-communitylexiconappentry-6Proposed Lexicon: `community.lexicon.app.entry`\n\nBelow is a proposed minimal lexicon for describing an app in the ATProto ecosystem. It draws heavily from the atproto.garden schema, simplified per thread consensus.\n\n```\n{\n  \"lexicon\": 1,\n  \"id\": \"community.lexicon.app.entry\",\n  \"defs\": {\n    \"main\": {\n      \"type\": \"record\",\n      \"description\": \"An app entry describing an app built on or for the AT Protocol. This record may be published by third parties or by the app itself. When an official self-published app profile exists, consumers should prefer that profile as the canonical record.\",\n      \"key\": \"tid\",\n      \"record\": {\n        \"type\": \"object\",\n        \"required\": [\"name\", \"url\", \"recordCreatedAt\"],\n        \"properties\": {\n          \"name\": {\n            \"type\": \"string\",\n            \"maxLength\": 200,\n            \"maxGraphemes\": 100,\n            \"description\": \"The display name of the app.\"\n          },\n          \"url\": {\n            \"type\": \"string\",\n            \"format\": \"uri\",\n            \"description\": \"The primary URL for the app, such as its website, landing page, or install page.\"\n          },\n          \"description\": {\n            \"type\": \"string\",\n            \"maxLength\": 1000,\n            \"maxGraphemes\": 300,\n            \"description\": \"A short description of what the app does.\"\n          },\n          \"logo\": {\n            \"type\": \"blob\",\n            \"accept\": [\"image/png\", \"image/jpeg\", \"image/webp\", \"image/svg+xml\"],\n            \"maxSize\": 500000,\n            \"description\": \"Primary logo for display. Should preferably be square.\"\n          },\n          \"tags\": {\n            \"type\": \"array\",\n            \"maxLength\": 10,\n            \"items\": {\n              \"type\": \"string\",\n              \"maxLength\": 64,\n              \"maxGraphemes\": 32\n            },\n            \"description\": \"Open discovery tags for filtering and search, preferably lowercase.\"\n          },\n          \"status\": {\n            \"type\": \"string\",\n            \"knownValues\": [\n              \"unreleased\",\n              \"preview\",\n              \"released\",\n              \"unmaintained\",\n              \"discontinued\"\n            ],\n            \"description\": \"Current release or maintenance status of the app.\"\n          },\n          \"officialAccountDid\": {\n            \"type\": \"string\",\n            \"format\": \"did\",\n            \"description\": \"The DID of the app's official AT Protocol account, if known.\"\n          },\n          \"officialProfileUri\": {\n            \"type\": \"string\",\n            \"format\": \"at-uri\",\n            \"description\": \"AT URI of the app's official self-published profile record, if it exists.\"\n          },\n          \"links\": {\n            \"type\": \"array\",\n            \"maxLength\": 12,\n            \"description\": \"Relevant links for the app, including trust/compliance, support, and project resources.\",\n            \"items\": {\n              \"type\": \"object\",\n              \"required\": [\"type\", \"url\"],\n              \"properties\": {\n                \"type\": {\n                  \"type\": \"string\",\n                  \"knownValues\": [\n                    \"privacy\",\n                    \"terms\",\n                    \"support\",\n                    \"contact\",\n                    \"docs\",\n                    \"blog\",\n                    \"changelog\",\n                    \"source\",\n                    \"status\",\n                    \"other\"\n                  ],\n                  \"description\": \"The kind of link.\"\n                },\n                \"url\": {\n                  \"type\": \"string\",\n                  \"format\": \"uri\",\n                  \"description\": \"The destination URL.\"\n                },\n                \"label\": {\n                  \"type\": \"string\",\n                  \"maxLength\": 100,\n                  \"maxGraphemes\": 50,\n                  \"description\": \"Optional human-readable label, especially useful when type is 'other'.\"\n                }\n              }\n            }\n          },\n          \"recordCreatedAt\": {\n            \"type\": \"string\",\n            \"format\": \"datetime\",\n            \"description\": \"Timestamp when this entry record was created.\"\n          },\n          \"recordUpdatedAt\": {\n            \"type\": \"string\",\n            \"format\": \"datetime\",\n            \"description\": \"Timestamp when this entry record was last updated.\"\n          }\n        }\n      }\n    }\n  }\n}\n\n{\n  \"lexicon\": 1,\n  \"id\": \"community.lexicon.app.profile\",\n  \"defs\": {\n    \"main\": {\n      \"type\": \"record\",\n      \"description\": \"The official self-published profile for an app built on or for the AT Protocol. This record should be published by the app's official account and used by consumers as the canonical record for that app.\",\n      \"key\": \"literal:self\",\n      \"record\": {\n        \"type\": \"object\",\n        \"required\": [\"name\", \"url\", \"recordCreatedAt\"],\n        \"properties\": {\n          \"name\": {\n            \"type\": \"string\",\n            \"maxLength\": 200,\n            \"maxGraphemes\": 100,\n            \"description\": \"The display name of the app.\"\n          },\n          \"url\": {\n            \"type\": \"string\",\n            \"format\": \"uri\",\n            \"description\": \"The primary URL for the app, such as its website, landing page, or install page.\"\n          },\n          \"description\": {\n            \"type\": \"string\",\n            \"maxLength\": 1000,\n            \"maxGraphemes\": 300,\n            \"description\": \"A short description of what the app does.\"\n          },\n          \"logo\": {\n            \"type\": \"blob\",\n            \"accept\": [\"image/png\", \"image/jpeg\", \"image/webp\", \"image/svg+xml\"],\n            \"maxSize\": 500000,\n            \"description\": \"Primary logo for display. Should preferably be square.\"\n          },\n          \"tags\": {\n            \"type\": \"array\",\n            \"maxLength\": 10,\n            \"items\": {\n              \"type\": \"string\",\n              \"maxLength\": 64,\n              \"maxGraphemes\": 32\n            },\n            \"description\": \"Open discovery tags for filtering and search, preferably lowercase.\"\n          },\n          \"status\": {\n            \"type\": \"string\",\n            \"knownValues\": [\n              \"unreleased\",\n              \"preview\",\n              \"released\",\n              \"unmaintained\",\n              \"discontinued\"\n            ],\n            \"description\": \"Current release or maintenance status of the app.\"\n          },\n          \"links\": {\n            \"type\": \"array\",\n            \"maxLength\": 12,\n            \"description\": \"Relevant links for the app, including trust/compliance, support, and project resources.\",\n            \"items\": {\n              \"type\": \"object\",\n              \"required\": [\"type\", \"url\"],\n              \"properties\": {\n                \"type\": {\n                  \"type\": \"string\",\n                  \"knownValues\": [\n                    \"privacy\",\n                    \"terms\",\n                    \"support\",\n                    \"contact\",\n                    \"docs\",\n                    \"blog\",\n                    \"changelog\",\n                    \"source\",\n                    \"status\",\n                    \"other\"\n                  ],\n                  \"description\": \"The kind of link.\"\n                },\n                \"url\": {\n                  \"type\": \"string\",\n                  \"format\": \"uri\",\n                  \"description\": \"The destination URL.\"\n                },\n                \"label\": {\n                  \"type\": \"string\",\n                  \"maxLength\": 100,\n                  \"maxGraphemes\": 50,\n                  \"description\": \"Optional human-readable label, especially useful when type is 'other'.\"\n                }\n              }\n            }\n          },\n          \"recordCreatedAt\": {\n            \"type\": \"string\",\n            \"format\": \"datetime\",\n            \"description\": \"Timestamp when this profile record was created.\"\n          },\n          \"recordUpdatedAt\": {\n            \"type\": \"string\",\n            \"format\": \"datetime\",\n            \"description\": \"Timestamp when this profile record was last updated.\"\n          }\n        }\n      }\n    }\n  }\n}\n```\n\n### #p-3125-whats-intentionally-left-out-for-now-7What’s intentionally left out (for now)\n\nThese were discussed but deferred to keep v1 minimal:\n\n- Screenshots, keyFeatures — useful for rich directories but not core metadata.\n- customLexicons / supportedLexicons — valuable for developer-facing directories, but unlikely to be kept up-to-date by most submitters. Can be a v2 addition or a separate linked record.\n- creators array — the submitter’s DID is already the record author. A brandDid covers the brand/org case. Full contributor lists can come later.\n- alternative_to — interesting idea (raised by pixeline.be, supported by yamarten.bsky.social), but adds complexity. Better as a separate record type or tag convention.\n- Verification — per thread consensus, verification is out-of-band. Directories can verify using self rkey convention, rel=me, .well-known, or their own criteria.\n- Ratings / reviews — atproto.garden already has separate lexicons for these (garden.atproto.directory.upvote, .review, etc.). These should remain separate from the directory entry itself.\n\n### #p-3125-the-self-rkey-convention-8The `self` rkey convention\n\nWhen the app’s official ATProto account creates the record with rkey `self` (instead of a TID), it signals: “I am the official account for this app.” Any ATProto user can independently verify this by checking that the record’s author DID matches the `brandDid` (or is the only DID associated). This convention is borrowed from how `app.bsky.actor.profile/self` works.\n\nThird-party users can also submit entries about apps (using a normal TID rkey), which lets community members list apps whose developers haven’t created records themselves.\n\n### #p-3125-part-2-working-group-template-filled-out-9Part 2: Working Group Template (filled out)\n\n### #p-3125-name-10Name\n\n**App Directory Lexicon Working Group**\n\n### #p-3125-representatives-11Representatives\n\n**Lexicon Community TSC:** @bmann.ca\n\n**WG Lead:** @pixeline.be (Alexandre Plennevaux)\n\nThe Working Group lead is not expected to be the most experienced member on the topic of the WG, but is in charge of:\n\n- Providing updates to the TSC representative about progress made\n- Make sure that WG progress is happening regularly, or (if it’s not happening) that there is a defined plan for when work will restart\n\n### #p-3125-objective-12Objective\n\nDefine a minimal, community-maintained ATProto Lexicon for describing apps in the atmosphere, so that multiple directories, listings, and discovery tools can interoperate on a shared data format — stored in users’ PDS repos and available via the firehose.\n\n### #p-3125-aims-deliverables-13Aims & Deliverables\n\n[Last updated: 2026-03-20]\n\n**Aim 1: Research and consolidate existing approaches**\n\nSurvey the data models currently used by atproto.garden, BlueskyDirectory, atproto.brussels, store.stucco.software, AlternativeProto, Semble collections, and the ATProto OAuth client metadata spec. Identify the common core fields and the points of divergence.\n\n- Deliverable: A comparison document mapping fields across existing directories\n- Status: Partially done (the original thread has surfaced most of the data)\n\n**Aim 2: Define a v1 App Directory Entry lexicon**\n\nProduce a minimal lexicon (record type) for an app directory entry, covering: identity (name, url), presentation (description, logo), classification (category, tags, platforms, project state), and provenance (brandDid, createdAt).\n\n- Deliverable: A lexicon JSON file in the Lexicon Community repo, with accompanying documentation\n- Status: In progress (proposal above)\n\n**Aim 3: Document the `self` rkey convention and verification guidance**\n\nWrite a short specification for how official app accounts signal ownership, and how directory consumers can verify entries using out-of-band methods (rel=me, .well-known, etc.).\n\n- Deliverable: A guidance document in the Lexicon Community repo\n- Status: Not started\n\n**Aim 4: Build or adapt at least one working implementation**\n\nAt least one app (AppView + client) should use the finalized lexicon to create records on PDS and display a directory. atproto.garden and store.stucco.software are both candidates.\n\n- Deliverable: A working, open-source directory app that reads/writes the shared lexicon\n- Status: In progress (nikolas.ws and dame.is are both building)\n\n### #p-3125-timeline-14Timeline\n\n[Last updated: 2026-03-20]\n\n- Research & consolidation: 2 weeks (much already done in the thread)\n- Lexicon v1 definition: 3-4 weeks from WG formation\n- Verification guidance: Can run in parallel, ~2 weeks\n- Working implementation: 4-6 weeks (can overlap with lexicon finalization)\n\n### #p-3125-current-members-15Current Members\n\n[Last updated: 2026-04-25]\n\n- @pixeline.be (Alexandre Plennevaux) — maintains atproto.brussels, proposing to lead the WG\n- @byarielm.fyi\n\n**Interested contributors from the [original discussion thread](http://discourse-tmp.atmosphere.community/t/a-community-app-lexicon/656):** @dame.is @nikolas.ws @zicklag.dev @jluther.net @flo-bit.dev @yamarten.bsky.social\n\nIf you’d like to formally join the WG, you can edit the wiki to add your name to the bulleted list above and remove it from the ‘interested contributors’ line.\n\n### #p-3125-meeting-details-and-how-to-join-16Meeting Details and How to Join\n\n[Last updated: 2026-03-20]\n\n- Where: TBD — likely a dedicated channel on the ATProto Community Discord, with async discussion on the Discourse forum\n- When: Bi-weekly video/voice calls (day/time to be decided by members), with ongoing async work between meetings\n- Who to contact: pixeline.be (on Discourse or Bluesky) if meetings haven’t happened in a while\n- How to join: Post in the Discourse thread or reach out to any current member. New members should:\n- Read this proposal and the original thread\n- Be willing to contribute to lexicon design, implementation, or testing\n- Ideally, be building or maintaining a directory/listing of ATProto apps\n\n**What makes a good member:** We’re looking for people who are actively maintaining app directories or building tools for ATProto app discovery. We especially need people who are ready to implement the lexicon in real apps — either by adapting existing directories or building new ones. Experience with ATProto lexicon design or app store / directory taxonomy is a plus, but enthusiasm and commitment to ship something minimal are more important.\n\n### #p-3125-stretch-goals-and-long-term-explorations-17Stretch Goals and Long-term Explorations\n\n- SDK / Library lexicon — a separate record type for developer resources (SDKs, libraries, infrastructure tools). Deliberately excluded from v1 to keep scope tight.\n- Rich metadata extensions — screenshots, key features, supported/custom lexicons, OAuth client ID linking. These can be added as optional fields or separate linked records once v1 is stable.\n- `alternative_to` relationships — a way for apps to declare what mainstream product they’re an alternative to (e.g., “alternative to Instagram”). Could be a separate record type that references directory entries.\n- Cross-directory trust / curation signals — standardized way for directories to endorse or curate entries (the “trust signal” concept from zicklag.dev). Relates to labeling and moderation.\n- Automated health checking — conventions for directories to report whether an app’s URL is still live.\n- [schema.org](http://schema.org) alignment — mapping the lexicon to SoftwareApplication - Schema.org Type for SEO and web interoperability.\n- Curated lists — a meta-feature allowing anyone to create and publish a curated subset of directory entries (e.g., “Best photo apps”, “Tools for developers”).\n\n### #p-3125-additional-notes-and-references-18Additional Notes and References\n\n- Original discussion thread: A community app lexicon\n- Related thread: Taxonomy for ATmospheric Lexicon and App Directories\n- WG Template: Lexicon Community Working Group Template\n- Existing lexicon (atproto.garden): garden.atproto.directory.submission.json\n- Sample data (UFOs explorer): garden.atproto.directory.submission records\n- store.stucco.software: https://store.stucco.software/\n- W3C Web Application Manifest: https://w3c.github.io/manifest/\n- schema.org SoftwareApplication: https://schema.org/SoftwareApplication\n- ATProto Garden (live): https://atproto.garden/\n- BlueskyDirectory: https://blueskydirectory.com\n- ATProto Brussels app list: https://atproto.brussels/atproto-apps\n\n[original discussion](http://discourse-tmp.atmosphere.community/t/a-community-app-lexicon/656/51)","likes":9,"re":null},{"u":"bmann.ca","at":"2026-04-13T11:52:58Z","text":"I made it a wiki. I actually think you can do it yourself, I just haven’t checked permissions.","likes":3,"re":null},{"u":"xan.lol","at":"2026-04-14T02:29:03Z","text":"i think it would be better to have a separate field for svg and bitmap logos","likes":0,"re":null},{"u":"pixeline.be","at":"2026-04-14T12:56:35Z","text":"Could you share concrete reasons for separate SVG and bitmap logo fields (implementation, performance, UX, etc.) rather than just a preference?\n\n> **xan.lol:**\n> i think it would be better to have a separate field for svg and bitmap logos","likes":0,"re":3},{"u":"bmann.ca","at":"2026-04-14T18:35:28Z","text":"I could see an argument for that being an array, including wordmarks vs logos and such, light vs dark etc etc but I think “add the square logo that will display” is the right place to start.\n\nSomeone can make a “brand kit” lexicon to extend this with.","likes":3,"re":4},{"u":"thisismissem.social","at":"2026-04-15T18:49:03Z","text":"This allows for consumers to request the “correct” logo for the app with respect to how they need to render it. You’d probably also want the size information included for the bitmap version, where as the svg is scalable.\n\nSourcing and resizing all the logos for Eurosky Portal took quite a bit of time.","likes":1,"re":4},{"u":"thisismissem.social","at":"2026-04-15T18:55:12Z","text":"You probably want to change `sourceUrl` to:\n\n- sourceCode\n- repository\n- provider (github, tangled, codeberg, etc)\n- license (SPDX license)\n- brandDid → account or did\n- on category, I don’t think any of these make too much sense, “client” is extremely broad (This wouldn’t give me meaningful grouping as it stands now)\n- on tags, it may be best to have a set of references to well defined tags? That way we can guarantee some consistency between apps.\n\n`createdAt` and `updatedAt` seem misleading in this context: These should probably not be about the record, but about the app itself.\n\nWe may also want social links to things like blog / changelog / etc.\n\nThe current schema we use for the apps in Eurosky Portal is: [eurosky-portal/app/collections/apps.ts at main · eurosky-social/eurosky-portal · GitHub](https://github.com/eurosky-social/eurosky-portal/blob/main/app/collections/apps.ts)","likes":3,"re":null},{"u":"bmann.ca","at":"2026-04-16T14:48:16Z","text":"> **thisismissem.social:**\n> on tags, it may be best to have a set of references to well defined tags? That way we can guarantee some consistency between apps.\n\nMany different things will be using a base app lexicon if we keep it minimal and unopinionated.\n\nUsing open tags that Leaflet and bsky posts are using is likely the right starting point.\n\nEven category is likely pretty application specific and if it were me I’d remove out of the base definition. Including that tags can be used as categories.\n\nThanks for the link to EuroSky - great to see another in the wild example.","likes":1,"re":7},{"u":"pixeline.be","at":"2026-04-16T17:38:34Z","text":"I took the liberty to integrate some of your remarks from the previous version:\n • removed category\n • renamed projectState to status\n • renamed brandDid to officialAccountDid\n • replaced sourceUrl with structured sourceCode\n • separated record timestamps from app lifecycle timestamps\n • kept tags open rather than controlled\n • clarified the record description around third-party vs official submissions\n\nOne open question I’d like us to discuss explicitly: should official apps have a special fixed key like self, or should we treat them like any other entry and just use normal IDs (TIDs)?","likes":0,"re":null},{"u":"bmann.ca","at":"2026-04-17T00:28:27Z","text":"There’s a mode here where I see third parties entering app entries, but then an app owner claiming it, where it should move to their own PDS.\n\nTrezy has this for Cartridge, because he got a canonical database of all games.\n\nIs this relevant for thinking about app lexicon records?","likes":1,"re":9},{"u":"byarielm.fyi","at":"2026-04-17T01:47:21Z","text":"Liking this. Some comments, which also reflect some of what I brought up in the discord:\n\n- why include source code URL and provider? latter can be inferred from the former\n- i think TOS and privacy policy links are far more important than docs/blog/changelog. i can see value in link to blog url for atmospheric reasons, support for customer-product reasons, but not sure about docs/changelog - those seem like things folks can get if they use the app or go to the source code url, respectively.\n- re:categories → tags, i like this and also think platforms should be removed in response. ios vs android vs web is vague to me bc of PWAs, so making this tags lets people do what makes sense to them (e.g., I’d label them mobile-only, ios-only, etc instead).\n- i think the status categories should be refined to:  unreleased, preview, released, and discontinued*\n- is app releasedAt that useful? seems like neat but mostly useless info\n\n*or discontinued and unmaintained, undecided if that distinction matters for users - example: zeppelin discontinued, whitewind unmaintained.","likes":1,"re":9},{"u":"scott.nstar.social","at":"2026-04-17T07:41:08Z","text":"Very interesting thread and possibly similar to something I’m defining for identifying providers of Atmosphere services, such as PDS (aka “atproto_pds”) and Bluesky AppViews (aka “bskk_appview”). Ideally, service providers would have a lexicon that describes the services they provide and publish it into their PDS repositories to be broadcast through the relay network.\n\nPossible nsid: community.lexicon.provider.declaration\n\nWondering if I should start a separate discussion or reply with the details here for everyone to assess possible alignment?","likes":1,"re":null},{"u":"bmann.ca","at":"2026-04-17T14:01:02Z","text":"Yes start a new topic - we really want to converge on a minimal app lexicon here.\n\nA reminder to everyone — the base lexicon can be extended for custom use cases. Then we’ll see what is actually needed when it is used in the wild for a while.","likes":3,"re":12},{"u":"pixeline.be","at":"2026-04-17T23:54:30Z","text":"question: what’s the definition of done here? What are the criteria to meet to decide this lexicon is good for publishing? Or… Who gets the final say?","likes":1,"re":13},{"u":"pixeline.be","at":"2026-04-18T00:28:50Z","text":"How I personally see this:\n\n- someone else can create an app record before the official team does\n- later the real owner should be able to publish the authoritative version\n- the authoritative version should live under the owner’s account / data store\n- consumers should be able to treat that as the canonical record\n\nEDIT: the more I think about it, the more this wants to be split into **two lexicons**, because we’re trying to model two different things:\n\n- an open app entry that anyone can publish\n- an official self-published app profile that consumers can treat as canonical when it exists\n\nTrying to make one record handle both cases creates confusion around ownership, trust, and how to resolve third-party vs official submissions.\n\nWith two lexicons, the model stays clearer:\n\n- third parties can still publish entries early\n- app owners can later publish their own official profile on their own PDS\n- consumers can prefer the official profile when present\n- third-party entries can point to that official record instead of competing with it\n\nThat feels cleaner to me than overloading a single lexicon with both directory-entry and canonical-identity semantics. What do you think ?","likes":2,"re":10},{"u":"pixeline.be","at":"2026-04-18T00:38:21Z","text":"Thank you for your inputs!\n\n> **byarielm.fyi:**\n> - why include source code URL and provider? latter can be inferred from the former\n> - i think TOS and privacy policy links are far more important than docs/blog/changelog. i can see value in link to blog url for atmospheric reasons, support for customer-product reasons, but not sure about docs/changelog - those seem like things folks can get if they use the app or go to the source code url, respectively.\n> - re:categories → tags, i like this and also think platforms should be removed in response. ios vs android vs web is vague to me bc of PWAs, so making this tags lets people do what makes sense to them (e.g., I’d label them mobile-only, ios-only, etc instead).\n> - i think the status categories should be refined to: unreleased, preview, released, and discontinued*\n> - is app releasedAt that useful? seems like neat but mostly useless info\n\nsourcode+tos: agreed. I would consolidate the links entry as an open-ended array with prepared key for TOS, user support contact, and then leave it up to add more, such as the sourcecode. ?\n\nre: platform: I remember someone asking that I include their Discord plugins for Atproto in my curated directory. I declined but ideally, I should have. So I think platforms should be open-ended, with canonical entries (“web”,“android”,“ios”,“linux”,“macosx”,…). It’s very useful for the end-user.\n releasedAt could be useful to gauge the robustness of the app, if status is not “discontinued” ? google gives more authority to older websites that are still live.","likes":0,"re":11},{"u":"pixeline.be","at":"2026-04-18T01:34:19Z","text":"Wiki updated with latest comments. There are now 2 lexicons:\n\n“community.lexicon.app.entry” : to describe someone else’s app\n “community.lexicon.app.profile” : to describe one’s own app","likes":0,"re":null},{"u":"yamarten.bsky.social","at":"2026-04-18T13:02:18Z","text":"If you divide it into two collections, there seems to be no reason to leave the rkeys `literal`. Developers may want to register mobile and desktop clients with different functions separately, and they may want to combine them into a brand account without creating a separate app account.","likes":1,"re":null},{"u":"bmann.ca","at":"2026-04-18T19:55:09Z","text":"We kind of skipped a step of you forming a working group. I’m your sponsor, who are your co-leads? You need consensus with your co-leads. @byarielm.fyi and?","likes":1,"re":14},{"u":"pixeline.be","at":"2026-04-18T21:43:36Z","text":"I would like here to formally invite @byarielm.fyi @thisismissem.social @xan.lol to act as co-leads in this Working Group, so that together we can bring this to the launch line :slight_smile:","likes":1,"re":19},{"u":"dave.self.surf","at":"2026-04-19T10:34:41Z","text":"A lexicon is permissionless.\n\nIt takes one bad actor to mess this up.\n\nThis could work if the aggregator has a pre-approval flow to screen and verify new apps, so something to keep in mind.\n\nAlso this should be a self record pointed on the did of the project app itself? So that others cant overwrite it? Assuming this is already in the design but havent seen it specified.","likes":0,"re":null},{"u":"byarielm.fyi","at":"2026-04-26T02:14:00Z","text":"I have added the WG outline @pixeline.be drafted (shared on Tangled) to the top post. If you’re interested in joining the working group, please edit the top post and provide your comments on the **proposal** *not the lexicon itself*. We can do lexicon-specific discussion once the WG is established.\n\nI’ll add my notes on the proposal in the next day or two.","likes":2,"re":null},{"u":"dave.self.surf","at":"2026-04-26T18:31:09Z","text":"Hii, I just reviewed your previous wiki edit – thanks a lot!! this clarifies my concerns with self key form zicklag which I strongly support!\n\nI appended the proposal part with two items (1) png and jpeg app icons, and (2) svg uploads.\n\nI heard this from Tori (in her talk from atmoconf), and read it from Miss Em (on discord) that it took some time to fetch all icons (for the eurosky portal).\n\nI believe this addition will solve for this problem.\n\nI seperated png & jpeg from svg, because I believe the png & jpeg is a non-issue, I don’t know if people agree with the svg, so I split them :sweat_smile:","likes":0,"re":22},{"u":"jluther.net","at":"2026-04-27T12:53:01Z","text":"I tried to edit the top post to add my name, but got a 500 error.","likes":0,"re":22},{"u":"bmann.ca","at":"2026-04-27T15:09:42Z","text":"Hey @pixeline.be – we had a @lexicon-community-tsc call last week and tried to make things easier and more clear on path to WG.\n\nTLDR – you should go ahead and make a PR into the community.lexicon.app space [lexicon/community/lexicon at main · lexicon-community/lexicon · GitHub](https://github.com/lexicon-community/lexicon/tree/main/community/lexicon)\n\nMuch like the community lexicon ai preference, there’s enough interest and momentum to start working in that space on Github.\n\n> **:**\n> Hey everyone,\n> Picking up from a few weeks ago, I created a PR that I’d like comment on. I’m specifically looking for who would be interested in using this lexicon to interop:\n\nThanks for the work you and everyone have done on this so far!","likes":2,"re":null},{"u":"pixeline.be","at":"2026-04-27T20:56:25Z","text":"Hi all, here is the PR [Add community.lexicon.app lexicons by pixeline · Pull Request #76 · lexicon-community/lexicon · GitHub](https://github.com/lexicon-community/lexicon/pull/76)\n\nThe PR is in submitted for review. Let me know if you need anything changed.","likes":2,"re":null},{"u":"pixeline.be","at":"2026-04-27T22:45:59Z","text":"I’ve done it for you.","likes":1,"re":24},{"u":"xan.lol","at":"2026-04-28T06:14:14Z","text":"one use case for an svg is services wanting the icons that can be set to a specific color\n\nalso want to note that avif and webp should probably be included in that bitmap logomark blob field.\n and might want matching a logotype bitmap+svg pair in the lexicon","likes":2,"re":4},{"u":"byarielm.fyi","at":"2026-04-28T17:27:16Z","text":"> What’s intentionally left out (for now)\n> These were discussed but deferred to keep v1 minimal:\n> - Screenshots, keyFeatures — useful for rich directories but not core metadata.\n\nI do think we should consider how self-published lexicon can support brand assets more generally. But this should be separate from the app submission lexicon, e.g. in app profile lexicon. My thinking: submission entry will be simpler to get out sooner by e.g. not letting just anyone submit screenshots for an app. But we can work more on the brand/profile one after that’s out. Perhaps that’s even a separate one - brand kit? Should profile and brandkit be separate? *Tldr: yes exclude from community.lexicon.app.entry* *(v1)* – *we should discuss the app.profile lexicon more as that’s both more nuanced and newer suggestion (so more v2+) imo.*\n\n> **Aim 4: Build or adapt at least one working implementation**\n> At least one app (AppView + client) should use the finalized lexicon to create records on PDS and display a directory. atproto.garden and store.stucco.software are both candidates.\n> - Deliverable: A working, open-source directory app that reads/writes the shared lexicon\n> - Status: In progress (nikolas.ws and dame.is are both building)\n\nBeyond this, I would like to make sure existing implementations know when the lexicon (submission but especially profile one) is available and attempt a coordinated release or “launch day” amongst at least a few of them.\n\n> Meeting Details and How to Join\n> - Where: TBD — likely a dedicated channel on the ATProto Community Discord, with async discussion on the Discourse forum\n> - When: Bi-weekly video/voice calls (day/time to be decided by members), with ongoing async work between meetings\n\nHappy with dedicated discord channel or signal group, whatever others prefer.\n\nBiweekly calls seem reasonable to me.","likes":1,"re":null},{"u":"pixeline.be","at":"2026-04-28T17:41:01Z","text":"**Where**: I’m not a huge Discord fan but if that’s what everyone is comfortable with, no problem.\n\n**When**: Because I’m in Brussels, Belgium and 9 hours away from most of the nice folks I’ve had the pleasure of interacting with so far around atproto, biweekly calls is simply a no-go for me. I would prefer we continue async. I’m ok to arrange 1 (one) call if it helps finalize this.\n\n**Launch day** I’m really wanting to release this as soon as possible so I can integrate it into atproto.brussels /atproto-apps (.entry) , mathr.app and gravita.social ( .profile). we could soft launch for people who maintain a listing and then a full launch for everyone. We can also reach out to all app authors to inform them. Some documentation could also help onboarding them, with even a generator and a link to tools like realfavicongenerator to help them produce their app profile lexicon.","likes":1,"re":29},{"u":"byarielm.fyi","at":"2026-04-28T17:48:56Z","text":"I’m fine with just chatting here too fwiw! And makes senses on time zones.\n\nWhat’s a timeline that feels reasonable for v1 and/or v2 to target for soft launch to app listing devs? Seems you envision that as separate from launch to everyone, what timeline are you think there?","likes":0,"re":30},{"u":"pixeline.be","at":"2026-04-28T19:24:21Z","text":"When thinking about it, I guess it makes sense to tell app makers over app listers, so that app listers can use the .entry only for apps that don’t publish a .profile . wdyt?\n\nThinking out loud here on a launch day approach. Once the lexicons are implemented on lexicon.community this seems reasonable to me (but happy to adjust):\n\n1. D-day: lexicons are published on lexicon.community\n2. +5D: I(?) release a lexicon generator for app creators : a static json creator based on a form\n3. +10D: release a short documentation, with resources to help (the lexicon generator + app icon generators)\n4. +11D: announce it to the folks who maintain app creators\n5. +20D: announce it to the folks who maintain app listers with a deadline to update their listing to +30D ?\n6. +30D: launch day\n\nIf you want i can prepare a google docs to better co-design the “market” plan of the lexicons ?\n\nI’m also fine for a more organic approach. Things are announced when they are released and the community catches up gradually.","likes":0,"re":31},{"u":"byarielm.fyi","at":"2026-04-28T19:36:19Z","text":"My inclination is for soft launch = let listers switch to lexicon, full launch = app devs can publish from any of the listing sites that implement the lexicon. Idea of giving listers the first go is they can figure out rollover, then implement any features they want to add to help developer submissions go more smoothly (like youd’ like to do with generator + documentation).\n\nOnce that’s set (give it a deadline), then we let developers know we have lexicon and they can submit at X Y or Z. Most of the listers are already listing either via a DB or lexicon, so rollover setup period seems fair.\n\nI think if we can get atproto.brussels (you, ofc lol) + atstore (community) + atmosphereaccount (joe, community-ish?) + blueskydirectory (@jluther.net) onboard for lexicon launch that’s a great start. If others want to join that’s also great and they can be included.","likes":1,"re":32},{"u":"byarielm.fyi","at":"2026-04-28T19:59:03Z","text":"So I went through the listing apps I could find ( - [https://docs.google.com/spreadsheets/d/1TJbHnCJq54m6zGNRAnLsD9Lq42rx2PqJdri7-UeRQfM/edit?usp=sharing](https://docs.google.com/spreadsheets/d/1TJbHnCJq54m6zGNRAnLsD9Lq42rx2PqJdri7-UeRQfM/edit?usp=sharing)\n\n**Summary of common fields**:\n\n- name - 9/9 (no surprise lol)\n- url - 9/9\n- category - 7/9 → there’s massive differences between them though\n- tagline - 6/9\n- logo/icon - 6/9\n- description - 5/9\n- createdAt - 4/9 → all the ones with lexicons\n- tags - 4/9\n- screenshots - 4/9\n- alternativeTo - 3/9\n- links, repositoryUrl, iosLink, androidLink - 3/9 total\n\nGiven this and acknowledging brands need control of their assets and marketing, my suggestion for v1:\n\n- app.entry = name, url, tags, createdAt\n- description? → seems less risky e.g. have an app displaying user-submitted descriptions of brands vs. user-submitted assets.\n- status → useful for community monitoring of e.g. dead profiles?\n- app.profile = name, url, tagline, description, links\n- avatar = icon? just pull from at account on login ([atmosphereaccount.com](http://atmosphereaccount.com) is doing this with bsky lexicon profile)?\n- icon, logo? screenshots? other brand asset info? → separate lexicon, or just flesh this out to a minimum set for profile?","likes":2,"re":null},{"u":"pixeline.be","at":"2026-04-28T21:08:17Z","text":"I would like to push back a bit on the approach of first onboarding App listers over App makers. Here is why:\n\n1. Given the recent atstore.fyi drama, I’m a bit worried about the message we project if we start with App listers, vs starting with App makers.\n2. in the Readme, we’ve written:\n\n> Consumers may use `community.lexicon.app.entry` records for discovery, curation,\n>  and third-party directories. When an official `community.lexicon.app.profile`\n>  record exists, consumers should prefer that profile as the canonical app record.\n\nSo shouldn’t we first make sure there are more .profile records in the wild, and fill the gap with .entry ones ? It will also reduce the extra work for the App Listers.\n\nWhat do you think?","likes":1,"re":34},{"u":"bmann.ca","at":"2026-04-28T22:04:24Z","text":"I would suggest against a launch day. It’s artificial.\n\nApps that want to adopt will. People will build new apps if there is a bunch of lexicon app records in one format.\n\nYes you’ll need to promote app profiles … but it’s a bit chicken and egg with displaying them somewhere.\n\nThe ones listed on EuroSky Portal you could probably reach out to, to support. I talked to @sebastian.eurosky.social & @thisismissem.social in Berlin about this, they’ll adopt a standard that gets adopted.\n\n@byarielm.fyi you could put an issue in the ATstore around switching to this
