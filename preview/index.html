<style>
/* Layout: Discourse's single-community shell with Discord's #channel sidebar.
   One sidebar of channels, one reading column, a timeline rail on threads.
   Look: Skyreader's, so the atmospheric apps feel like one suite. System sans,
   a neutral ramp, one blue, flat surfaces. The content pane is a white card on a
   recessed grey ground; selection is a blue wash, never a heavy fill. */
:root {
  --bg: #ffffff; --panel: #ffffff; --side: #f1f1f1; --sunken: #f5f5f5; --hover: #ececec; --line: #e0e0e0;
  --ink: #333333; --ink-2: #444444; --mute: #666666;
  --accent: #0066cc; --accent-dark: #0052a3; --accent-text: #0052a3; --accent-ink: #ffffff; --accent-soft: rgba(0, 102, 204, .1);
  --whisper: #735a14; --whisper-bg: #fdf1c5; --good: #2e7d32; --good-bg: #e8f5e9; --danger: #c62828; --danger-bg: #fdecea;
  --shadow: rgb(0 0 0 / .15);
  --display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
  --body: var(--display);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a1a1a; --panel: #1a1a1a; --side: #111111; --sunken: #2a2a2a; --hover: #2a2a2a; --line: #404040;
  --ink: #e0e0e0; --ink-2: #cccccc; --mute: #999999;
  --accent: #4da6ff; --accent-dark: #3399ff; --accent-text: #4da6ff; --accent-ink: #111111; --accent-soft: rgba(77, 166, 255, .15);
  --whisper: #e0c270; --whisper-bg: #33301a; --good: #81c784; --good-bg: #1b2e1d; --danger: #f28b82; --danger-bg: #3a1f1f;
  --shadow: rgb(0 0 0 / .4);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1a1a1a; --panel: #1a1a1a; --side: #111111; --sunken: #2a2a2a; --hover: #2a2a2a; --line: #404040;
  --ink: #e0e0e0; --ink-2: #cccccc; --mute: #999999;
  --accent: #4da6ff; --accent-dark: #3399ff; --accent-text: #4da6ff; --accent-ink: #111111; --accent-soft: rgba(77, 166, 255, .15);
  --whisper: #e0c270; --whisper-bg: #33301a; --good: #81c784; --good-bg: #1b2e1d; --danger: #f28b82; --danger-bg: #3a1f1f;
  --shadow: rgb(0 0 0 / .4);
  color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--side); color: var(--ink); font: 15px/1.5 var(--body); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
/* Browser surfaces take the palette too */
::selection { background: var(--accent-soft); color: var(--ink); }
html { scrollbar-color: var(--line) transparent; accent-color: var(--accent); }
input, textarea { caret-color: var(--accent); }
::placeholder { color: var(--mute); opacity: 1; }
svg { flex: none; }

/* Preview control: a small floating "view as" switch, bottom right */
.viewas { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 45; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.viewas-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 8px var(--shadow); transition: color .15s; }
.viewas-btn:hover { color: var(--ink); }
.viewas-btn b { font-weight: 600; color: var(--ink); }
.viewas-menu { width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 12px var(--shadow); padding: 6px; }
.viewas-menu p { margin: 4px 8px 6px; font-size: 12px; color: var(--mute); }
.viewas-menu button { display: flex; justify-content: space-between; align-items: baseline; width: 100%; border: 0; background: none; padding: 7px 10px; border-radius: 6px; font-size: 14px; cursor: pointer; color: var(--ink); text-align: left; }
.viewas-menu button span { color: var(--mute); font-size: 13px; }
.viewas-menu button:hover { background: var(--sunken); }
.viewas-menu button[aria-checked="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }

.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 268px 1fr; padding: 8px 8px 0 0; }

/* Sidebar */
.side { background: var(--side); display: flex; flex-direction: column; min-height: 0; }
.side-head { box-sizing: border-box; height: 57px; /* the top bar plus the content card's 1px border */ padding: 0 14px; border-bottom: 1px solid var(--line); flex: none; display: flex; align-items: center; gap: 10px; }
.logo { width: 32px; height: 32px; border-radius: 50%; flex: none; }
.forum-name { font: 600 15px/1.2 var(--display); }
.forum-did { font-size: 12px; color: var(--mute); }
.search { position: relative; flex: none; width: 110px; transition: width .2s; }
.search:focus-within, .search.has-q { width: 220px; }
.search input { width: 100%; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 0 10px 0 32px; font: inherit; font-size: 14px; }
.search svg { position: absolute; left: 10px; top: 8px; color: var(--mute); }
.side nav { flex: 1; overflow-y: auto; padding: 10px 8px 16px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 12px; border-radius: 12px; border: 0; background: none; cursor: pointer; color: var(--ink-2); text-align: left; font-size: 14px; font-weight: 500; transition: background-color .15s; }
.nav-item:hover { background: var(--hover); color: var(--ink); }
.nav-item.on { background: var(--accent-soft); color: var(--accent-text); }
.nav-item.on .ico { color: var(--accent-text); }
.nav-item.unread { color: var(--ink); font-weight: 600; }
.nav-item .ico { width: 18px; display: grid; place-items: center; color: var(--mute); }
.nav-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { min-width: 18px; height: 17px; padding: 0 5px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.count.quiet { background: none; color: var(--mute); font-weight: 500; }
.dir-sec span { padding-bottom: 3px; border-bottom: 2px solid var(--accent-soft); }
.side-all { display: block; margin: 2px 0 0 40px; padding: 2px 0; background: none; border: 0; font: inherit; font-size: 12px; color: var(--mute); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.side-all:hover { color: var(--ink); text-decoration-color: currentColor; }
.sec { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); margin: 18px 12px 4px; display: flex; justify-content: space-between; }
.me { margin: 8px; padding: 9px 10px; display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--side) 45%, var(--bg)); border: 1px solid var(--line); border-radius: 10px; }
.me .who { flex: 1; min-width: 0; line-height: 1.25; }
.me .who b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me .who span { font-size: 12px; color: var(--mute); }

/* Main */
.main { min-width: 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; }
.top { flex: none; box-sizing: border-box; min-height: 56px; position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
/* The page's heading lives in the top bar, beside its controls */
.top-title { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; flex-wrap: nowrap; gap: 14px; }
.top-title > * { flex: none; }
/* The page's description: one line, cut with an ellipsis, full text in a popover. */
.top-title > .top-desc { flex: 0 1 auto; min-width: 0; position: relative; display: flex; align-items: baseline; gap: 6px; margin: 0; font-size: 13px; color: var(--mute); }
.top-desc .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.top-desc .more { flex: none; display: none; background: none; border: 0; padding: 0; font: inherit; color: var(--mute); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; }
.top-desc .more:hover { color: var(--ink); text-decoration-color: currentColor; }
.top-desc.clipped .more { display: inline; }
.desc-pop { position: absolute; top: calc(100% + 10px); left: 0; z-index: 7; width: min(420px, 80vw); padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 12px var(--shadow); color: var(--ink-2); font-size: 13.5px; line-height: 1.5; white-space: normal; text-wrap: pretty; }
.top-right { flex: none; display: flex; align-items: center; gap: 8px; }
.top-title h1 { white-space: nowrap; }
.top-title h1 { font-size: 17px; line-height: 1.3; display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.top-ico { color: var(--mute); display: inline-grid; }
.top-link { background: none; border: 0; padding: 0; font: 600 15px/1.3 var(--body); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.top-link:hover, .top-link:hover .top-ico { color: var(--accent-text); }
.chan-pick { justify-self: start; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 8px; font: inherit; font-size: 14px; }
.icon-btn.menu-btn { display: none; }
.icon-btn { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.page { width: 100%; max-width: 880px; margin: 0 auto; padding: 26px 24px 40px; flex: 1; }
.page.wide { max-width: 1200px; }
h1 { font: 600 20px/1.3 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.thread-grid h1 { font-size: 26px; }
.head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
.head .grow { flex: 1; min-width: 0; }
.head p { margin: 5px 0 0; color: var(--mute); text-wrap: pretty; }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--mute); margin-bottom: 8px; flex-wrap: wrap; }
.crumbs button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); display: inline-flex; gap: 4px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--sunken); color: var(--ink); font-weight: 500; cursor: pointer; font-size: 14px; white-space: nowrap; transition: background-color .2s; }
.btn:hover { background: var(--line); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn.small { height: 30px; padding: 0 12px; font-size: 13px; }
.btn.ghost { background: none; border-color: transparent; color: var(--mute); }
.btn.ghost:hover { color: var(--ink); background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.title-row { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.pills { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line); }
.pills button { border: 0; background: none; border-radius: 999px; padding: 3px 12px; font-weight: 500; font-size: 13px; color: var(--mute); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.pills button:hover { color: var(--ink); }
.pills button.on { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
/* Collapsed to the current choice; the others slide out on hover or focus. */
.pills.collapse { gap: 0; }
.pills.collapse button { white-space: nowrap; transition: max-width .2s, padding .2s, opacity .15s, margin .2s; max-width: 120px; }
.pills.collapse button + button { margin-left: 2px; }
.pills.collapse:not(:hover):not(:focus-within) button:not(.on) { max-width: 0; padding-inline: 0; margin-left: 0; opacity: 0; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .pills.collapse button { transition: none; } }
.notice { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; padding: 14px 16px; border-radius: var(--r); background: var(--sunken); border: 1px solid var(--line); margin-bottom: 16px; font-size: 14.5px; }
.notice.warn { background: var(--whisper-bg); border-color: transparent; }
.tag { font-size: 11px; font-weight: 500; letter-spacing: .03em; padding: 2px 7px; border-radius: 999px; background: var(--sunken); color: var(--mute); }
.pill { font-size: 11px; font-weight: 500; letter-spacing: .03em; padding: 2px 7px; border-radius: 999px; display: inline-flex; gap: 4px; align-items: center; }
.pill.staff { background: var(--accent-soft); color: var(--accent); }
.pill.tl { background: var(--sunken); color: var(--mute); }
.pill.locked { background: var(--sunken); color: var(--mute); }
.pill.whisper { background: var(--whisper-bg); color: var(--whisper); }
.mono { font-family: var(--mono); font-size: .9em; }

/* Avatars */
.av { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; flex: none; cursor: pointer; border: 0; padding: 0; }

/* Thread list */
.list { list-style: none; margin: 0 -10px; padding: 0; }
/* A board spans the content area; thread titles start where the header's text does (--head-x, measured). */
.page:has(> .list:not(.hits)) { max-width: none; padding: 16px 10px 40px 0; }
.page:has(> .list:not(.hits)) > :not(.list) { margin-left: var(--head-x, 42px); }
.list:not(.hits) { margin: 0; }
.list:not(.hits) li { padding-left: max(0px, calc(var(--head-x, 42px) - 42px)); }
.list .marks { display: flex; gap: 5px; align-items: center; justify-content: flex-end; }
.page.groups { max-width: none; padding: 20px 20px 40px var(--head-x, 42px); }
.ev-head { flex: none; padding: 18px 20px 6px var(--head-x, 42px); }
.ev-desc { margin: 10px 0 0; font-size: 13px; color: var(--mute); max-width: 70ch; }
.ev-tabs { display: flex; align-items: center; gap: 22px; }
.ev-tabs button { background: none; border: 0; padding: 0; font: 600 19px/1.3 var(--body); color: var(--mute); cursor: pointer; white-space: nowrap; }
.ev-tabs button:hover { color: var(--ink); }
.ev-tabs button.on { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 7px; text-decoration-color: var(--accent); }
.page.events { max-width: none; padding: 8px 20px 40px var(--head-x, 42px); }
.ev-group h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin: 18px 0 8px; }
.ev-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ev { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 16px; align-items: start; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; }
.ev-date { display: grid; justify-items: center; padding: 6px 0; border-radius: 8px; background: var(--sunken); font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--mute); line-height: 1.2; }
.ev-date b { font-size: 20px; color: var(--ink); line-height: 1.15; font-variant-numeric: tabular-nums; }
.ev-main { min-width: 0; display: grid; gap: 4px; }
.ev-main h3 { margin: 0; font-size: 15.5px; }
.ev-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--mute); }
.ev-meta span { display: inline-flex; align-items: center; gap: 4px; }
.ev-main p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); text-wrap: pretty; }
.ev-by { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12.5px; color: var(--mute); }
.ev-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.group-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.group-card { display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.group-title { align-self: flex-start; background: none; border: 0; padding: 0; font: 600 16px/1.3 var(--body); color: var(--ink); cursor: pointer; text-align: left; }
.group-title:hover { color: var(--accent-text); }
.group-card p { margin: 0; flex: 1; font-size: 13.5px; line-height: 1.5; color: var(--mute); text-wrap: pretty; }
.group-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--mute); }
.group-grid.compact { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.compact .group-card { gap: 4px; padding: 12px 12px 10px; border-radius: 8px; }
.compact .group-title { font-size: 14.5px; }
.compact .group-card p { flex: none; margin-bottom: auto; font-size: 12.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.compact .group-foot { margin-top: 4px; padding-top: 8px; font-size: 12px; }
.compact .group-foot .btn { height: 26px; padding: 0 10px; font-size: 12.5px; }
.compact .group-foot svg { width: 13px; height: 13px; }
.group-foot span { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.list .chat-ico { color: var(--mute); }
/* The channel's chat: a wide speech bubble, tail at the bottom right. Inset 16px, with the marker column shrunk to match. */
.list li.no-chan.chat-row { --bub: var(--bg); position: relative; margin: 2px 0 14px 16px; grid-template-columns: 11px minmax(0, 1fr) 110px 44px; border: 1px solid var(--line); border-radius: 14px; background: var(--bub); }
.list li.no-chan.chat-row:hover { --bub: var(--sunken); }
.chat-row .tail { position: absolute; right: 22px; bottom: -8.5px; width: 14.7px; height: 9.3px; overflow: visible; pointer-events: none; }
.chat-row .tail .fill { fill: var(--bub); transition: fill .15s; }
.chat-row .tail .edge { fill: none; stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.chat-row .active { font-size: 13px; font-weight: 400; color: var(--mute); white-space: nowrap; }
.list .dot { width: 8px; height: 8px; border-radius: 50%; background: color-mix(in srgb, var(--mute) 55%, var(--bg)); }
.list .marks .count { background: var(--hover); color: var(--ink-2); }
/* Centred under the header's icon, which sits 14px left of the header text. */
.list:not(.hits) .marks { justify-content: center; transform: translateX(14px); }
.list li { display: grid; grid-template-columns: 28px minmax(0, 1fr) 110px 170px 44px; gap: 14px; align-items: center; padding: 9px 10px; border-radius: 8px; cursor: pointer; transition: background-color .15s; }
.list li.no-chan { grid-template-columns: 28px minmax(0, 1fr) 110px 44px; }
.list li:hover { background: var(--sunken); }
.list .t { font-weight: 600; font-size: 15px; display: flex; gap: 7px; align-items: center; min-width: 0; }
.list .t .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.list .t.read { font-weight: 400; color: var(--mute); }
.list .flag { color: var(--mute); display: inline-flex; flex: none; }
.list .t .pill, .list .t .count { flex: none; }
.list .chan { color: var(--mute); font-size: 13px; display: inline-flex; gap: 3px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.list .age { color: var(--mute); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.list .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--mute); margin-top: 3px; align-items: center; }
.faces { display: flex; justify-content: flex-end; }
.list .chan svg { flex: none; }
.list .chan .cn { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.faces .av { margin-left: -6px; box-shadow: 0 0 0 2px var(--bg); }
.faces .av:first-child { margin-left: 0; }
.empty { color: var(--mute); padding: 28px 0; }

/* Posts */
.post { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 14px; padding: 16px 0; border-bottom: 1px solid var(--line); position: relative; }
.post.target { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); border-radius: 6px; }
.post.whisper { background: var(--whisper-bg); border-radius: var(--r); padding: 14px 12px; margin: 6px -12px; border-bottom: 0; }
.post.hidden .body { opacity: .45; }
.post-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 3px; }
.post-head .name { font-weight: 600; cursor: pointer; border: 0; background: none; padding: 0; font-size: 15px; }
.post-head .handle { color: var(--mute); font-size: 13px; }
.post-head .right { margin-left: auto; display: flex; gap: 10px; align-items: baseline; color: var(--mute); font-size: 13px; }
.post-head .right button { background: none; border: 0; padding: 0; color: var(--mute); cursor: pointer; font: inherit; }
.post-head .right button:hover { color: var(--ink); text-decoration: underline; }
.replying-to { font-size: 13px; color: var(--mute); background: none; border: 0; padding: 0; cursor: pointer; }
.body { overflow-wrap: anywhere; }
.body p { margin: 0 0 .6em; text-wrap: pretty; }
.body > :last-child { margin-bottom: 0; }
.body ul, .body ol { margin: 0 0 .6em; padding-left: 1.3em; text-wrap: pretty; }
.body h3 { font-size: 1.05em; margin: 1em 0 .4em; }
.body pre { margin: 0 0 .6em; padding: 10px 12px; background: var(--sunken); border-radius: 6px; overflow-x: auto; }
.body pre code { background: none; padding: 0; font-size: .85em; white-space: pre; }
.body code { font: .88em var(--mono); background: var(--sunken); padding: .1em .35em; border-radius: 4px; }
.body a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.body blockquote { margin: 0 0 .6em; padding: 6px 12px; border-left: 3px solid var(--line); color: var(--ink-2); background: var(--sunken); border-radius: 0 6px 6px 0; }
.rx { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.rx button { border: 1px solid transparent; background: var(--sunken); color: var(--ink-2); border-radius: 999px; padding: 1px 9px; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
.rx button.mine { background: var(--accent-soft); color: var(--accent-text); }
.rx .add { color: var(--mute); }
.palette { display: inline-flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 12px var(--shadow); }
.palette button { border: 0; background: none; font-size: 17px; padding: 2px 5px; border-radius: 6px; cursor: pointer; }
.palette button:hover { background: var(--sunken); }
.actions { position: absolute; right: 0; top: -12px; display: none; gap: 2px; padding: 3px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 8px var(--shadow); }
.post:hover .actions, .msg:hover .actions, .post:focus-within .actions, .msg:focus-within .actions { display: flex; }
.actions button { border: 0; background: none; padding: 3px 8px; border-radius: 5px; cursor: pointer; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.actions button:hover { background: var(--sunken); color: var(--ink); }
.actions button.danger { color: var(--danger); }
.history { margin-top: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); font-size: 14px; }
.history div { padding: 8px 12px; border-top: 1px solid var(--line); }
.history div:first-child { border-top: 0; }
.history .when { font-size: 12px; color: var(--mute); display: block; }
.history del { color: var(--danger); background: var(--danger-bg); text-decoration: none; }
.history ins { color: var(--good); background: var(--good-bg); text-decoration: none; }
.event { display: flex; gap: 10px; align-items: center; padding: 12px 0 12px 58px; color: var(--mute); font-size: 14px; border-bottom: 1px solid var(--line); }
.thread-grid { display: grid; grid-template-columns: minmax(0, 1fr) 128px; gap: 48px; }
.rail { position: sticky; top: 76px; align-self: start; padding-top: 6px; font-size: 13px; color: var(--mute); }
.rail .track { position: relative; height: 220px; border-left: 2px solid var(--line); margin: 10px 0 10px 6px; }
.rail .knob { position: absolute; left: -5px; width: 8px; height: 46px; border-radius: 4px; background: var(--accent); }
.rail .pos { position: absolute; left: 14px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rail button { background: none; border: 0; padding: 0; color: var(--mute); cursor: pointer; font: inherit; display: block; }
.rail button:hover { color: var(--ink); }
.rail-actions { position: relative; display: inline-grid; gap: 6px; margin-top: 18px; }
.rail .rail-actions .btn { display: inline-flex; justify-content: flex-start; gap: 6px; height: 28px; padding: 0 10px; color: var(--ink); background: var(--sunken); border: 1px solid var(--line); }
.rail .rail-actions .btn:hover { background: var(--line); }
.rail .rail-actions .btn.reply { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }
.rail .rail-actions .btn.reply:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.notify-menu { position: absolute; right: 0; top: calc(100% + 6px); width: 280px; z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 12px var(--shadow); padding: 6px; }
.rail .notify-menu button { display: grid; grid-template-columns: 20px 1fr; gap: 2px 8px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; color: var(--ink); }
.rail .notify-menu button:hover { background: var(--sunken); }
.rail .notify-menu button[aria-checked="true"] { background: var(--accent-soft); }
.notify-menu b { font-weight: 600; font-size: 14px; }
.notify-menu small { grid-column: 2; font-size: 12.5px; line-height: 1.4; color: var(--mute); }
.notify-menu svg { margin-top: 2px; }

/* Chat */
.chat { padding: 8px 0; }
.day { display: flex; align-items: center; gap: 10px; color: var(--mute); font-size: 12px; font-weight: 600; margin: 14px 0 6px; }
.day::before, .day::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.msg { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 12px; padding: 3px 8px; margin: 0 -8px; border-radius: 6px; position: relative; }
.msg:hover { background: var(--sunken); }
.msg.first { margin-top: 10px; }
.msg .stamp { font-size: 11px; color: transparent; text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
.msg:hover .stamp { color: var(--mute); }
.msg .post-head { margin-bottom: 0; }
.spawned { margin-top: 6px; display: inline-flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunken); cursor: pointer; font-size: 13.5px; }
.spawned b { color: var(--accent); }

/* Composer */
.dock { position: sticky; bottom: 0; padding: 12px 0 18px; background: linear-gradient(transparent, var(--bg) 26%); }
/* A thread's reply box sits at the end of the thread until you start a reply. */
.dock.thread-dock:not(.active) { position: static; background: none; }
.composer { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 8px; display: grid; gap: 6px; }
.composer:focus-within { border-color: var(--accent); }
.composer input, .composer textarea { width: 100%; border: 0; background: none; color: var(--ink); font: inherit; padding: 6px 8px; resize: none; }
.composer input { font-weight: 600; font-size: 16px; border-bottom: 1px solid var(--line); }
.composer textarea:focus, .composer input:focus { outline: none; }
.composer .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.composer .row .grow { flex: 1; font-size: 12.5px; color: var(--mute); min-width: 0; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--whisper); cursor: pointer; }
.quoting { font-size: 13px; color: var(--mute); display: flex; gap: 8px; align-items: center; padding: 0 8px; }
.quoting button { background: none; border: 0; color: var(--mute); cursor: pointer; }
.locked-note { color: var(--mute); padding: 16px 0; display: flex; gap: 8px; align-items: center; }

/* Review queue & cards */
.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 14px 16px; display: grid; gap: 10px; margin-bottom: 12px; }
.card .why { font-size: 13px; color: var(--mute); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; }
mark { background: var(--whisper-bg); color: inherit; border-radius: 3px; padding: 0 2px; }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .4); display: grid; place-items: center; z-index: 50; padding: 16px; }

n youtube cause my correspondents are single language).","likes":0,"s":"Argues the technology is hard to convey to a non-technical audience."}]},{"id":1278,"ch":"WG Private Data","title":"Post-alpha plans","tags":["private-data"],"total":7,"last":"2026-10-15T22:52:13Z","posts":[{"u":"dholms.xyz","at":"2026-09-22T22:44:34Z","q":"Hey folks","likes":12,"s":"The spaces alpha is mostly stable; lists open design questions likely needing breaking changes, to resolve by end of October."},{"u":"nnabeyang","at":"2026-09-23T22:51:13Z","q":"Thank you for laying out the questions for the post-alpha phase.","likes":3,"s":"Detailed feedback on credentials, public spaces, DPoP, notifications and URI design."},{"u":"nel.pet","at":"2026-10-01T00:03:41Z","q":"I was about to make a separate topic but noticed this was here and this is niche-ish sync concern.","likes":0,"s":"Proposes an endpoint listing the spaces a host will grant an identity."},{"u":"bnewbold.net","at":"2026-10-01T04:03:08Z","q":"There is a bunch here!","likes":1,"s":"Space access is tied to user sessions, so a discovery endpoint is hard to offer.","re":3}]},{"id":1345,"ch":"Lexicon Community","title":"A shared lexicon for *video notes*? Looking for input before I build","total":3,"last":"2026-10-15T18:09:03Z","posts":[{"u":"renderg.host","at":"2026-10-15T15:06:13Z","q":"I’m considering tobuild an app for recording short screen videos and sharing them as video notes.","likes":1,"s":"\"Loom for AT\": asks for feedback on note, comment, transcript and collection records."},{"u":"bmann.ca","at":"2026-10-15T15:27:48Z","q":"Great write up. I’d start with planning for spaces day 1, but you don’t really need to design anything","likes":0,"s":"Recommends tags and rich-text comments that can embed Bluesky posts."},{"u":"maboa.bsky.social","at":"2026-10-15T18:09:03Z","q":"Hi – I’m working on a transcript format for atproto with Streamplace and Ionosphere, provisionally called TAML","likes":1,"s":"Links a draft spec and developer real-time data.","re":2},{"u":"Bumblefudge","at":"2026-10-14T11:33:29Z","q":"Forgive the philosophical distraction, but are these use cases for independent implementations of the protocol","likes":0,"re":3}]},{"id":1334,"ch":"Discussion","title":"Renaming `at:alternate` metadata to align semantics with `rel=`","total":2,"last":"2026-10-14T08:31:38Z","posts":[{"u":"essentialrandom.bsky.social","at":"2026-10-12T21:42:21Z","q":"Continuing the discussion from Connecting records, web pages and apps.","likes":6,"s":"Argues rel=\"alternate\" means an alternate representation of one document, and suggests at:related instead."},{"u":"lemmaeof.gay","at":"2026-10-14T08:31:38Z","q":"I’m in favor of at:related!","likes":1}]},{"id":1042,"ch":"WG Books","title":"In Which A Book Lexicon is Born","tags":["lexicon","use-case","design"],"total":41,"last":"2026-09-18T20:39:46Z","posts":[{"u":"omg.jacky.wtf","at":"2026-08-03T03:15:31Z","text":"Hi everyone,\n\nWe recently held a sync to discuss creating a shared book lexicon for the Atmosphere Protocol. I’ve shared the full recording (thanks Ronen!) and notes from the meeting here: [Fathom](https://fathom.video/share/4vt3sTSFWtQ13yyHpXYNq9oJf3R6QfQy) with some early notes here: [Notion](https://app.notion.com/p/Book-Lexicon-Session-1-211b2b43aabb8007b098d063972ca58c) (also do we have a ATProto version of Notion yet?)\n\nThe book logging social scene is highly fragmented. Dozens of Goodreads alternatives are competing but not interoperating, leading to a lack of shared network effects and ultimately, app failures. This thread is meant to **gather community feedback**, surface adjacent integrations, and **recruit members for a future formal working group (ONE OF US! ONE OF US!)**.\n\n### #p-4696-holding-data-unions-and-indiesky-in-tandem-1Holding “Data Unions” and “IndieSky” in Tandem\n\nA core concept from our meeting was the idea of building a **“Data Union”**—a model where apps share data interoperability to prevent user lock-in and build a shared network effect.\n\nAs we think about this, it’s important to hold the concept of a Data Union in tandem with the ongoing infrastructure work of **IndieSky**. IndieSky is doing the heavy lifting of providing sovereign, user-controlled data rails; the Data Union concept could (maybe?) build *on top* of it. IndieSky provides the underlying infrastructure (the “how” and “where” of sovereign data), while a shared Book Lexicon provides the cooperative application layer (the “what” and “with whom”).\n\n**The question for the community:** How do we ensure that a Data Union built on Atmosphere leverages IndieSky’s infrastructure to maximize user sovereignty while still providing the shared network effects apps need to survive?\n\n### #p-4696-the-proposed-technical-strategy-copy-over-reference-2The Proposed Technical Strategy: Copy-over-Reference\n\nTo ensure data resilience, the proposed MVP relies on a “copy-over-reference” model. When a user logs a book, their PDS gets:\n\n1. A strong reference to the main book record.\n2. A minimal metadata copy (title, author, identifiers) as a fallback.\n\nThis ensures user data remains functional even if the source book record disappears.\n\n**MVP Focus:** We want to prioritize the lexicon for core social interactions first:\n\n- **Read status** (reading, read, to-read)\n- **Reviews** (rating, text)\n\nThe complex book indexing lexicon (handling edge cases like partial books, compilations, and manga) will be developed in parallel. For indexing, we discussed a “lazy initialization” model—creating book records on-protocol only when a user interacts with them—avoiding a massive, costly backfill. *Deduplication remains a key challenge here, specifically regarding fallback keys and hash collision risks.*\n\n### #p-4696-spotlight-on-adjacent-builders-bookhive-semble-hardcover-3Spotlight on Adjacent Builders (Bookhive, Semble, Hardcover)\n\nIf you are currently building apps adjacent to this space—like **Bookhive**, **Semble**, or **Hardcover**—we want to hear from you!\n\n- How are you currently handling book metadata and user interactions?\n- Does the “copy-over-reference” model align with your app’s architecture?\n- Where do you see friction in adopting a shared lexicon?\n\nPlease drop a link to your project, highlight your current integrations, and let us know how a shared lexicon could benefit your ecosystem.\n\n### #p-4696-a-prototype-4A Prototype\n\nI also took some time this weekend to work on a prototypical AppView (think of [https://public.api.bsky.app/](https://public.api.bsky.app/) but for books) that lives up to some of these ideas. It’s available at [https://biblio.livtet.olamaelcu.net/](https://biblio.livtet.olamaelcu.net/) with the source on Tangled and on GitHub at [GitHub - olamaelcu/bibliograph: An AppView for interfacing with bibliographic information on ATProto · GitHub](https://github.com/olamaelcu/bibliograph). I’ve primed it with a lot of books from Toni Morrison and Arthur C. Clarke but it should auto-import new books if they’re discoverable by Google Books (please be kind to my API key!) or OpenLibrary. Let me know what you think - happy to host it for the community!\n\n### #p-4696-h-5","likes":8,"re":null},{"u":"chadkoh.com","at":"2026-08-03T18:21:42Z","text":"Cross posting this to Hardcover’s roadmap discussion\n\n[Add Hardover to the Bluesky-verse: add ATProto integration | Feature Requests...](https://roadmap.hardcover.app/feature-requests/posts/add-hardover-to-the-bluesky-verse-add-atproto-integration)","likes":1,"re":null},{"u":"al9000.com","at":"2026-08-03T18:49:21Z","text":"Do y’all have a plan for the format to use for the review text?\n\nText content storage in general feels like a potential, unintentional app lock-in vector across the atmosphere. At least, if the text is anything beyond paragraphs or maybe markdown.\n\nI spent the last few years designing a markdown replacement format. The original goal was to make it easier to make website content without having to jump all the way to HTML. I think the same features that make it work there have the potential to act as an interoperability layer for text across the atmosphere too. I’m happy to share a link if you’re interested in taking a look.","likes":0,"re":null},{"u":"omg.jacky.wtf","at":"2026-08-03T19:26:58Z","text":"I’m very interested to see what you got! I’m personally open to having some sort of content type hint and then letting clients support what they can (with an optional plain text value so clients that don’t support anything can still see/present *something* to end users).\n\nI’m also of the mind of having reviews be referential, so it can point to a Standard Site publication or a Bluesky post (for example) so clients can more deeply represent information.","likes":2,"re":3},{"u":"al9000.com","at":"2026-08-03T20:16:16Z","text":"Yeah, I’m right there with you on letting the clients control what they see (and being able to fall back to plain-text). My design is basically a replacement for markdown with extra horsepower thrown in. I’m making a lexicon for it, but the idea is that it works primarily as a portable, stand-alone format. You can check out the intro page here: [https://neodoc.style/](https://neodoc.style/)\n\n(I’m also writing a post to start a thread to discuss it. I should have that posted sometime tonight.)","likes":1,"re":null},{"u":"omg.jacky.wtf","at":"2026-08-04T10:32:06Z","text":"I’m liking what I’m seeing! It doesn’t look immediately backward compatible with Markdown so do you see folks using something like `contentType: “text/x-neodoc` somewhere in their records?","likes":0,"re":5},{"u":"nickthesick","at":"2026-08-04T11:01:11Z","text":"> **omg.jacky.wtf:**\n> ook logging social scene is highly fragmented. Dozens of Goodreads alternatives are competing but not interoperating, leading to a lack of shared network effects and ultimately, app failures. This thread is meant to **gather community feedback**, surface adjacent integrations, and **recruit members for a**\n\nHi there,\n\nI talked a bit about BookHive is doing this in my atmosphereconf talk & write up: [The Design Philosophy of BookHive - Nick The Sick - pckt](https://nick-the-sick.pckt.blog/the-design-philosophy-of-bookhive-s23cz85)\n\nBut, to summarize, BookHive is principled on data-sovereignty, so this means:\n\n- I take a full export of the BookHive DB everyday which anyone can bootstrap from: Publish database export artifact · Workflow runs · nperez0111/bookhive · GitHub\n- All books (lazily) are published on protocol under the bookhive.buzz service account: PDSls\n- Books are copied into the user’s PDS with “useful metadata”, other identifiers (ISBN, Goodreads, etc) & linked back to the bookhive.buzz record via hiveBookUri: PDSls\n\nSo, anyone can bootstrap bookhive.buzz from scratch & run the service on their own with the OSS code at: [GitHub - nperez0111/bookhive: Track your books, share your shelves, see what others are reading · GitHub](https://github.com/nperez0111/bookhive)\n\nThis copy-over-reference idea is almost 1:1 what I’ve already implemented in BookHive, so I’m obviously in support of it.\n\nI think that the real problem lies in multiple applications having different datasets for understanding what a book is, so making a review on one platform would simply be missed on another platform, since there is not a great way to understand that we are actually talking about the same book. Most platforms are using centralized databases where they can unilaterally make these moderation decisions, but in an open network like atproto I don’t think we really can have the same approach. I think there needs to be a sort of community linking & voting & submission system for applications to interoperate with one another.\n\nWould be happy to be part of the working group, life has just been busy lately so I didn’t get around to this until now.","likes":5,"re":null},{"u":"al9000.com","at":"2026-08-04T12:07:12Z","text":"Thanks! And yeah, the overall format can’t be transformed directly with a Markdown parser. I played around with the idea early on but quick realized it would have added a bunch of complexity to the both the parsing and the mental model about the format when authoring content with it. So, it’s explicitly not directly compatible with Markdown.\n\nBut, I’m adding a `-- markdown` section type that’ll provide Markdown parsing inside a NeoDoc. If you’ve got a bunch of markdown already, the conversion process would be to just throw the `-- markdown` section header in front of it and it’ll do the thing.\n\nYou’ve also got me thinking about YAML. I know lots of folks use it for front matter, but I wasn’t originally planning on adding support. That decision was based off the fact that the reference parser is written and rust and the main yaml parsing crate is no longer maintained. But, I just checked and it still gets hundreds of thousands of downloads every 90 days. So I think it’s more that it’s basically feature complete. The only potential issue would be bugs/security problems, but it could always be forked if that happens. Probably best to add it to make it easier for folks to migrate old docs.\n\nI hadn’t thought about the `contentType`. That sounds like a good idea, but I don’t know enough about how everything works to know what to do with it (e.g. if I’ve got a lexicon I’d expect that’s not required? but maybe if other folks want to use the parser inside their stuff they need it? I’ll have to look into that more).","likes":1,"re":6},{"u":"adamfortuna","at":"2026-08-04T19:27:10Z","text":"Loving the conversation here (and in person and in the email thread!). I’ve been staying up to date and trying to wrap my head around it all. I’ve been working on this problem for the last 5 years on the Hardcover side, but this is the first anything I’ve done using Atmosphere and PDSs and that side of things, so please feel free to correct anything I say that feels off, or lacks understanding of that side of this.\n\nI wanted to break down a few concepts that I’ve seen touched on, with some thoughts on how we’re solving them today, and touching on some ideas on how to solve them long-term in a decentralized way.\n\n### #p-4723-booksworks-vs-editions-1Books/Works vs Editions\n\nI think this is one of the biggest concepts that if we can get right, it powers a ton of things across different sites (ex: View the Spanish version? / View the Audiobook version? / Is there a DRM free ebook for this book? Which audiobook edition has the highest rating? Which has a narrator that I like the most?).\n\nTo go back to @nickthesick ‘s mention of including all the useful data needed, the Edition has some of the relevant useful data to the user reading that edition. Without edition information you could say “I’m 50% of the way done with the book”. With the edition information you could say “I’m on page 256 out of 512 on the Hardcover edition of Book”, or “I’m 12 hours and 42 seconds out 20 hours and 5 minutes of the audiobook edition”. Also, different editions have different cover images, and we’ve found users **really** want to see the cover of the edition they have.\n\nIn order to see stats like listening time or pages read, edition information is required, and progress updates need to be linked to the edition. It can be an annoying step, both for data and for the user, but for full accuracy it’s needed.\n\nAll of that data lives in the relationship between a Book and an Edition. OpenLibrary calls these Works, which I think is a more universal term for an abstract “representation of a book”.\n\nImportant things to note about a Work/Book vs an Edition:\n\n- An Edition AND a Book/Work can have identifiers back to other platforms. On Hardcover, we have edition_id and book_id. OpenLibrary uses keys like /works/OL82563W (work/book) and /books/OL1439870M (Edition).\n- Choosing a title for the “Book/Work” gets more difficult the broader it is (ex: different languages, or even HP and the [Sorcerers|Philosophers] Stone).\n- Not all Editions have an identifier. Some editions don’t have ISBNs or ASINs (I’m looking at you Manga .)\n- Series data is best mapped to the Book/Work, not the edition. That way * The Hobbit is considered Book 0 of The Lord of the Rings, rather than all 519+ editions needing that data.\n\nI think the takeaway here is that an ISBN identifies an edition, not a work. So if ISBN is the dedup key, `community.lexicon.book.book` is edition-shaped. But `.review` and `.status` are going to be written at whatever level users think in, which is usually the `work`. If I listen to the audiobook and you read the paperback, we’re both reading the same book and we want to see each other’s reviews, but we don’t share an ISBN.\n\nDeciding where to draw the line for a work/book is tough. Here are some fun edge cases, and what decisions we made:\n\n- If a work/book has editions in multiple languages, are those the same work? (Hardcover: all language editions are children of the same book/work, just in different languages)\n- What about abridged vs non-abridged? (Hardcover: These are children editions of the same book, however we don’t current abridged separately other than in text fields).\n- What about partial books (Hardcover: * The Way of Kings Part 1) (Hardcover: we call this a “partial edition”, which has a single parent book).\n- What about book collections, ex: * The Adventures of Tom Sawyer and Adventures of Huckleberry Finn contains two separate books. (Hardcover: We track this as a different book than Sawyer/Huckberry Fin, with a “Collection” boolean, then track the “books” this book contains as an ordered array of book ids).\n- How is non-english data about the Work/Book stored (title, description, etc)? (Hardcover: we do not do this today ).\n- What about translations of an Edition? The translation of * The Odyssey by Emily Wilson was the first by a woman from the original source text, and has notably different meaning in some places to other translations. (Hardcover: we consider all translations to be editions of the same source, and all the same book).\n\nOne tricky thing I see is that different sites will decide what makes up a Book/Work is different. Some places might want to separate Work/Book by language to side step that last question. Or they might consider abridged a separate Work/Book because reviews would be notably different.\n\nHere’s the visual representation of how this ends up working.\n\n```\n   ┌───────────────────────────┐\n   │           Book            │   the work\n   │  title, authors, series   │   \"Project Hail Mary\"\n   │  canonical edition        │\n   │  dto json     ◄───────────┼── cached json combining all edition dtos\n   └─────────────┬─────────────┘\n                 │ 1..n\n   ┌─────────────▼─────────────┐\n   │          Edition          │   the manifestation\n   │  isbn10, isbn13, asin     │   format: physical | ebook | audio\n   │  format, language         │   pages OR audio duration\n   │  publisher, release date  │\n   │  pages / audio seconds    │\n   │  contributors (narrator,  │\n   │    translator, editor)    │\n   │  dto json     ◄───────────┼── cached json combining all book mapping dtos\n   └─────────────┬─────────────┘\n                 │ 1..n\n   ┌─────────────▼─────────────┐\n   │       BookMapping         │   external identity + snapshot\n   │  source (OpenLibrary,     │\n   │    Google Books, etc)     │\n   │  external_id              │\n   │  payload text ◄───────────┼── cached snapshot of source\n   │  dto json     ◄───────────┼── cached json representation of source\n   │  fetched_at               │\n   └───────────────────────────┘\n```\n\nThis mirrors how we store data on Hardcover, which I wrote more about [here](https://hardcover.app/pages/book-data). We have a service we call a “prioritizer” which knows which fields to grab from different mappings (ex: use the Title from Goodreads, use the data and description from Google Books, use the cover from Google, use the edition information from Open Library, etc). That rolls up N BookMappings into a single Edition. Then we repeat that process to roll up N Editions into a Book, favoring the Editions in each format that has the most readers (ex: This Book is 294 pages or 12 hours 9 minutes based on Edition X and Y).\n\nI could see a case for all of us collaborating on the Edition Level, but then with different concepts of what the “book/work” level is in different platforms. We could have both entities, and then use a composite key / snapshot both of those dto (data transfer objects / snaptshot / whatever we call it) objects into the users PDS to represent the book + edition.\n\nIn that case edition wouldn’t “belong” to a book, but would belong to many “books”. I’d love to figure out a structure that works for both, but I suspect some voting/linking might be needed there.\n\n### #p-4723-librarians-curators-non-author-editors-2Librarians / Curators / Non-Author Editors\n\nHardcover maintains a book database with a community of volunteer librarians. That’s a role people apply for, and a Hardcover team member (usually one of 3 librarians, but could be any of the 15 of us working part time for equity + me full-ish time) will grant that permission. Librarians have [resources in our docs](https://docs.hardcover.app/librarians/getting-started/) to understand standards, as well as a channel in the [Hardcover Discord](https://discord.gg/hardcover) that only Librarians can access by linking Discord with Hardcover.\n\nLibrarians can merge have an “access level”, and can merge books together that impact users below that threshold. This can be disruptive if done wrong, since now all users past history is now wrong.\n\n### #p-4723-progress-is-two-different-records-3Progress is Two Different Records\n\nThis one seems small and I don’t think it is. “I’m on page 200” is three separate facts:\n\n1. **A log entry.** An event, at a timestamp, against a specific edition. Immutable, append-only, and it’s what reading history, stats, and streaks are built from.\n2. **Current position.** State. Mutable, one per user per book, and it’s what the UI reads to show you where you are.\n3. **All reads**. Log of the overall reads, edition and when. I started the audiobook edition on May 1 and finished it on May 8.\n\nWe store both. Collapsing them into one mutable record loses history, and I noticed BookHive ran into a version of this already (issue #41, where status changes on a mutated record all inherit the original `createdAt`).\n\nIt also matters for format: page 200 and minute 340 aren’t the same unit, and progress only makes sense against the edition you’re actually consuming. So the log entry needs an edition reference even if status lives at the work level.\n\n(The above progress section was co-written with Claude, which did some research on my behalf).\n\n### #p-4723-review-text-formatting-4Review Text Formatting\n\nI think we should make plaintext field mandatory, and have content included in multiple formats. Maybe a plaintext version then an array of `contentType` versions provided by the platform?\n\nHardcover currently saves all reviews in plaintext (which is used to create the also cached length), and Slate in JSON custom format that supports spoiler tags, links to other entities in our system, etc). If we used something like @omg.jacky.wtf mentioned with `contentType: “text/x-slate-hardcover-1` for this, each platform could own this format, while still having the plaintext. We’d save the HTML and Markdown versions in here as well for convenience, which are derived from the Slate document.\n\n### #p-4723-claims-and-edit-rights-are-two-systems-5Claims and edit rights are two systems\n\nBibliograph’s `claim` record seems to do double duty: it establishes that a DID is the author or publisher, and it grants edit rights, with librarian status accruing from holding multiple verified claims.\n\nThose probably want to come apart. Authors are subjects of the data. Librarians are curators of it. In our experience the overlap is small, and the incentives are different enough that merging them causes trouble.\n\nWe’re mid-design on author verification right now, and the thing that pushed us away from a single gate (ID upload, DNS record, that kind of thing) is that it excludes almost everyone who isn’t already well resourced. What we landed on instead is accumulating lightweight signals toward a two-tier badge: social cross-linking, publisher vouching, email domain, and ORCID, which is the one signal that’s fully automatable and which I haven’t seen mentioned here yet. Worth a look if the claim record is going to carry any weight.\n\n### #p-4723-additional-review-metadata-6Additional Review Metadata\n\nI’m curious to learn more how about reviews in other platforms handle it when different services might add on additional fields as part of a review. We have a few other fields that we consider part of the “review”:\n\n- Sponsored Content?\n- Review contains spoilers?\n- Canonical URL for this review\n- Media URLs (posts to Instagram, TikTok, etc that contain the same content).\n\nThe last two are important for reshowing the review and linking back to the original. When we show a review that has a canonical tag, we add that [canonical URL](https://developers.google.com/search/docs/advanced/crawling/consolidate-duplicate-urls) in the header so the original author URL gets the SEO credit. The media URLs allow for embedding other formats of the review alongside and for some other really neat future-features (ex: video feed of reviews by readers with similar taste to you for books we recommend for you).\n\nOther sites might have other metadata they ask for too: tags, moods, genres, pace, character vs plot, spiciness, you name it.\n\n### #p-4723-private-and-follower-only-data-is-unaddressed-7Private and follower-only data is unaddressed\n\nI’ve been following different people working on private and following only data on ATproto, but I think this is still something that’s being figured out. Is anyone familiar with those options and their status?\n\nThe MVP scope is read status and reviews, with no visibility model. Repos are world-readable and there aren’t private data primitives yet, so anything written on-protocol is public, full stop.\n\nThat’s fine for the MVP, but I’d like to see a `visibility` field in the record shape from day one even if the only supported value initially is `public`. It gives apps a defensible answer to “why isn’t all my data here,” and it means the lexicon doesn’t need a v2 the moment private primitives land. On our side, private entries just wouldn’t sync at all, driven by that field.\n\n### #p-4723-what-hardcover-can-bring-8What Hardcover Can Bring\n\n@nickthesick ‘s second takeaway is a that good book data is very hard to get and enrichment work benefits everyone, and I agree. Once we land on a shape of the models that works, we can help seed it. We currently don’t have ATProto integration on the site, but I’ve been looking into allowing users to bring their own PDS and we’ll save their data there. The private/following only side of Hardcover’s data has been the biggest blocker for me on getting started with any kind of integration there. I think if we can figure out how the entities map between systems and figure out private/following only data, then we’d be in a good spot to start something.\n\nI suspect we’d create a bunch more entities in there specific to Hardcover as well (lists the user created, prompts they’ve answered, etc).\n\nCount me in for the working group!","likes":5,"re":null},{"u":"omg.jacky.wtf","at":"2026-08-05T16:46:12Z","text":"> **adamfortuna:**\n> Also, different editions have different cover images, and we’ve found users **really** want to see the cover of the edition they have.\n\nIt’s me, I’m such a user :grin:\n There’s something about seeing the thing you have being represented to the highest fidelity that is affirming.\n\n> **adamfortuna:**\n> I think the takeaway here is that an ISBN identifies an edition, not a work. So if ISBN is the dedup key, `community.lexicon.book.book` is edition-shaped. But `.review` and `.status` are going to be written at whatever level users think in, which is usually the `work`. If I listen to the audiobook and you read the paperback, we’re both reading the same book and we want to see each other’s reviews, but we don’t share an ISBN.\n\nThis is an *important* distinction and makes me wonder if we should introduce a `community.lexicon.book.edition` as well. So far, with [Bibliograph](https://biblio.livtet.olamaelcu.net/), it’s been operating solely on the edition level - I can rework it to consider this.\n\n> **adamfortuna:**\n> One tricky thing I see is that different sites will decide what makes up a Book/Work is different. Some places might want to separate Work/Book by language to side step that last question. Or they might consider abridged a separate Work/Book because reviews would be notably different.\n\nFrankly, I am willing to follow *your lead* so far with the modeling of the data since it works and is durable.\n\n> **adamfortuna:**\n> I could see a case for all of us collaborating on the Edition Level, but then with different concepts of what the “book/work” level is in different platforms. We could have both entities, and then use a composite key / snapshot both of those dto (data transfer objects / snaptshot / whatever we call it) objects into the users PDS to represent the book + edition.\n> In that case edition wouldn’t “belong” to a book, but would belong to many “books”. I’d love to figure out a structure that works for both, but I suspect some voting/linking might be needed there.\n\nI agree here. So [https://constellation.microcosm.blue/](https://constellation.microcosm.blue/) provides the ability to discover *backlinks* to data. If every version of a edition points back to its parent book that we agree on then this *should* work well. Especially if one was building their own version of Bibliograph (I call it an AppView but tbh, someone could make it as a cron that processes things from the firehose once in a while).\n\nRegarding librarians, this is a little tricky. We *could* have a labeler service that would be appointing folks the title so then if they publish an edit of a book then these services would update in response. But then we’d need *trusted* labelers (think of this like the verification process on BlueSky). Tbh, if we could get OpenLibrary in the loop as well, that would give us their verifiers and data in one go versus doing monthly dumps.\n\n> **adamfortuna:**\n> page 200 and minute 340 aren’t the same unit,\n\nI *specifically* [wrote a progress unit](https://github.com/olamaelcu/livtet/blob/main/livtet-types/src/progress_unit.rs) for this reason because I plan to incorporate a reader and Readium’s approach uses CFI for pinpoint accuracy.\n\n> **adamfortuna:**\n> I think we should make plaintext field mandatory, and have content included in multiple formats. Maybe a plaintext version then an array of `contentType` versions provided by the platform?\n\nI’m *very* in favor of this. Graceful degradation and opt-in enrichment. Only things that wouldn’t be possible would probably be like spoilers, content warnings, etc but that might be a fact of the content medium (how would you implement a spoilers tag in the CLI - for example).\n\n> **adamfortuna:**\n> Bibliograph’s `claim` record seems to do double duty: it establishes that a DID is the author or publisher, and it grants edit rights, with librarian status accruing from holding multiple verified claims.\n\nTrue! I didn’t consider this. I ran ahead with the idea that an author can also update the information about their own book but I guess that’s a semantic conflict of access.\n\n> **adamfortuna:**\n> What we landed on instead is accumulating lightweight signals toward a two-tier badge: social cross-linking, publisher vouching, email domain, and ORCID, which is the one signal that’s fully automatable and which I haven’t seen mentioned here yet. Worth a look if the claim record is going to carry any weight.\n\nI *thiiiiiink* [https://sifa.id/](https://sifa.id/) might be able to help with that part re: ORCID\n\n> **adamfortuna:**\n> That’s fine for the MVP, but I’d like to see a `visibility` field in the record shape from day one even if the only supported value initially is `public`. It gives apps a defensible answer to “why isn’t all my data here,” and it means the lexicon doesn’t need a v2 the moment private primitives land. On our side, private entries just wouldn’t sync at all, driven by that field.\n\nI think it’s less of a field *on* the data and more about *where* the data is written. Permissioned spaces would enable this (so it’s like gated access to data that *doesn’t* live in one’s repo explicitly, from my understanding; tagging @dholms.xyz to confirm this; they’re the resident expert on that).","likes":2,"re":9},{"u":"omg.jacky.wtf","at":"2026-08-05T16:47:22Z","text":"> **nickthesick:**\n> I think that the real problem lies in multiple applications having different datasets for understanding what a book is, so making a review on one platform would simply be missed on another platform, since there is not a great way to understand that we are actually talking about the same book.\n\nI agree. I’m in favor of stuffing identifiers to the brim if it helps with disambiguation. I enjoyed your talk and think I have some ideas for Bibliograph (namely using your dump as a weekly seeder).","likes":0,"re":7},{"u":"tynanpurdy.com","at":"2026-08-06T19:02:40Z","text":"> **omg.jacky.wtf:**\n> Only things that wouldn’t be possible would probably be like spoilers, content warnings, etc but that might be a fact of the content medium\n\nI think an optional field in the review with a strong ref to the users current reading progress record would probably sufficiently cover spoiler gating. You might even create an XRPC method for normalizing progress across editions.","likes":1,"re":10},{"u":"tynanpurdy.com","at":"2026-08-06T19:05:37Z","text":"@adamfortuna if you know any of the developers of other review apps like storygraph or fable or all the other ones, I’m not even aware of, I would love to invite them to this discussion as well. The idea is lots of apps adopt whatever we define here so I would love to include them in the schema shaping process.","likes":1,"re":null},{"u":"lkanies","at":"2026-08-06T20:52:38Z","text":"Hi all - not to overcomplicate everything, but I see this as part of a class of problems, and I wonder if it’s helpful to think of the wider class when designing.\n\nI’ve been thinking of a collection of review apps that all share a couple of traits:\n\n- They’re, uh, reviews (usually; they might just be logs, of reading or eating or whatever)\n- They review objective things in the world (i.e., thinks you could have an objective list of, vs, say, experiences or activities which are essentially infinite)\n- There are apps for most/all of these, but they are problematic in multiple ways (in particular, users don’t own their data, and the list of objects is private and proprietary)\n\nExamples are:\n\n- Restaurants (the big one, IMO, in terms of user base and utility)\n- Books (also very big)\n- Whiskey/Wine/Beer/etc\n\nThe data you need to store about a book is quite different from the data you need to store about wine. But both need a method for building a publicly maintained list that will increase in depth and quality over time and provides objective reference capabilities. And both seem simple but actually have a lot of complexity (editions for books, as discussed above, and things like year, vineyard, and grape mix for wine).\n\nI wouldn’t want someone to slow down building in order to solve everything at once. But as people build, it’s worth considering whether lessons from these other areas can inform designs. I’m also interested in what a meta-review app might look like; e.g., I only drink wine once in a while, so I’m not interested in installing a wine app. But I’d like the ability to record a review when i happen across a notable one. It’d be nice to have a restaurant and book review app installed (because I care a lot about those), but not a wine review app, and be able to see and manage them all in that one app, or go into the focused app for the details the meta app doesn’t or can’t care about.\n\nIn particular, the concerns around authenticating an author resonate very strongly with restaurants: I am flummoxed that every restaurant in the world doesn’t at least have a basic web site with a menu, hours, and contact info, but… they don’t. Thus, we can’t really expect them to be able to authenticate themselves as an owner.","likes":0,"re":7},{"u":"al9000.com","at":"2026-08-08T13:35:29Z","text":"### #p-4796-notes-on-a-plain-text-field-1Notes on a Plain Text Field\n\n### #p-4796-definitely-a-good-idea-2Definitely a Good Idea\n\n> **adamfortuna:**\n> I think we should make plaintext field mandatory, and have content included in multiple formats. Maybe a plaintext version then an array of `contentType` versions provided by the platform?\n\nFirst off, couldn’t agree more with the first part. A plain text field feels absolutely necessary. We should strive to make content in the Atmosphere as portable as possible. Plain text distribution can go a long way in that direction. The specific contents of the field are worthy of discussion, though.\n\nFrom the surrounding context, I read adamfortuna’s perspective to mean no explicit formatting for the plain text (i.e. it’s not markdown, just un-formatted strings of text with blank lines representing paragraph breaks). I believe that’s the wrong direction. Defining a spec with effectively no formatting severally limits the practical portability of the content.\n\nFor example, say we have two apps:\n\n- App Alfa: A book review app. It lets folks write reviews that contain strikethrough text. The lexicon for the app’s content is set up to store the original review (including identifying which text is strikethrough) in a custom format associated with a specific MIME type (e.g. `contentType: \"text/x-app-alfa-book-review\"`) that other apps can ingest. It also stores/provides a plain text version of the review with no formatting beyond empty lines for paragraph breaks.\n- App Bravo: A book review reader app. It gathers reviews from other apps (including App Alfa) and displays them in a single feed.\n\nThe developers of App Bravo have a few options when it comes to content from App Alfa. They can:\n\n1. Create a transformation process that converts `text/x-app-alfa-book-review` content into their desired output.\n2. Ingest and distribute the plain text version of the App Alfa content with a generic converter that turns empty lines into paragraph breaks.\n3. Not include the content from App Alfa.\n\nOption 1 takes work, obviously. But, if App Bravo wants the content from App Alfa, it’s really the only option.\n\nIf App Bravo tried the second option to just output the plain text content then the reviews would either be incomplete (e.g. if App Alfa removed the strikethrough text when making the plain text copy), or they would be a mess (e.g. if the strikethrough text gets included, there would be no way to identify what should be struck and what shouldn’t). Either way, the view of the content that App Bravo provides diverges from the original every time strikethrough text is used.\n\nSo, if App Bravo wants the content from App Alfa in a presentable style, they have to do the work to ingest the `text/x-app-alfa-book-review` format. Doable, but it could end up being a lot of work depending on the complexity of the format. The work would also have to be done for every other app that App Bravo wants to add to their reader.\n\nIf the plain text content App Alfa distributes is in a portable format, App Bravo can use pre-existing packages to handle the transformations with minimal workload. Even better. They only have to do that work once to cover ingesting content from every other app that also uses the format.\n\nThat leads us to Markdown.\n\n### #p-4796-markdown-3Markdown\n\nIt’s entirely possible I misunderstood the context and adamfortuna was talking about storing Markdown content in the mandatory plain text field. Things get a little better if that’s the case.\n\nWith Markdown, App Alfa can still store their data in their custom `text/x-app-alfa-book-review` format. But, the plain text Markdown version they ship has known formatting rules to apply to it. All App Bravo needs to do to render the content is put it through one of the many available Markdown processors and render the results.\n\nMark down has a native syntax built in for strikethrough. So, App Bravo can fully reproduce the content from App Alfa in their review reader. That’s an improvement, but it leads back to a new version of the original problem: Instead of limiting content to the least common features of plain text, content is now limited to the least common features of Markdown. Anything beyond basic blog post formatting is out of scope.\n\nFor example, say App Alfa provides a *spoiler* feature that let’s folks hide content behind a spoiler cover with a label on it. There’s no native way to represent that in Markdown. The feature needs a custom content type defined which is not something Markdown can do.\n\n[aside: Embedding HTML in Markdown is possible, but that locks content into the specific tags used for the embed. I consider that a non-starter for portable content.]\n\nApp Bravo can always implement the `text/x-app-alfa-book-review` engine. But, we’re back to the same issue of effort. If the formats get complicated and/or the review reader wants to ingest content from lots of other apps, the workload becomes a limiting factor (and the effort would be better spent building social features rather than ETLs). Dealing with custom formats also add significant complexity to the system since both sides must stay in sync if there are any changes.\n\nWe also haven’t mentioned the increased burden on App Alfa. They must expend effort to generate and maintain the `text/x-app-alfa-book-review` spec and outputs. If apps aren’t in place to use the format, the appeal of doing that work is limited. Which leads to the a chicken/egg/cold-start problem because building an App Bravo reader app based on custom formats which *might* exist someday isn’t super appealing either.\n\nI expect the practical reality of all this is that if the plaintext field is Markdown, then content from any app that does more than what Markdown can represent will effectively be locked into the original app. Trying to use it elsewhere will either be too much work, to broken, or both.\n\nGiven the creativity of the Atmosphere, that’ll happen a lot.\n\nI believe instead of expanding the number of content formats (i.e. each app being responsible for defining their own format/content-type), we should focus down to standardize on a smaller number of formats that are better at what they do. Markdown will certainly play a role. And, it’s fine, as long as all you want to do is basic paragraph content. But, having to truncate all the content we want to be portable down to Markdown’s limited feature set would be a huge miss.\n\nThat leads us to NeoDoc.\n\n### #p-4796-neodoc-4NeoDoc\n\nNeoDoc is a content format born out of frustrations with Markdown’s limitations. (And, full disclosure, it was me. I was the one who got so frustrated with Markdown’s limitations that I designed the format to use [on my various sites](https://links.alanwsmith.com/).)\n\nHere’s a quick example of how to use it to make spoiler content for a book review:\n\n```\n-- title\n\nDungeon Crawler Carl\n\nA bunch of words about the book\ngo here.\n\n-- spoiler/\n-- label: Only read this if\nyou're done with chapter 27.\n\nIf the doomsday device isn't a\nChekhov's Gun, I don't know\nwhat is.\n\n-- /spoiler\n\nAnd back to more writing\nabout the book that's not\nunder the spoiler.\n```\n\nNeoDoc produces a standardized AST designed for use in a templating system (which is also standardized). NeoDoc provides a default set of templates with the expectation that apps will customize them to their liking. App Alfa (where the content originated) would have `title` and `spoiler` templates responsible for rendering the `-- title` and `-- spoiler` sections of the content. The spoiler being set up to cover the text with an opaque box and the label.\n\nApp Bravo can make it’s own versions of those templates. Or, it can use the original ones from App Alfa. (The idea being that App Alfa stores its templates in a lexicon that App Bravo has access to. More details on that to come in future discussions.) Or, it can fall all the way back to the defaults built into NeoDoc.\n\nThis gives each app complete control over how it display content without having to interact with each other through custom formats. Other apps can use the content just as easily and just as independently. All without limiting features beyond basic paragraphs.\n\nThe net result is a portable content format that doesn’t sacrifice creativity to the limitations of Markdown’s format.\n\n### #p-4796-outro-5Outro\n\nThere’s a little more to NeoDoc than you see here, but not much. It’s designed to keep the mental model small so you can focus on making content. You can check out the [NeoDoc site](https://neodoc.style) for more info. Or, [ping me](https://bsky.app/profile/al9000.com) or the [neodoc](https://bsky.app/profile/neodoc.style) accounts on bluesky if you’ve got question or feedback beyond the scope of this thread.\n\n-a\n\n### #p-4796-postscript-6Postscript\n\n- NeoDoc has been around for three years. But, you’ve probably never heard of it given that it’s embedded in my personal static site generator. It puts in a lot of work there powering [roughly three thousand pages of content](https://www.alanwsmith.com/neo-files/report), but hasn’t seen wider distribution yet. I’m extracting it to a library and independent app that can be used in the Atmosphere as we speak.\n- I’d probably stick an WYSIWYG editor in front of NeoDoc most of the time, but it’s entirely human readable/writable plain text without one. It’ll be even more so as syntax highlighters for the format come online.\n- I hadn’t thought about spoiler tags or content warnings until this thread. They’re perfect examples of the types of content I believe we should be working to ensure are portable. My general point being that if content isn’t fully portable, you’re effectively locked in to an app even if you can change the PDS that’s storing the data. For example, if I wrote a bunch of posts with spoilers in them any app that doesn’t support them will appear broken. I wouldn’t move to them.\n- Regarding: omg.jacky.wtf:  how would you implement a spoilers tag in the CLI - for example I don’t think we should use the limitations of our output environments to determine the the fidelity of the content distribution. We should make the raw content is rich as possible. That way, apps that are rending for specific applications (like the CLI) can have as many options as possible to come up with a solution for their environments. (Thinking about the CLI specifically. One option would be to transform the characters of spoiler content to █ blocks, then provide a hot key to toggle the actual content on and off. Of course, for this to happen, the app generating the CLI content would need something like NeoDocs formatting to know what to hide and what to show.)\n- I’m exited NeoDoc handles spoilers out of the box. Of course, it’s not the only solution. While I’d love to see NeoDoc become a part of the Atmosphere, I won’t be too disappointed if it doesn’t, so long as we put other solutions for fully portable content in place.\n- Oh, yeah, there’s an entire bit about how the named NeoDoc sections and their associated attributes act as ad hoc keys for database style querying. This post is already super long and I don’t have the spoons to get into that right now. There’s a overview [on the NeoDoc site](https://neodoc.style) if you want to learn more.\n- I also started [another thread](https://discourse.atmosphere.community/t/neodoc-a-content-format-and-the-atmosphere/1050) talking about NeoDoc specifically if you’re interested in that.","likes":1,"re":null},{"u":"omg.jacky.wtf","at":"2026-08-11T01:24:47Z","text":"I’m going to make a new thread soon for handling reviews in relation to this but I *think* the core idea for a book lexicon as described here seems to be something everyone’s in touch with! What I would like to do next is to start a working group around this (so we can have a dedicated space for review conversations, how to handle contributors to materials and verification thereof and what have you).\n\nUpdate: the thread is here, [Handling Reviews for the Book Lexicon](https://discourse.atmosphere.community/t/handling-reviews-for-books/1085) . I’d like to know if anyone would like to co-chair the WG with me (I am opting myself in unless there’s two other more adamantly charged folks for this work).","likes":3,"re":null},{"u":"jasonbu.online","at":"2026-08-13T13:02:06Z","text":"First off, huge credit to @omg.jacky.wtf for actually getting this moving.\n\nA bunch of us have been talking about books, bibliographic data and shared lexicons for a while, but mostly with our heads down building our own projects. Jacky got people into a room and started turning that into something concrete. That’s important.\n\nI think the next step is getting the builders together and treating this a little like what happened with [Standard.site](https://standard.site/).\n\nWe already have working code and different approaches in the wild. [Bibliograph](https://github.com/olamaelcu/bibliograph) is now doing some really interesting work on the bibliographic side. BookHive, @
