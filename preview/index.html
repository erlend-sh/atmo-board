xardex.dev, has a working book and reader implementation (CAVU is working on a reader - @chris.pardy.family). Byline.pub, me, has been working on author and book records. There are other projects coming at this from reading, publishing, metadata and discovery as well.\n\nNone of that work should be thrown away. Quite the opposite. That’s the material we should be bringing to the table.\n\nI also don’t think we should assume any existing `book.*`, `*.book` or project namespace automatically becomes *the* canonical book lexicon. We aren’t really at that point yet. The useful question is: **what is common between the things we’re already building, and what should apps across the ATmosphere be able to rely on?**\n\nI’d suggest we establish a small Book/Bibliography Lexicon working group.\n\nNot an IETF bureaucracy. Nobody needs another committee eating their evenings. :grinning_face_with_smiling_eyes:\n\nA group of the people actually building this stuff.\n\nMaybe:\n\n- gather the existing schemas and implementations\n- identify the common primitives: works, editions, identifiers, contributors, authorship, reading state, reviews, relationships, etc.\n- run a few workshops across different time zones\n- document the places where our implementations disagree\n- get something resembling a v0 proposal\n- put it out publicly for comment\n- implement it in several real applications\n- learn where it’s wrong\n- then publish the shared lexicon\n\nBasically: rough consensus **and running code**.\n\nI’d also really like to invite some of the folks involved with @standard.site into that discussion — @aka.dad, @brookie.blog, @awarm.space and anyone else I’ve missed. They’ve already gone through the exercise of getting several independent AT Protocol applications to converge on common lexicons, and there are probably lessons there that would save us some bruises.\n\nJacky’s thread is a damn good starting point. Bibliograph gives us something concrete to experiment against. The various book apps give us real-world requirements.\n\nNow we need to get those people around the same virtual table.\n\nDifferent projects. Different time zones. Different needs. But we all have a stake in getting this right.\n\nI’d be very happy to help organise it.","likes":1,"re":null},{"u":"omg.jacky.wtf","at":"2026-08-13T13:59:25Z","text":"I’d love to see some of those folks pop in for pointers/suggestions but I imagine a lot of it would devolve into:\n\n- a committed team of builders\n- durable experience from folks using it\n- an agreement on an eventually consistent lexicon\n\nFWIW Bibliograph, I’m using it as an example; I expect every large enough service to implement their own AppView that’ll have their own bits and quirks of information about a book. For example, Livtet is being set up to accept an AppView as a DID prefix, a bit like how Bluesky and Bluesky-centric/-lexicon consuming apps are set up. So, if you wanted to view book information from Bibliograph using Livtet, the URL would be something like [http://livtet.olamaelcu.net/book/did:web:biblio.livtet.olamaelcu.net/lgwy6mnok6vk7](http://livtet.olamaelcu.net/book/did:web:biblio.livtet.olamaelcu.net/lgwy6mnok6vk7) and it’d resolve accordingly. The client could do some post-fetch cleaning up or only use the AppView for identity discovery (I can see Hardcover doing this and relying on their metadata as collected and described by @adamfortuna already) whereas folks like me would be relying solely on the AppView for information like this.\n\nI’m down for some of the research points you’ve described here, I can get started on that and provide a link to some sort of document back here in a bit. I’m happy to work with you with @jasonbu.online to get this going!","likes":1,"re":17},{"u":"jasonbu.online","at":"2026-08-13T15:35:02Z","text":"Yes, I think we’re very much on the same page.\n\nI’m definitely not imagining a canonical AppView or metadata source. Different apps should absolutely have their own views, enrichment and opinions.\n\nThe shared piece is the contract between them.\n\nI also read Chris Shank’s post, and his distinction between content lexicons and publishing/discovery lexicons helped sharpen this for me. Done a lot of work with BookHive (@xardex.dev) around a shared lexicon.\n\n“Eventually consistent lexicon” feels like the right approach. Enough common vocabulary that Byline, Livtet, Bibliograph, BookHive, Cavu and other ATProto book apps can understand each other without forcing everyone into the same implementation.\n\nFor the group itself, I’d keep the focus on AT Protocol, projects already building on it, consuming it, or seriously exploring support for it. But also include others like @adamfortuna perfect contribution above… (are you guys thinking of AT proto?)\n\nNext step might simply be to identify a small core group of builders and ask who’s interested.\n\nThen we can inventory what already exists, identify the common problems, run a few working sessions across time zones, pull in the Standard.site folks for lessons learned, and work toward a v0 proposal that multiple apps can actually implement.\n\n1. inventory the lexicons and approaches already in use\n2. identify the common problems we actually need to solve\n3. hold a few working sessions across time zones\n4. pull in the Standard.site folks for lessons learned\n5. publish notes and decisions openly\n6. work toward a v0 proposal that multiple apps can actually implement\n\nMaybe we start nominating projects and people here?\n\n- BookHive - @xardex.dev / @nickthesick\n- Cavu Reader - @chris.pardy.family\n- Byline.pub - myself @jasonbu.online\n- Livtet/Bibliograph - @omg.jacky.wtf\n- Hardcover - @adamfortuna\n\nOthers that are interested or that should be recommended?","likes":1,"re":18},{"u":"omg.jacky.wtf","at":"2026-08-13T16:05:22Z","text":"> **jasonbu.online:**\n> Maybe we start nominating projects and people here?\n> - BookHive - @xardex.dev / @nickthesick\n> - Cavu Reader - @chris.pardy.family\n> - Byline.pub - myself @jasonbu.online\n> - Livtet/Bibliograph - @omg.jacky.wtf\n> - Hardcover - @adamfortuna\n> Others that are interested or that should be recommended?\n\nI think you’ve hit the needle on the head with the folks for recommending for this. We can sync back in a few days after folks have seen this and decide to report back. This gives me a chance to refine what I’m doing with Bibliograph, tbh.","likes":0,"re":19},{"u":"xardex.dev","at":"2026-08-13T16:19:15Z","text":"I’m willing to join a WG for this and also like to offer myself as co-chair. The project (and product) I’ve been working on is named **Dracome**. I’ve been actively preparing its GoLive.\n\nWhen I started on the project, I spent quite some time learning about BookHive’s data model and lexicons. I’ll build an adapter for them anyway so Dracome can consume them. I chose an independent set of lexicons for Dracome to retain flexibility, some even differ from bsky’s. That’s why I’ll need to build some adapters anyway.\n\nA major part of Dracome is interoperability, which is why I spent considerable time iterating on the lexicons to find a good balance between flexibility and robust typing. Feedback from @jasonbu.online has been invaluable for some decisions.\n\nThe discussion around the content type of reviews led me to decide to include this before I publish the lexicons. They’ll published under dracome.social. I’ll start with text/plain.\n\nSo whatever common lexicon structure we may end up with, I’d gladly build an adapter for that as well. I’ll probably keep relying Dracome’s own set of lexicons to preserve flexibility, but I’d follow the shared lexicon structure closely.\n\nDracome is a priority project to me and I’ll keep spending a lot of time on in the foreseeable future. So I’m ready to spend some time on a WG. I’m eager expand my knowledge of the technical side of the world of books as much as possible.\n\nWhen I started, I used BookHive’s dump as a starting point, but I’ve since moved on to Open Library and the Deutsche Nationalbibliothek / DNB (German National Library). So a future lexicon structure will need to support a solid edition structure.\n\nDacome is edition-first - including reviews - to enable users to post a German review for a German edition and an English review for an English edition. But the community review section aggregates them by work. That was the general decision I made with Dracome’s lexicons: keeping the data model flexible enough to expand to more use cases, even if the AppView itself doesn’t use it to the full extent.\n\nIf Dracome needs to consume a new catalog entry (work) that isn’t edition-specific, it automatically creates a single edition for it; hence “edition-first”. This is necessary to consume data from apps like BookHive that aren’t edition-scoped. That’s why Dracome’s lexicons declare an edition as optional, even though Dracome internally requires one. A missing edition is considered a data bug.\n\nI think a common set of lexicons would need to handle this similairily. Otherwise it would be too restrictive; not every app wants or can be edition-specific.\n\nI’m generally interested in cooperating with other apps and having them feed catalog data into Dracome. However, this is gated by a human review, which is why I drafted a submission process that I discussed with @jasonbu.online.","likes":2,"re":null},{"u":"byjp.me","at":"2026-08-13T21:02:40Z","text":"Unfortunately I don’t have as much time to commit to this as I’d like, but I’m building [PassingReads.org](http://PassingReads.org) (physical book sharing), and working on a PR for AudioBookShelf to post (audio|e)book progress to the atmosphere. I’d love to get both aligned with where you all decide to head!\n\nI’ll definitely be joining the forum area you folks build and helping out where I can :smiling_face:","likes":0,"re":null},{"u":"nickthesick","at":"2026-08-15T12:38:42Z","text":"Thanks for this write up @adamfortuna!\n\n> **adamfortuna:**\n> To go back to @nickthesick ‘s mention of including all the useful data needed, the Edition has some of the relevant useful data to the user reading that edition. Without edition information you could say “I’m 50% of the way done with the book”. With the edition information you could say “I’m on page 256 out of 512 on the Hardcover edition of Book”, or “I’m 12 hours and 42 seconds out 20 hours and 5 minutes of the audiobook edition”. Also, different editions have different cover images, and we’ve found users **really** want to see the cover of the edition they have.\n\nYep, I agree that editions is very useful to track progress accurately. Though, I will note that reading progress is typically only for the user themselves and not so relevant across readers and for statistics (e.g. reading time of a book). For BookHive, I modeled this as several optional fields, and if the user marked the pagesRead / totalPages, I was able to derive a percentage, or the user could just set the percentage directly. Same for chaptersRead / totalChapters with priority to pages for granularity. For audiobooks it would be easy to model seconds / totalSeconds with UI that makes that easier to manage. But the most important field was percent, so that it was easily understood across clients.\n\n> **adamfortuna:**\n> but I’d like to see a `visibility` field in the record shape from day one even if the only supported value initially is `public`.\n\nAs far as I understand, the difference in private data is between the access control of who owns it, and it’s path, but otherwise should act as the same record type, so I’m not sure that it would be useful to indicate this on the record itself, given that the identifier (at uri vs. ats uri) for the record could already derive this data.\n\nI totally agree on the needs for the separation of a work & an edition, I think it’s going to be some smart modeling to get that to work well together in a way that can be mapped across applications (and potentially datasets). Very happy to have someone on board that has seen the limitations around these models.","likes":0,"re":9},{"u":"nickthesick","at":"2026-08-15T13:33:34Z","text":"> **jasonbu.online:**\n> BookHive, @xardex.dev, has a working book and reader implementation (CAVU is working on a reader - @chris.pardy.family\n\nJust to be clear, I’m the only one running BookHive.\n\n> **jasonbu.online:**\n> ’d also really like to invite some of the folks involved with @standard.site into that discussion — @aka.dad, @brookie.blog, @awarm.space and anyone else I’ve missed. They’ve already gone through the exercise of getting several independent AT Protocol applications to converge on common lexicons, and there are probably lessons there that would save us some bruises.\n\nI’ve heard a lot of talk from people around standard.site being a good model for this, but I think it fundamentally is a differently shaped problem. standard.site is about modeling data that the original publisher wants to broadcast on the network (aka a single canonical, this was published), but the main problem for books is that we cannot have the original publisher manage the record of a book in all cases. Users are broadcasting their reviews/comments & other data *about* a book, and the trouble is knowing which book they precisely meant to broadcast about, especially when different applications are using different datasets which very much do not agree.\n\nThe tension here is to do with centralization vs decentralization of book data. In a centralized system, like Goodreads, there is not contention about user generated data, because you have full access to both the user’s data & the original book record; with the ability to perform migrations of them both in lock-step. So, if you want to merge book editions, split them, normalize them, change covers, you are absolutely free to do so in a centralized system.\n\nWe do not have this luxury in a decentralized system; and, to add insult to injury, there won’t be agreement between systems on what the book records even *mean* because everyone is trying to approximate real-world messy data, not just tidy URLs.\n\nWith books, we have some fundamental problems to overcome:\n\n- Data Source\n- How do we build a system which can bridge *across* multiple datasets?\n- Or, should we be aiming to have a single canonical dataset which we can contribute over time to enrich?\n- Model Shape\n- What is the minimal viable representation of a book, a review, progress, etc?\n- How should books, works, editions be referenced across the system to enable new apps & systems?\n- Evolution\n- How do books get added over time, can authors self-publish, how do we moderate?\n\n> **xardex.dev:**\n> Dacome is edition-first - including reviews - to enable users to post a German review for a German edition and an English review for an English edition. But the community review section aggregates them by work. That was the general decision I made with Dracome’s lexicons: keeping the data model flexible enough to expand to more use cases, even if the AppView itself doesn’t use it to the full extent.\n\nThis is an interesting approach @xardex.dev, though I wonder if this is actually better modeled as a translation of a review & the review is surfaced across the work. You’ll be surprised to how many editions a book may have, so it becomes increasingly unlikely that an edition-specific review would be surfaced, leading to users shouting into the void. Where each review could be marked as being tied to an edition, but then a separate schema joins across the work.","likes":1,"re":null},{"u":"xardex.dev","at":"2026-08-16T10:17:46Z","text":"@nickthesick\n\n> **nickthesick:**\n> We do not have this luxury in a decentralized system; and, to add insult to injury, there won’t be agreement between systems on what the book records even *mean* because everyone is trying to approximate real-world messy data, not just tidy URLs.\n\nThat’s true. However, I do think it’s manageable, though not 100% bulletproof. I chose to build Dracome’s lexicons around a WorkTarget (bag of identifiers) and a CatalogSnapshot. I don’t publish Dracome’s entire catalog, because this would be way too much data. But all logged progress, every state, review, marker is tied to a snapshot that is refreshed on save. The downside of this approach is bigger records.\n\nI don’t think we need to agree on a catalog. I don’t think we even should. So the challenge is to make them connectable. A bag of identifiers is one way to solve this, because in Dracome’s case, it includes ISBNs, Open Library keys, Wikidata keys etc. The snapshot itself is a way to make sense of these keys without having to do lookups, and to ensure a record still makes sense if there aren’t any external keys.\n\nI’ll enrich those datasets with HiveIds as well, so it’s easier to connect them to BookHive. Though, I’ll have to build some matching logic for that.\n\n> **nickthesick:**\n> This is an interesting approach @xardex.dev, though I wonder if this is actually better modeled as a translation of a review & the review is surfaced across the work. You’ll be surprised to how many editions a book may have, so it becomes increasingly unlikely that an edition-specific review would be surfaced, leading to users shouting into the void. Where each review could be marked as being tied to an edition, but then a separate schema joins across the work.\n\nI won’t be surprised because I’ve been testing Dracome with a work that has over 1200 editions (sourced from Open Library). I’ve seen many works with many editions.\n\nI initially thought about solving this as translations, but that’s is too limiting. One may love a book in English but despise its translation. So a simple translation model may be bad UX. If there are multiple translations in the same language, this becomes even worse. Maybe a new translation is great; only the original one is despised.\n\nI hinted at the UX solution in my post. All pages and components are edition-scoped, including search results. If a user hasn’t chosen an edition, Dracome tries to find a good representative one. So users are used to the edition-scoped UX.\n\nI fully agree with you that surfacing them only for editions would be like shouting into the void. That’s why the community review section aggregates them across all editions by work. I haven’t added a visual pointer to the edition the review was posted for yet, though.\n\nI’ve reviewed multiple book apps and websites to see how they handle edge cases and on what UX they landed on.","likes":0,"re":null},{"u":"nickthesick","at":"2026-08-16T15:13:24Z","text":"> **xardex.dev:**\n> I chose to build Dracome’s lexicons around a WorkTarget (bag of identifiers) and a CatalogSnapshot. I don’t publish Dracome’s entire catalog, because this would be way too much data. But all logged progress, every state, review, marker is tied to a snapshot that is refreshed on save.\n\nI can’t really tell what you mean by this exactly from this description alone. Would you mind explaining further?\n\n> **xardex.dev:**\n> A bag of identifiers is one way to solve this, because in Dracome’s case, it includes ISBNs, Open Library keys, Wikidata keys etc. The snapshot itself is a way to make sense of these keys without having to do lookups, and to ensure a record still makes sense if there aren’t any external keys.\n\nSure, but how does BookHive, or another app contribute to this bag of identifiers? Where does the identifiers live?\n\nYou might be able to do this with BookHive given my dataset is public, but another application which is not, will be impossible to do.\n\n> **xardex.dev:**\n> I’ll enrich those datasets with HiveIds as well, so it’s easier to connect them to BookHive. Though, I’ll have to build some matching logic for that.\n\nThis will be *very hard*, I would even say firmly, it should not be done. There will always be mismatches between datasets, and it will be an MxN problem. Exponentially hard when you account for other providers’ datasets.\n\nI think that the local optimum solution here is for the user to have the power to make this mapping on their own case-by-case basis. Like, for example, given a book record in their PDS like:\n\n`title: \"ABC\", authors: [\"XYZ\"], identifiers: [{ type: 'hiveId', src: 'bookhive.buzz', id: 'h_123'}]`\n And an XRPC method, implemented across services, to search for books like:\n `id: 'community.book.search', type: 'query', params: { q: { type: 'string' }, output: { title: string, authors: string[], cover: string, identifiers: [{type: string, id: string}] } } `\n\nthen each application would be able to make a book matching UI for migrating books across services (if multiple services implement the same XRPC method shape). While also giving the user agency in 1) how to map that book (since the record may not be valid in one dataset or inaccurate in another) 2) freedom for independent services for migrating between accounts (similar to those spotify < - > apple music migrators).\n This would move the burden of mapping between datasets on the user & if an application wanted to have a more friction-free experience it is up to them to implement that if they so choose to. Applications can even build up datasets of previously mapped books to offer as suggestions.\n\n> **xardex.dev:**\n> I initially thought about solving this as translations, but that’s is too limiting. One may love a book in English but despise its translation. So a simple translation model may be bad UX. If there are multiple translations in the same language, this becomes even worse. Maybe a new translation is great; only the original one is despised.\n\nI can’t speak to how often such a thing would happen, but given the complexity of this as is, I’d lean towards reducing scope than trying to account for every situation. But, “to each, their own”.","likes":0,"re":25},{"u":"jasonbu.online","at":"2026-08-16T23:38:51Z","text":"> **nickthesick:**\n> Just to be clear, I’m the only one running BookHive.\n\nFirst, apologies for the BookHive mix-up, @nickthesick, all clear now.\n\nAnd yes, I think your point about Standard.site is important.\n\nI’m increasingly thinking of Standard.site as a useful model for *how* we organize the work, not necessarily *what* the resulting model should look like.\n\nYour three buckets feel like a very good way to structure the work:\n\n- Data source / identity\n- Model shape\n- Evolution and moderation\n\nThis is exactly the diversity of implementations I was hoping we’d figure out before trying to converge on anything.\n\nWe now have BookHive, Dracome, Bibliograph/Livtet and Byline using ATProto, PassingReads/AudioBookShelf work underway, and others looking to participate, with deliberately different assumptions around works, editions, progress and data sources.\n\nI also really like Nick’s suggestion of pushing some of the dataset mapping back to the user, with a shared search/XRPC shape across services.\n\nThat feels very AT Protocol to me, don’t assume there is one canonical book database everybody has to agree on. Give applications a common way to discover candidate matches, let the user confirm the mapping, and allow services to build smarter reconciliation on top if they want to.\n\nThat could also make migration between book services much more practical without requiring every AppView to share the same underlying dataset.\n\nAnd I think that raises a bigger question for the group:\n\nAre we standardising book records, or are we standardising the records *and service interfaces* that allow independent book systems to interoperate? Both?\n\nI’m thinking that’s the sort of thing we should start capturing as a design proposal rather than trying to settle it immediately in this thread.\n\nAt this point I think we should put a lightweight process around the work, capture the questions, competing approaches and open decisions somewhere shared, then turn them into a working backlog.\n\nThe first questions almost write themselves:\n\n1. Identity / data sources: how do independent datasets refer to the same real-world work or edition?\n2. Work vs Edition: what needs to be shared, and what can remain AppView-specific?\n3. User records: reviews, status and progress, including what belongs at work vs edition level.\n4. Evolution: additions, corrections, merges, moderation and distributed curation.\n5. Protocol concerns: private records, references, schema evolution and extension.\n6. Service interfaces: which XRPC methods, if any, should be common across book services?\n\nRather than settle those here one by one, I think we should get the initial group established and turn them into the first set of issues and working sessions and a process going.","likes":0,"re":26},{"u":"xardex.dev","at":"2026-08-17T18:58:11Z","text":"> **nickthesick:**\n> I can’t really tell what you mean by this exactly from this description alone. Would you mind explaining further?\n\nAmong other things, Dracome stores a full snapshot along each of these records:\n\n```\n \"catalogSnapshot\": {\n      \"type\": \"object\",\n      \"description\": \"A portable, identity-oriented snapshot of combined work-and-edition catalog metadata, captured at record write time. Alongside the record's target, it lets any AT Protocol consumer independently resolve this work or edition without depending on Dracome as a central catalog authority. Work-scoped fields are always present at the top level; edition-scoped fields are grouped under the optional nested `edition` sub-object, present only when the record targets a specific edition.\",\n      \"required\": [\"workType\", \"title\", \"contributors\"],\n      \"properties\": {\n        \"workType\": {\n          \"type\": \"ref\",\n          \"ref\": \"#workType\",\n          \"description\": \"Structural content form of the referenced work (novel, poetry, comic, manga, audio_drama, or non_fiction).\"\n        },\n        \"title\": {\n          \"type\": \"string\",\n          \"maxLength\": 1024,\n          \"description\": \"Primary title of the work, sourced from the work's own canonical title.\"\n        },\n        \"subtitle\": {\n          \"type\": \"string\",\n          \"maxLength\": 1024,\n          \"description\": \"Secondary title of the work, present only when the work has one, sourced from the work's own canonical subtitle.\"\n        },\n        \"contributors\": {\n          \"type\": \"array\",\n          \"minLength\": 1,\n          \"maxLength\": 16,\n          \"description\": \"Ordered list of contributors (authors, translators, illustrators, etc.) credited on the work or edition.\",\n          \"items\": {\n            \"type\": \"ref\",\n            \"ref\": \"#snapshotContributor\"\n          }\n        },\n```\n\nIt bloats records, but decouples them from Dracome’s catalog or its PDS. So any app can pick them up and do whatever they wish with them. I refer to this as the identity of a book. A federation concept I drafted is similar to your suggested XRPC methods: a re-implementable API surface for enriching such records (with covers, descriptions, etc.). They can go stale by design; I don’t consider this an issue because the identity of a book doesn’t change even if the catalog changes.\n\n> **nickthesick:**\n> Sure, but how does BookHive, or another app contribute to this bag of identifiers? Where does the identifiers live?\n\nI do welcome apps contributing identifiers to Dracome. It’s already part of a submission process I discussed with @jasonbu.online. If an app contributes an edition, I import their identifier with it.\n\nHowever, I don’t think it’s the path we should take. In my federation concept, I try to avoid giving Dracome any catalog authority in the Atmosphere. It should be one source of many. That’s why Dracome is persisting those snapshots with the full identifier bag it knows. However, I am willing to invest in or reuse my matching machinery for it.\n\nMy preferred way to handle this is to rely on independent sources for this mapping, which we can contribute to. Since Dracome’s catalog is heavily based on Open Library, I intend to contact them to ask if they’re interested in a cooperation where I feed catalog data back to them. That would be one way to enrich their catalog. They already have an identifier bag as well (e.g. IDs from Goodreads), so it’s a good starting point. But Wikidata would be another option as well. It’s unlikely that they want to have all the keys of atproto apps, so some decentralized, PDS-based solution might also be an option.\n\nIt’s not a silver bullet, but with ISBNs, OL keys, etc. we might be able to connect datasets safely enough. However, this puts the burden on each app to connect them to these IDs.\n\n> **nickthesick:**\n> This will be *very hard*, I would even say firmly, it should not be done. There will always be mismatches between datasets, and it will be an MxN problem. Exponentially hard when you account for other providers’ datasets.\n\nDracome already has a heavy import and matching tier machinery in place since I took the challenge of merging two independent catalogs (OL and DNB), which was no easy task and is unlikely to be perfect. It has several matching tiers, a review queue and some safety guards. If I want to enable users to import their data from Goodreads, The StoryGraph, BookHive or any other app, I’ll have to implement matching anyway. This is just precomputing this matching. It won’t be perfect, but should be good enough.\n\nTo be clear, this is a different thing from what I said above: matching a user’s own import data into Dracome’s catalog is Dracome acting as a hub for its own imports, not Dracome becoming the ecosystem’s universal cross-app registry. It stays O(N) against the sources Dracome imports from, not O(N²) across every provider pair.\n\n> **nickthesick:**\n> While also giving the user agency in 1) how to map that book (since the record may not be valid in one dataset or inaccurate in another) 2) freedom for independent services for migrating between accounts (similar to those spotify < - > apple music migrators).\n\nI do already plan to help users review the import result. However, you made a good point. Maybe I should think about it more in a staging-way where they can confirm whether Dracome did the matching right, and revisit/correct it later if something slips through. I don’t think it’s an acceptable UX to make the user do all the work themselves. Some matching is obvious (if the ISBN turns out to be unique), some other is more fuzzy.\n\n> **jasonbu.online:**\n> Are we standardising book records, or are we standardising the records *and service interfaces* that allow independent book systems to interoperate? Both?\n\nMaybe I made the wrong impression, but I don’t think we should align the catalog records at all. We should focus on aligning user records and find a way to help each app make sense of them. My take has been the snapshots. There are possibly other, better ways.\n\nI do like Nick’s suggestion of an XRPC method.\n\nThat’s how I’ve been thinking about enrichment so far:\n\n```\n# Enrichment service\n\nThe enrichment service provides display data for books: covers, descriptions, and other metadata not carried in user record snapshots. It is an XRPC service implemented by Dracome and potentially by other providers.\n\nThe service is intentionally narrow: it is additive display data only, not a catalog authority. Dracome's enrichment data includes aggregated content from OpenLibrary and the German National Library (DNB), plus Dracome's own curated additions and corrections.\n\n## Identifier bag\n\nNo single universal book identifier is reliable across all sources. OL keys do not cover all datasets. ISBNs are absent, corrupted, or duplicated for a significant portion of the catalog. The enrichment query therefore accepts a bag of identifiers:\n\nidentifiers: {\n  dracomeKey?: string      // Dracome's own internal catalog key\n  olWorkKey?: string       // Open Library work key\n  olEditionKey?: string    // Open Library edition key\n  dnbKey?: string          // German National Library identifier\n  bylinePubKey?: string    // Byline-sourced proprietary identifier (scheme: bylinePub)\n  bookhiveKey?: string     // BookHive-sourced proprietary identifier (scheme: bookhive)\n  isbn?: string[]          // one or more ISBNs\n  // extensible; other providers may add their own types\n}\n\nEvery enrichment response includes:\n\n| Field | Description |\n| --- | --- |\n| `isCanonical` | Whether this entry is the current record for this provider. `false` means a redirect applies. |\n| `redirectTo` | Populated when `isCanonical` is `false`. Contains the full XRPC endpoint URL and the provider's preferred stable identifier for the replacement entry. Immediately callable; bypasses resolution entirely. |\n| `lastUpdatedAt` | ISO timestamp; for consumer cache decisions. |\n| `matchType` | `exact`, `fuzzy`, or `none`. Consumers should suppress display on `none` and warn on `fuzzy` for high-stakes UI. |\n| `sourceIdentifiers` | The original source identifiers (OL key, DNB ID, etc.) from which this entry was derived. Provenance only; not a sync signal. |\n```\n\nOn the working group: I’m still up for it, co-chairing or otherwise — happy to move the open questions there instead of hashing them out further in this thread.","likes":0,"re":26},{"u":"manton","at":"2026-08-19T14:36:10Z","text":"Hi y’all! :waving_hand: Just wanted to introduce myself. I’m Manton, founder of Micro.blog. We support Standard.site and want to keep doing more with AT Proto. The discussion here is fantastic.\n\nMicro.blog has its own “what are you reading” interface to help people blog about books. We also have a companion mobile app just for books called Epilogue. We pull data from Open Library, Google Books, and ISBNdb.\n\nTo the *works vs. editions* discussion, unfortunately I made a decision early on to make our database pretty flat, with ISBN13 as the identifier. So we think in editions instead of works. (To make it worse, individual users can edit the metadata and book cover just for their own copy of the book. It’s a bit of a mess, and I hope to eventually normalize the data.)\n\nFor the lexicon, ideally a platform could participate even if they have only the bare minimum of data like book title, author, and identifier. Everything else could be layered on top of that.","likes":7,"re":null},{"u":"omg.jacky.wtf","at":"2026-08-19T14:59:14Z","text":"> **xardex.dev:**\n> Maybe I made the wrong impression, but I don’t think we should align the catalog records at all. We should focus on aligning user records and find a way to help each app make sense of them. My take has been the snapshots. There are possibly other, better ways.\n> I do like Nick’s suggestion of an XRPC method.\n> That’s how I’ve been thinking about enrichment so far:\n\nI agree on this; aligning on what’s stored for a user’s repo such that we can do our own disambiguation from there. I think a point was made about leaning into a uniform representation of identifiers so folks can move from there (looking for the post that showed an example but the following is one:\n\n```\n{\n  // ... rest of record\n  \"title\": \"A Brief Book Title\",\n  \"author\": [\n\n    // .. to permit multiple authors safely.\n    \"Becky Chambers\" // for just the plain text form.\n\n    {\n      \"name\": \"Becky Chambers\",\n      \"identifiers\": [\n\n         { \"uri\": \"https://beckychambers.info\", \"resource\": \"web\" },\n         { \"uri\": \"https://openlibrary.org/XXXX\", \"resource\": \"openlibrary\" },\n\n         // ... other combos here\n      ]\n    }\n  ],\n  \"identifiers\": [\n     { \"uri\": \"https://beckychambers.info\", \"resource\": \"web\" },\n     { \"uri\": \"https://openlibrary.org/works/XXX\", \"resource\": \"openlibrary\" },\n     { \"uri\": \"https://barnesandnobles.com/XXX\", \"resource\": \"barnes\" },\n     { \"uri\": \"https://hardcover.app/XXX\", \"resource\": \"hardcover\" },\n     { \"uri\": \"https://bookhive.buzz/XXX\", \"resource\": \"bookhive\" },\n  ]\n  // ... rest of record\n}\n```","likes":1,"re":28},{"u":"omg.jacky.wtf","at":"2026-08-19T15:01:32Z","text":"> **manton:**\n> For the lexicon, ideally a platform could participate even if they have only the bare minimum of data like book title, author, and identifier. Everything else could be layered on top of that.\n\nThis is the goal! I think we’re converging on this.\n\n> **xardex.dev:**\n> I do welcome apps contributing identifiers to Dracome. It’s already part of a submission process I discussed with @jasonbu.online. If an app contributes an edition, I import their identifier with it.\n\nI think it’ll be part of the enrichment process you’ve mentioned; as you come across records in the wild, it can add them as new identifiers (like if someone signed in Dracome with their info from Hardcover or Bookhive).\n\n> **nickthesick:**\n> Sure, but how does BookHive, or another app contribute to this bag of identifiers? Where does the identifiers live?\n\nI think the example I showed allows for Bookhive to contribute in an agnostic way (with the `identifiers` key while still adding their own metadata. We can listen to each of our respective lexicon records while looking for specific tells to say “hey! this is about this book!”","likes":2,"re":29},{"u":"omg.jacky.wtf","at":"2026-08-21T18:53:33Z","text":"> **lkanies:**\n> The data you need to store about a book is quite different from the data you need to store about wine. But both need a method for building a publicly maintained list that will increase in depth and quality over time and provides objective reference capabilities.\n\nI think the point that [In Which A Book Lexicon is Born - #12 by tynanpurdy.com](https://discourse.atmosphere.community/t/in-which-a-book-lexicon-is-born/1042/12) made here can be used to handle this (by pointing to not only progress but to the ref of what’s being reviewed, it - the referenced item - can have all of the identifiers needed to identify it across things - Yelp, etc) to make it more rich.\n\nI also want to suggest folks to move conversation about *book reviews* to this thread: [Handling Reviews for the Book Lexicon](https://discourse.atmosphere.community/t/handling-reviews-for-the-book-lexicon/1085) and keep this thread about how we’ll define either the generic form/interface of a book lexicon (something each app extends in some faithful way or uses under the `community.lexicon.book` umbrella).","likes":1,"re":14},{"u":"omg.jacky.wtf","at":"2026-08-22T11:09:31Z","text":"I ended up writing [On getting consensus on the lexicon for books](https://www.olamaelcu.net/blog/2026/book-lexicon) last night and think we can vote/discuss the schemas mentioned within. I’ll be updating Bibliograph to support it but if appviews have a minimal compatibility surface area then we can safely run our own catalogs, have our specialized lexicons but also support some compatibility.\n\nI would love everyone’s thoughts on this.","likes":2,"re":null},{"u":"xardex.dev","at":"2026-08-22T16:31:48Z","text":"I’ll need to finish up some work on Dracome first, and then I’ll have a look at them.","likes":1,"re":33},{"u":"nickthesick","at":"2026-08-24T05:03:13Z","text":"> **omg.jacky.wtf:**\n> I ended up writing [On getting consensus on the lexicon for books](https://www.olamaelcu.net/blog/2026/book-lexicon) last night\n\nVery nice @omg.jacky.wtf! I have some opinions that [I wanted to write up in a longer form too](https://nick-the-sick.pckt.blog/road-to-a-book-lexicon-part-1-t2eyqge). But, when I started writing them out, I needed to go deep on the base layer, so I guess I’ll leave you on a cliff-hanger of my specific feedback to your proposal for now (it took me entirely too long to write this up as-is).\n\nI don’t think my article introduced anything all too new to this thread, but hopefully clarifies the direction we are heading here. Since it ends up being interoperability at a different level than most lexicons, due to constraints I discuss in the article and the ones that we already know from this thread.","likes":1,"re":33},{"u":"gui.do","at":"2026-08-24T07:57:32Z","text":"great thread, lot’s of people are clearly into books :smiley:\n\nOn the ORCID angle @omg.jacky.wtf raised: that already runs in Sifa ID today (example: [Juan A. Esteban (@juanesteban.art) | Sifa](https://sifa.id/p/juanesteban.art#publications) ). Sifa pulls someone’s ORCID publications (once connected) and their standard.site ones and surfaces them on their professional profile, no manual entry. Also works with non-atrproto things like your Github activity and/or RSS items if you add and verify them.\n\nThe link from a record to a person doesn’t run through a DID though. Of course a Sifa user has one by definition (that’s the account itself), but the match rides on a shared external identifier: the source record carries something structured and stable like ORCID, the same ORCID sits on the profile, and Sifa just joins based on that. The record itself doesn’t have to carry a DID.\n\nSame trick would work for books, AFAIK: if contributor records carry a structured author identifier (ORCID, ISNI, VIAF, an OpenLibrary author key, Wikidata), a profile app like Sifa could already surface someone’s books on their profile by identifier match (assuming the user adds/links the ID to their atproto account of course, no magic here :sweat_smile:). But yeah: no DID needed, works perfectly.\n\nThe above mentioned claims-vs-edit-rights split: an author claim record keyed to a DID (or ORCID) is pretty much what lets a profile app auto-pull and pre-fill an author’s own books once they join atproto? Direct backlink discovery via Constellation.\n\nOn the claiming itself: the [calendar/speaker thread](https://discourse.atmosphere.community/t/declaring-speakers-and-linking-sessions-on-calendar-events/1121/) is going towards the same idea where a self-written claim record is pointing at the subject, the counterparty writes their own half, the appview derives the confirmed state. [Cartridge](https://cartridge.dev/) already does the claim/verify side today as well (but manually verifying the game companies claiming the games and then pulling it into the claimers PDS). “Author claims their book” looks like the same shape as “speaker claims their talk” or “game company/artist claims their game” to me.\n\nFor Sifa nothing new needed to make the books work, just happy to start (automagically) adding authors books to their Sifa profiles once this has been setup","likes":0,"re":null},{"u":"manton","at":"2026-08-24T16:04:14Z","text":"Excellent, thanks for writing that up @omg.jacky.wtf! It helps to have something concrete to look at.","likes":0,"re":33},{"u":"nickthesick","at":"2026-08-28T21:30:16Z","text":"There is now [a Part 2 to my blog post](https://nick-the-sick.pckt.blog/road-to-a-book-lexicon-part-2-qba59a9) which proposes a book lexicon and justifies how to make it interoperable. I separated the review lexicon from the edition lexicon because the edition lexicon is meant to be “this is a book” and the review lexicon is “this my rating & review of this book”.\n In Part 3, I’m going to go into the XRPC system that I had proposed, which will super-charge the portability of books across systems.","likes":0,"re":null},{"u":"al9000.com","at":"2026-09-09T00:35:43Z","text":"This literally came to me in a dream: Does it make sense to think of book lexicons like video file formats?\n\nFor example, the .mkv format is “a container format that can hold an unlimited number of video, audio, picture, or subtitle tracks in one file.” The stuff can be of different types (e.g. encoded with different video and audio codecs).\n\nIn a similar manner, would it make sense to have a top level lexicon that functions as a container that you put other stuff in? Like a minimal root level lexicon with other lexicons defined that go into it. The idea being that instead of trying to accommodate everything from the start it would provide a way to make ongoing adjustments and expansions.\n\n(I know one of the guidelines with lexicons is to not change them once they are published, and the idea of adding child lexicons runs foul of that. But, it feels like having a type of expansion built in would be a proper indicator that downstream consumers have to know how to handle things and that they need to eject if they see something they don’t know how to deal with. I expect there’s already presidents for this if someone’s got examples.)\n\nI’m also thinking of this like an approach in the Rust programming language where you can have `structs` (“structured” collections of data where every instance/copy always has the same things in it) and `enums` (collections of items that are all of the same type/category but have different attributes).\n\nFor example, a basic `Book` struct would have a title (that’s a “string” of text), an ID (that’s another “string” of text) and an `Author` that’s one of a set of possible options provided by an `Author` `enum`. The `Book` struct would look like this:\n\n```\nstruct Book {\n  title: String,\n  id: String,\n  author: Author,\n}\n```\n\nThe stub for the `Author` emum begins with this:\n\n```\nenum Author {\n}\n```\n\nThe first category of Author would be a `SingleAuthor` that has a `name` that’s a string of text:\n\n```\nenum Author {\n  SingleAuthor { name: String }\n}\n```\n\nIt would also have a `MultipleAuthors` option that is a group of one or more SingleAuthors (aka an array which is called a `Vec` in Rust):\n\n```\nenum Author {\n  SingleAuthor { name: String }\n\n  MultipleAuthors: Vec<Author::SingleAuthor>\n}\n```\n\nand, finally, an Unknown option that doesn’t have any other values associated with it.\n\n```\nenum Author {\n  SingleAuthor { name: String }\n\n  MultipleAuthors: Vec<Author::SingleAuthor>\n\n  Unknown\n}\n```\n\nEach `Book` is required to have an `author`, but there’s no restriction on which one of the options from the `Author` enum can be used. So, these are all valid:\n\n```\nBook {\n  title: \"Dune\",\n  id: \"abc1\",\n  author: Author::SingleAuthor {\n    name: \"Frank Herbert\"\n  }\n}\n```\n\n```\nBook {\n  title: \"The Difference Engine\",\n  id: \"abc2\",\n  author: Author::MultipleAuthors(\n    [\n      Author::SingleAuthor { name: \"William Gibson\"},\n      Author::SingleAuthor { name: \"Bruce Sterling\"},\n    ]\n  )\n}\n```\n\n```\nBook {\n  title: \"Beowulf\",\n  id: \"abc3\",\n  author: Author::Unknown\n}\n```\n\nI don’t have the spoons to flesh out this idea, but I wanted to jot something down before lost it.\n\nP.S.\n\n- This would be better demonstrated using actual lexicons. I don’t know enough about how child/secondary/remote/or-whatever-they-are-called lexicons to do that yet.\n- I’d imagine the same thing would apply to editions, idendifiers, etc.\n\n```\nstruct Book {\n  title: String,\n  id: String,\n  author: Author,\n  identifiers: Vec<Identifer>,\n}\n\nenum Identifier {\n  UUID: {\n    id: String\n    // other data, links, etc...\n  },\n  ISBN {\n    id: String\n    // other data, links, etc...\n  }\n  GoogleBooksID {\n    id: String\n    // other data, links, etc...\n  }\n}\n```\n\n- I found [this page that lists a bunch of identifiers](https://www.shelvd.org/wiki/identifiers). Something to look into.\n- It feels like there should be a “Defult” edition if no other edition info is known and that the Identifiers should go under that, but that’s something to play with in the structure.","likes":0,"re":null},{"u":"nickthesick","at":"2026-09-18T18:05:39Z","text":"[I’ve opened up a PR](https://github.com/nperez0111/bookhive/pull/229) which includes the specific lexicon implementations that I am proposing. Feel free to comment on it if you want to talk specifics!","likes":0,"re":38},{"u":"ngerakines.me","at":"2026-09-18T20:39:46Z","text":"@nickthesick when you’re ready to move this forward, do please create a pull request against the [https://tangled.org/lexicon.community/lexicons](https://tangled.org/lexicon.community/lexicons) repository so they can be merged in, DNS records created, etc.","likes":0,"re":null}],"full":true},{"id":656,"ch":"Lexicon Community","title":"A community app lexicon","tags":["app-lexicon"],"total":67,"last":"2026-04-13T09:51:34Z","posts":[{"u":"bmann.ca","at":"2026-03-09T22:23:57Z","text":"This has come up again, and needs to be worked on by people who are intending to actively curate listings of apps.\n\nFor the atproto community, we can see more apps and services and SDKs launch all the time.\n\nThere were, at one point, 21 excel spreadsheets and awesome lists and more things that listed things (Nov 2024 so a bit stale [Discord thread](https://discord.com/channels/1097580399187738645/1309771066763378789))\n\nWhat would be useful to us, in the atproto community, to make lists of? Apps, SDKs, infra code, etc\n\n- BlueskyDirectory.com is the largest meta listing. It would be great if they participated in adopting and/or cross posting their listsings, and participated in the lexicon design process\n- atproto.com is slowly hand adding various SDKs and apps\n- Kuba’s https://sdk.blue\n\nSo, if there are people who want to do this work, organize yourselves, find a repo to do the work in, and go.\n\nI will say, part of this is commiting to build at least one app that does the listing! There’s a meta service of such a feature, like allowing people to make a “curated list” of such things.\n\nIf someone would like to take this on as a Lexicon Community Working Group, here’s what needs to be filled out:\n\n> **:**\n> Name\n> [Proposed name of the working group]\n> Representatives\n> Lexicon Community TSC: [point of contact]\n> The Lexicon Community TSC representative is not required to attend WG meetings, but acts as a point of contact between the two. The TSC representative is expected to:\n> Keep an eye on progress by keeping in touch with the WG lead\n> Provide updates to the TSC on the WG status\n> Recognize if the WG has stopped making progress, and either help it select a new lead or disband it\n> WG Lead: [poi…","likes":8,"re":null},{"u":"nikolas.ws","at":"2026-03-09T22:29:32Z","text":"[https://store.stucco.software/](https://store.stucco.software/) is a start – right now its not *using* AT protocol at all, just resolving http urls and looking for json blobs.\n\nIt would be pretty straightforward to grab records out and harmonize their data. I’ll start by checking out how those three directories do it, and see if I can resolve some DID’s for apps out of The Graph™.","likes":1,"re":null},{"u":"bmann.ca","at":"2026-03-09T22:34:57Z","text":"This is effectively a dupe of me posting in this other thread:\n\n> **:**\n> There’s a lot here but I would start much more simply.\n> There are various discussions around app lexicons for making an app directory.\n> So my suggestion would be to follow the\n> Lexicon Community\n> process, see who is interested in making a working group, and work towards an app lexicon first release.\n> The key would ideally be at least one project using this live, and include those builders in defining the lexicon.\n> The Bluesky Directory folks\n> https://blueskydirectory.com\n> are one set of people who h…\n\nWhere I am advocating for a *very simple* app lexicon that can get used, not a lexicon lexicon.","likes":0,"re":null},{"u":"yamarten.bsky.social","at":"2026-03-10T12:21:48Z","text":"[aproto.garden](https://atproto.garden/) seems to be a good starting point for the discussion. Although Lexicon and the source code are not publicly available, you can preview the schema from [the sample data](https://ufos.microcosm.blue/collection/?nsid=garden.atproto.directory.submission).\n\nThis is intended to build a global directory, but I think it can also be used as an entry for a personal curated list.","likes":3,"re":null},{"u":"bmann.ca","at":"2026-03-10T13:52:08Z","text":"Oh interesting, nice find. Some good basic fields to start with.","likes":1,"re":4},{"u":"jluther.net","at":"2026-03-10T14:38:41Z","text":"We (Bluesky Directory) would participate in this.","likes":1,"re":null},{"u":"zicklag.dev","at":"2026-03-10T14:40:12Z","text":"I’ll go ahead and ping @atpota.to and @dame.is and see if they’re interested in sharing their lexicon or taking part in this at all.","likes":2,"re":null},{"u":"dame.is","at":"2026-03-10T14:50:42Z","text":"hey all! yes, i started work on atproto.garden last year and it stalled out a bit due to priorities with anisota — would love to see it get taken up and transformed into a community run project if there was momentum and interest in that\n\nit was intended to be a community project from the start but i never got around to announcing it\n\nit’s pretty far along but still needs testing and polish and refinements to the lexicons and structure","likes":4,"re":null},{"u":"dame.is","at":"2026-03-10T14:52:31Z","text":"it has some test listings already, a review and upvoting system, constellation integration, and much more!\n\n[https://atproto.garden/listing/did:plc:gq4fo3u6tqzzdkjlwzpb23tj/3m63iqyp5gs2d](https://atproto.garden/listing/did:plc:gq4fo3u6tqzzdkjlwzpb23tj/3m63iqyp5gs2d)","likes":0,"re":null},{"u":"dame.is","at":"2026-03-10T14:54:54Z","text":"oh it is open source btw, just not easy findable atm\n\n[https://github.com/dame-is/atproto-garden](https://github.com/dame-is/atproto-garden)","likes":2,"re":null},{"u":"zicklag.dev","at":"2026-03-10T14:55:27Z","text":"> **dame.is:**\n> [GitHub - dame-is/atproto-garden · GitHub](https://github.com/dame-is/atproto-garden)\n\nLooks like it’s private. I’m getting a 404.","likes":0,"re":null},{"u":"dame.is","at":"2026-03-10T14:55:43Z","text":"oops 1 sec, lemme make it public\n\nedit: okay should be public now! not sure why it was private, thought i created it public","likes":1,"re":11},{"u":"dame.is","at":"2026-03-10T14:59:16Z","text":"the intention with atproto garden was to create an initial front end to let people easily interact with the lexicon and begin seeding content, but the hope was that eventually anyone could fork it or make their own UI, curate collections, etc etc","likes":4,"re":null},{"u":"dame.is","at":"2026-03-10T15:09:05Z","text":"later today i’m gonna move the repo under the atpotato account and push it to tangled as well, i’d definitely like to contribute and help guide the project to a degree if there’s enough interest… i mainly stalled out last year cause it was too much for me to do alone and i didn’t have enough time back then to really organize any of the community","likes":3,"re":null},{"u":"zicklag.dev","at":"2026-03-10T15:10:45Z","text":"I like the overall shape of the lexicon, but I’m not 100% sure what the best options for official validation are yet.\n\nOne thing I wanted was a way to have it so that if the official account for an app creates the entry then the registry can recognize it as official.\n\nBut then I wasn’t totally sure what the best verifications methods were. Some thoughts I was working through:\n\n- With Roomy we have an official account with the @roomy.space handle, and the app is accessible at https://roomy.space, but the main landing page is https://a.roomy.space right now.\n- It might be good to let the apps have one primary website, https://a.roomy.space in Roomy’s case, but also have maybe labeled other links, such as App, Docs, etc.\n- For an app to be official it should have all of it’s listed URLs verified maybe. I’m thinking we could use rel=me links on the pages, similar to Mastodon’s verified profile links.\n- The app submission record has one or more URLs, and then the response for each URL needs to include a `rel=me` link containing the DID of the account with the submission.\n- In addition, an official entry should be marked as such by putting it in the repo at garden.atproto.directory.submission/self\n- So the `self` rkey represents the profile saying, “this is the official account for this app”, and then the link verifications prove to users that the linked website attests to the fact that the DID of the account with the `self` record is the official account for the app.","likes":4,"re":null},{"u":"dame.is","at":"2026-03-10T15:17:43Z","text":"Yes, the validation/verification side of things was one of the areas that I hadn’t gotten around to cause it felt like the one that needed to be carefully thought out — love your line of thinking here, and I also was thinking there could be a way for a verification and trusted verifiers like system to be put in place via a lexicon as well. So “atproto garden” as a “brand” could be a verifier and so could other community members that are trusted.","likes":3,"re":15},{"u":"zicklag.dev","at":"2026-03-10T15:25:45Z","text":"Yeah, the “official” / “verified” nature of a record doesn’t imply it’s not spam, which is interesting.\n\nAnd that’s where things like curating / moderating as well as representing trust signals come into play, which you already started on with upvoting and reviews!\n\nI think the directory itself can, for example, afford to have it’s own criteria for a record getting approved for the site.\n\nIt seems like it’d be good to have a record created by different directory listings or even jsut normal users with personal lists, that says, “I’m including this app in my list”.\n\nThat would provide a trust signal if you trusted the moderation decisions of that directory list site, but obviously nobody else has to respect that listing.\n\nBut anway, if someone creates a new submitssion with a `self` key, anybody can independently verify whether or not it’s “official”. Whether or not different directories want to show it, can be based on manual review, or an AI scan, or user upvotes or whatever.\n\nI think that’s something that can probably be iterated on fairly independently from the lexicon, though we want to think through some scenarios so that we don’t miss anything that we’ll want in the lexicon.","likes":0,"re":16},{"u":"byarielm.fyi","at":"2026-03-10T16:46:12Z","text":"Whether this should be just internal or in the lexicon, one thing to consider for verification (for non-SDKs): whether things like a TOS, privacy policy, and uh the data-statement-thing exist. Those are important for anything with the potential for wide adoption / attention.","likes":2,"re":null},{"u":"zicklag.dev","at":"2026-03-10T16:47:21Z","text":"Those seem like good things to put in the lexicon.","likes":0,"re":18},{"u":"bmann.ca","at":"2026-03-10T16:57:24Z","text":"I really really really recommend that we start with a super minimal set that is as core as possible – and others can extend it with extra fields.\n\nI’d also ask people to list their goals and if they intend to build something.\n\ne.g. make a list of apps being built in the atmosphere so that people can visit them and try them out - this might be my personal example.","likes":3,"re":19},{"u":"byarielm.fyi","at":"2026-03-10T17:15:10Z","text":"To Boris’s point: perhaps the verification part of the lexicon should be handled with a separate lexicon via strongRef or something? I’m not familiar enough with lexicons atm to suggest more specifically. But interested because I plan to list apps on AtLast. My goal would be introducing folks to the Atmosphere options and directing them to the apps aligned with the way they like to consume content. And for the apps purposes, I also need to know if they have a separate follow lexicon or default to an existing one.\n\nFrom dame’s starting lexicon, my notes:\n\n- handles should be removed, those should just be resolved from DID\n- think category may need fleshing out a tiny bit from the options originally presented\n- how are project status changes handled?\n- profile uri….is a whole thing, removing that seems like the best approach rn","likes":1,"re":null},{"u":"zicklag.dev","at":"2026-03-10T17:23:30Z","text":"> **byarielm.fyi:**\n> To Boris’s point: perhaps the verification part of the lexicon should be handled with a separate lexicon via strongRef or something?\n\nVerification, since it’s two-way, similar to ATProto handles, needs to be done out-of-band anyway, so I think it shouldn’t affect the lexicon too much.\n\ni.e. all we need to do for verification is document the standard of using `self` as the rkey if the record is considered the official app record by the hosting account.\n\nThe actual verification needs to be done by the directory / clients so it shouldn’t need to change the lexicon.\n\n> **byarielm.fyi:**\n> handles should be removed, those should just be resolved from DID\n\nAgree with that. :+1:\n\nI’m mostly interested in using this as a developer making an app and wanting to be able to create verified app entries that can be loaded across different directories.\n\nWhile most people’s interests are in listing ATProto apps, I think it’s worth noting that not all apps are ATProto apps, so there should be a tag or something that we can use to filter by ATProto apps, but we shouldn’t require that an app be an ATProto app to end up on the registry.\n\nI’d use this for listing any kind of app if there were a directory for that.","likes":1,"re":21},{"u":"byarielm.fyi","at":"2026-03-10T17:41:38Z","text":"Just another thought: several of us have Semble collections and bsky lists of apps / tools / orgs / etc. in the Atmosphere. May be useful to think about whether the categories we go with can cover these with sufficient but non-detailed nuance:\n\n[Ariel M. (she/her)'s collections — Semble](https://semble.so/profile/byarielm.fyi/collections)\n\nReason I think of this is because I know blueskydirectory and others include tools that are just for analytics. I don’t (partly because there’s a lot and I don’t feel like vetting them). Those are something the feel like they should be a separate category.\n\nAnd what’s App vs Client? That feels very ambiguous and nuanced just for atproto and worse if this lexicon is open to non-Atproto apps/tools/etc. I think “App vs client” can be handled sufficiently with the hasCustomLexicon field for the atproto-sphere (this is also roughly how I handle bsky client vs atproto app in my collections).","likes":1,"re":null},{"u":"byarielm.fyi","at":"2026-03-10T17:43:13Z","text":"> **zicklag.dev:**\n> While most people’s interests are in listing ATProto apps, I think it’s worth noting that not all apps are ATProto apps, so there should be a tag or something that we can use to filter by ATProto apps\n\nIf we want this , I’d add a “authentication with Atproto” option to pair with the **hasCustomLexicons** option in the lexicon","likes":1,"re":22},{"u":"zicklag.dev","at":"2026-03-10T18:25:43Z","text":"> **byarielm.fyi:**\n> If we want this , I’d add a “authentication with Atproto” option to pair with the **hasCustomLexicons** option in the lexicon\n\nHmm, yeah. I wonder if both of those should be left out for now, just so we can put something minimal quickly into use and then think more carefully about the extra fields we need.\n\nLike I can imagine a lot of flags like this that could be either boolean flags or almost like tags.\n\nBut then we still want to standardize on some of those “tags”.\n\nThis reminds me of some things in Roomy where we wanted to use lexicon NSIDs as “extensions”. This can be done implicitly in lexicons already, but there it’s a questionable practice to use NSIDs as field keys, since it’s rather verbose when it comes to code generation.","likes":0,"re":24},{"u":"bmann.ca","at":"2026-03-10T18:39:18Z","text":"I don’t know how else to say this…\n\n…SCOPE CREEP!!!\n\nYes, people will want to build app lexicons for all apps (or iPhone apps or whatever)\n\nWhat is the minimal set of fields that can represent an atproto app or SDK/dev resource?\n\nI would even be willing to drop the SDKs because maybe that’s just a Semble collection called SDKs :stuck_out_tongue:","likes":2,"re":24},{"u":"zicklag.dev","at":"2026-03-10T18:41:17Z","text":"> **bmann.ca:**\n> I would even be willing to drop the SDKs because maybe that’s just a Semble collection called SDKs :stuck_out_tongue:\n\nYeah, I think it’d be good to leave SDKs out for now. That seems different enough in purpose to leave out for simplicity.","likes":1,"re":26},{"u":"nikolas.ws","at":"2026-03-10T21:33:47Z","text":"I’ll be building:\n\n1. An AppView that listens to the firehose for records of this lexicon type and perssits in a store\n2. A client app that allows one to create this record easily. 2a. The client app will persist the record in the store at 1. on creation time.\n\nThis will give an open source way for anyone to make their directory powered by these lexicons as well as a simple tool for adding listings via custom lexicon record.\n\nOnce that’s real, both pieces will be open source and let the scope creep go wild via PR!","likes":1,"re":null},{"u":"ngerakines.me","at":"2026-03-10T21:56:08Z","text":"That looks not too far off from a MASL manifest structure.","likes":2,"re":4},{"u":"bmann.ca","at":"2026-03-11T15:56:10Z","text":"Yep!\n\nMASL inherits from Web Manifests IIRC [Web Application Manifest](https://w3c.github.io/manifest/)","likes":0,"re":29},{"u":"flo-bit.dev","at":"2026-03-11T23:25:53Z","text":"I have a prototyp of a website showing different atproto apps laying around somewhere too, some notes:\n\n- agreed on keeping the scope as small as possible, but also like defining some clear optional fields, otherwise everyone just tends to use different ways of adding their own stuff\n- i like `self` for “official” app records, for verification i’m a fan of what standard.site is doing instead of the rel=me having a `.well-known/{collection}` endpoint, makes thing easier regarding CORS issues when verifying on the client (and yeah that’d be out of band anyway, so would be an optional thing, the handle of the publishing account like @roomy.space could also be used as a simple verification)\n- logo should be standardized to a specific aspect ratio (imo square), really annoying to display in clients otherwise\n- different lexicons for different things (apps, sdks, etc), keeps it smaller and can start with just one\n\nthinking about how i’d change that `garden.atproto.directory.submission` collection for apps:\n\nrequired:\n\n- url\n- name\n\noptional:\n\n- logo (image, square)\n- brandAccount (did, if not given and rkey == “self” defaults to publishing account)\n- tagline (string short, fallback to bsky description of brandAccount?)\n- customLexicons (array of collection names, should probably allow wildcards? already feel people wont update their app record , no need for hasCustomLexicons just check if this field exists and array not empty)\n- screenshots (array of images)\n- description (string longer)\n- landingPage (e.g. for roomy’s use case where landing page != project page)\n- platforms (array, web | ios | android | mac | windows | linux)\n- creators (array of dids)\n- source (link to source code)\n- createdAt/updatedAt (string, date)\n- storeUrls ({ios: “…”, android: “…”, mac: “…”, …})\n\nthat’s already too many optional fields probably…\n\nwe could also throw something really quick together for the atmosphereconf profile pages ([add more icons in \"active on\" · Issue #39 · ATProtocol-Community/atmosphereconf · GitHub](https://github.com/ATProtocol-Community/atmosphereconf/issues/39)) and then see if that works","likes":5,"re":30},{"u":"nikolas.ws","at":"2026-03-12T21:42:06Z","text":"My initial implementation [https://store.stucco.software/](https://store.stucco.software/) now logs in via your ATProto, creates a record to your PDS, and checks for `rel=me` tags on your apps site before rendering your listing to the directory.\n\nIt uses the core of the garden lexicon, and it might not be creating the record 100 percent correctly. Next would be to make sure that the record building is flexible and functional and posting records correctly.\n\nAfter that, I’ll create a mircoservice that listens to the firehose for these. Right now it’s all passive through this application itself.","likes":3,"re":null},{"u":"zicklag.dev","at":"2026-03-12T21:44:10Z","text":"> **flo-bit.dev:**\n> for verification i’m a fan of what standard.site is doing instead of the rel=me having a `.well-known/{collection}` endpoint, makes thing easier regarding CORS issues when verifying on the client (and yeah that’d be out of band anyway, so would be an optional thing, the handle of the publishing account like @roomy.space could also be used as a simple verification)\n\nCurious what @nikolas.ws and others think about the `.well-known/collection` pattern of verification compared to `rel=me`.\n\nI like that it’s a lot easier to use than having to parse the HTML response of a normal web-page.\n\nI think rel=me might have a *slight* advantage that it works automatically on 3rd party sites like GitHub, because your profile’s links have `rel=me` already added to it.\n\n**Edit:** One thing that bugs me about verification methods in general is that there are multiple secure ways to do it, i.e. `rel=me` or `.well-known` or DNS TXT, but if we support multiples, than every app has to support multiples. So it’s nicer if there’s only one thing to support.","likes":0,"re":31},{"u":"nikolas.ws","at":"2026-03-12T21:46:36Z","text":"I think their both fine – I’m *already* parsing HTML so rel=me is cheap and easy to implement.\n\nRight now I’m not using the (good, imo) `self` key idea since I don;t have an ATPRoto account *for* this app. Instead Im using my personal account to list the app, and that account is *not* the app. And may want to list several.\n\nI think the `.well-known` and `self`keys are both good ideas, and will try and get to them too. But I like the use case of “me as a developer, creating multiple apps, listing them as myself” and want to support it.","likes":0,"re":33},{"u":"nikolas.ws","at":"2026-03-12T21:47:27Z","text":"Oh good point re many ways; I think `.well-known` probably better in that case, and doesnt close any doors.","likes":1,"re":34},{"u":"zicklag.dev","at":"2026-03-12T22:00:46Z","text":"> **nikolas.ws:**\n> But I like the use case of “me as a developer, creating multiple apps, listing them as myself” and want to support it.\n\nOh, yeah, we definitely need to support that, too. The `self` key version should just be a way for the official record to take precedence over everything else and be extra verified, I think.","likes":2,"re":34},{"u":"byarielm.fyi","at":"2026-03-17T04:09:53Z","text":"finally remember my morning idea: client metadata for app oauth already has some of this info (as long as there’s oauth) and the dev fills it out — client name, uri, logo. Can’t recall if description is one but not seeing it in a few I looked up for popular apps. I did mis-remember the lexicon part being in there (they kinda are cuz scopes but not quiet).\n\nAnyway maybe app lexicon is just:\n\n1. app uri\n2. custom lexicons NSID(s)\n3. tagline OR description OR category (from fixed list)\n\nyou can use 1 to then get name from client metadata json. however, do we handle non-oauth cases? if so then needing name+logo feel is more necessary…but…maybe it’ll force people to do oauth? lol\n\njust 2 means we don’t list custom lexicons, which def won’t be kept up-to-date. but users of the app lexicon can query for them from this field and it addresses the “has custom lexicon” part. related to 1: do we add non-custom NSID field to handle non-custom lexicons cases, e.g. skylight social, community lexicons, etc. separately or just have one that’s basically “writes to collections w these NSIDs?”\n\n3rd option is there to reflect information that may not exist elsewhere but useful for folks that might use this app lexicon.\n\nOther optional ones suggested - brand did, creator did, source code url, etc seem less critical to start.","likes":0,"re":31},{"u":"zicklag.dev","at":"2026-03-17T14:03:49Z","text":"> **byarielm.fyi:**\n> you can use 1 to then get name from client metadata json. however, do we handle non-oauth cases? if so then needing name+logo feel is more necessary…but…maybe it’ll force people to do oauth? lol\n\nUnfortunately I’m still seing people who are having a lot of trouble getting OAuth working and deciding they just have to shelve it for now. :face_exhaling:\n\nI’ve also run into several ATProto apps in app lists that require password login. Well, actually, Bluesky and Blacksky are examples. :sweat_smile:\n\nAlso, it seems like maybe it’d be good to have that info right in the lexicon. Being able to just use the ATProto client to get the info without having to make a separate OAuth metadata fetch seems good.\n\n> **byarielm.fyi:**\n> custom lexicons NSID(s)\n\nI kind of feel like custom lexicon lists aren’t particularly important in an app list for most people. At least for a first pass.\n\n> **byarielm.fyi:**\n> tagline OR description OR category (from fixed list)\n\nIt seems strange to me to have it serve multiple different purposes for one field.\n\n> **byarielm.fyi:**\n> Other optional ones suggested - brand did, creator did, source code url, etc seem less critical to start.\n\nAgreed. :+1:\n\nSo maybe bare bones is just?\n\n- url\n- name\n- logo\n- short description\n- category ( from fixed list that is open ended so we can extend it later )","likes":0,"re":37},{"u":"byarielm.fyi","at":"2026-03-18T02:03:42Z","text":"My thinking re:logo from oauth metadata was that logos change more than url/name might.\n\nand by “OR” I meant one of those as a field, not any of those in a field ha.\n\nYou make good points — perhaps I went too simple :winking_face_with_tongue: I think this is a pretty good set to start from coupled with the work @dame.is started (so trimming those lexicons a bit).","likes":1,"re":38},{"u":"pixeline.be","at":"2026-03-18T08:05:10Z","text":"Hello, excited to jump in on this conversation (thanks @byarielm.fyi for the ping :slightly_smiling_face:).\n\nI maintain [ATproto Apps • atproto.brussels](https://atproto.brussels/atproto-apps), and a shared lexicon would immediately make this kind of work easier.\n\nTo give concrete context, here are the fields I currently rely on to describe apps:\n\n- name\n- url\n- platform (web / ios / android / other)\n- short description\n- category (although I’m starting to think this should become tags)\n- alternative_to (many apps position themselves relative to existing products)\n- last_checked (basic health check via cron)\n- Icon (via web scrapping, defaulting to favicon.ico)\n\nI’ve also experimented with storing user ratings in the voter’s PDS as an optional write-through ( lexicon nsid `brussels.loves.appRating` ).\n\nWhat I’m realizing is that even with this, something important is missing:\n we don’t have a shared way to describe how an app fits into the ATProto ecosystem itself.\n\nI think of the lexicon as a shared mental model of what an app is.\n\nIt should help answer three questions:\n\n1. What is this app?\n2. What is it for?\n3. How does it plug into ATProto?\n\nMy directory does a decent job (self patting on the back) at #1 and #2. But #3 is almost entirely missing.\n\n### #p-2755-proposal-1proposal\n\nRather than aiming for a complex ontology, I think a simple, adoptable structure would go a long way.\n\nEach app could expose:\n\n- Type → Client / Tool / Service / Infrastructure / Directory\n- Domain → Photos / Messaging / Publishing / etc.\n- Protocol roles → Feed builder, Publisher, Repo tool, etc. (multiple allowed)\n\nExamples:\n\n**SkyFeed**\n Type: Client\n Domain: Microblogging\n Roles: Account client, Feed builder\n\n**WhiteWind**\n Type: Service\n Domain: Publishing\n Roles: Publisher\n\n**PDSls**\n Type: Tool\n Domain: Developer\n Roles: Repo tool, Firehose tool\n\nWithout this separation, we end up mixing “Client”, “Tool”, and “Social” in the same bucket.\n\nI’m less concerned about metadata like authorship (which is useful but straightforward), and more about how we consistently locate an app within the ecosystem in a way that is clear and reusable.\n\nIf others are already experimenting with similar structures (e.g. atproto.garden), I’d be very interested in aligning rather than reinventing.","likes":3,"re":null},{"u":"nikolas.ws","at":"2026-03-18T16:28:08Z","text":"I really like the idea of `type/domain`, tho Im sure wrangling the exact words to use there will be a project.\n\nI think differentiating between clients and tools is important, since I see a world where we start building more and more apps that don’t really have anything to do with Bluesky at all.\n\nMy one note is that “domain” or “category” or “tags” or whatever should *absolutely not* be constrained to an enum, predefined list. Let a thousand tags bloom, or else we get a thousand listing as “other”.\n\n@pixeline.be and @dame.is, lets kick together a rough lexicon that meets in the middle. I’ll try and start publishing records in that shape this week.\n\nOh, and the oAuth client id idea is somethng the Solid community thought of too – thats a good idea that I will be supporting.","likes":2,"re":null},{"u":"yamarten.bsky.social","at":"2026-03-18T17:09:36Z","text":"I’m excited about Alternative_to! Regardless of whether it should be included in the initial set, I would like this lexicon to support it in the future.\n\nI just researched it personally recently. (the link is in Japanese)\n\n[https://chatgpt.com/s/69a8cfb96ed48191aee1753354de2f1f](https://chatgpt.com/s/69a8cfb96ed48191aee1753354de2f1f)\n\nAs for your proposal, from the experience of seeing a lot of services, although the type is useful, it can be difficult to classify it well.\n\n- Is an app like blahg that self-hosts for each user a service? (it may be a tool)\n- Is WhiteWind a Bluesky client? (partially yes)\n- Is this forum included in atproto services? (probably not)\n\nIn my opinion, it may be enough to include these in tag.","likes":1,"re":40},{"u":"byarielm.fyi","at":"2026-03-18T18:19:54Z","text":"Someone want to take a stab at making this into a WG per the original post? I don’t have the bandwidth right now to lead or make big moves/pushes (phd is requiring more focus), so hoping someone else can get interested folks organized to make this happen.","likes":1,"re":null},{"u":"pixeline.be","at":"2026-03-18T19:09:10Z","text":"Incidentally, I work for an ASO company so store taxonomies are indeed quite a challenge.\n We maintain a database of all categories used in both the iOS and Play Stores, and our data science team built a finer classification layer (“appDNA”) based on large-scale app metadata. It groups apps using underlying signals and tends to perform much better at clustering apps by actual user intent.\n\nOne consistent takeaway from this work: **trying to define an exhaustive, fixed taxonomy indeed doesn’t scale.**\n\nSo with that in mind, I don’t think the goal of this lexicon should be to enumerate all possible types and domains. That will quickly become either too complex or too generic.\n\nInstead, it might be more effective to bake into this lexicon a smaller set of **signals** (and/or “features”, as in atproto.garden) that describe what an app does and how it behaves.\n\nFrom those signals, different consumers can derive their own groupings depending on their needs:\n\n- user-facing directories → “Photos apps”, “Messaging apps”\n- developer views → “feed builders”, “repo tools”\n- analytics / discovery → clustering based on usage patterns\n\nRather than hardcoding categories, each app could expose things like:\n\n- capabilities (posting, publishing, messaging, etc.)\n- protocol interactions (feeds, repos, firehose, identity, etc.)\n- surface type (client, service, tool, etc.)\n\nThen “categories” become a view, not the source of truth. We could even have an optional tech_stack entry listing the tech related to the app (interesting for finding developers)\n\nThat said, I don’t think this contradicts having a minimal set of high-level fields like Ty
