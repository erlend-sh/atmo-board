  }
  // The open directory reveals its channels: five, then "all".
  if (DIRS[here] || here === 'events') {
    const cs = dirChs(here), all = S.sideAll === here;
    html += `<div class="sec dir-sec"><span>${dirLabel(here)}</span></div>${(all ? cs : cs.filter((c, i) => i < 5 || c === hereCh)).map(item).join('')}`;
    if (cs.length > 5) html += `<button class="side-all" data-act="sideall" data-dir="${here}">${all ? 'fewer' : `all ${cs.length}`}</button>`;
  }
  html += `</nav><div class="me">`;
  if (u) {
    html += `${av(u.id, 32)}<div class="who"><b>${esc(u.n)}</b><span>${u.joined ? (u.staff ? u.roles[0] : `trust level ${u.tl}`) : 'not a member yet'}</span></div><button class="btn ghost small" data-act="signout">Sign out</button>`;
  } else {
    html += `<button class="btn primary" style="flex:1" data-act="signin">Sign in</button>`;
  }
  html += '</div>';
  const side = document.getElementById('side');
  side.innerHTML = html;
  side.classList.toggle('open', S.side);
}

// ---------- Main views ----------
function topBar(head, actions = '', desc = '') {
  return `<div class="top"><button class="icon-btn menu-btn" data-act="menu" aria-label="Open channels">${I.menu}</button>
    <div class="top-title">${head}${desc ? `<p class="top-desc"><span class="txt">${esc(desc)}</span><button class="more" data-act="desc" aria-expanded="${!!S.descOpen}">more</button>${S.descOpen ? `<span class="desc-pop">${esc(desc)}</span>` : ''}</p>` : ''}</div>
    <div class="top-right"><label class="search ${S.query ? 'has-q' : ''}" role="search">${I.search}<input id="q" type="search" placeholder="Search" value="${esc(S.query)}" autocomplete="off" aria-label="Search posts"></label>${actions}</div></div>`;
}
const newThreadBtn = (label = 'New thread') => `<button class="btn primary small" data-act="newthread">${label}</button>`;
// Show "more" only when the description is actually cut off.
function measureHead() {
  const h = document.querySelector('.top-title h1'), main = document.getElementById('main');
  const tn = h && [...h.childNodes].find((n) => n.nodeType === 3 && n.textContent.trim());
  if (!tn) return;
  const rg = document.createRange(); rg.selectNodeContents(tn);
  main.style.setProperty('--head-x', `${rg.getBoundingClientRect().left - main.getBoundingClientRect().left - main.clientLeft}px`);
}
function clipDesc() {
  const d = document.querySelector('.top-desc'); if (!d) return;
  const t = d.querySelector('.txt');
  d.classList.toggle('clipped', S.descOpen || t.scrollWidth > t.clientWidth + 1);
}
function joinNotice() {
  const u = me();
  if (!u) return `<div class="notice"><span>Sign in with your atproto handle to join the conversation.</span><button class="btn primary small" data-act="signin">Sign in</button></div>`;
  if (!u.joined) return `<div class="notice"><span>You're signed in as <b>@${esc(u.h)}</b> but haven't joined yet. Anyone can join this forum.</span><button class="btn primary small" data-act="join">Join Atmosphere Community</button></div>`;
  if (u.tl === 0) return `<div class="notice warn"><span>Welcome! As a new member (trust level 0), posts with links wait for a moderator. Read a few threads and that lifts within a day or two.</span></div>`;
  return '';
}
function threadRow(t, showChan) {
  const c = chanOf(t);
  const un = unreadOf(t);
  const faces = [...new Set(t.posts.map((p) => p.author))].slice(0, 5);
  return `<li class="${showChan ? '' : 'no-chan'}" data-act="thread" data-key="${t.key}" tabindex="0">
    <div class="marks">${un === -1 ? '<span class="dot" title="New thread"></span>' : un > 0 ? `<span class="count" title="${un} unread">${un}</span>` : ''}${t.pinned ? `<span class="flag" title="Pinned">${I.pin}</span>` : ''}${t.locked ? `<span class="flag" title="Locked">${I.lock}</span>` : ''}</div>
    <div class="t ${un === 0 && me() ? 'read' : ''}"><span class="tt">${esc(t.title)}</span></div>
    <div class="faces" title="${t.total || t.posts.length} posts">${faces.map((f) => av(f, 22)).join('')}</div>
    ${showChan ? `<span class="chan">${chIcon(c)}<span class="cn">${esc(c.title)}</span></span>` : ''}
    <span class="age">${age(lastAgo(t))}</span></li>`;
}
// The channel's untitled chat, pinned above its threads.
function chatRow(c) {
  const un = me() ? Math.max(0, unreadOf(c)) : 0;
  const faces = [...new Set(c.posts.slice().reverse().map((p) => p.author))].slice(0, 5);
  // People who wrote in chat this past week.
  const active = new Set(c.posts.filter((p) => p.ago < 7 * D).map((p) => p.author)).size;

      <div class="row">${r.kind === 'held' ? `<button class="btn primary small" data-act="approve" data-id="${r.id}">Approve</button><button class="btn small" data-act="reject" data-id="${r.id}">Reject</button>` : `<button class="btn primary small" data-act="reject" data-id="${r.id}">Keep hidden</button><button class="btn small" data-act="approve" data-id="${r.id}">Restore</button><button class="btn small" data-act="reject" data-id="${r.id}" style="color:var(--danger)">Remove member</button>`}</div></div>`;
  }
  return h + '</div>';
}
function viewSearch() {
  const q = S.query.trim().toLowerCase();
  const hits = [];
  for (const t of [...CH, ...T]) {
    if (!can.see(chanOf(t))) continue;
    for (const p of t.posts) if ((!p.whisper || me()?.staff) && p.text.toLowerCase().includes(q)) hits.push({ t, p });
  }
  const mark = (s) => esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), (m) => `<mark>${m}</mark>`);
  return topBar(`<h1><span class="top-ico">${I.search}</span>Search</h1>`, '', `${hits.length} post${hits.length === 1 ? '' : 's'} matching “${S.query}”, across chat and threads.`) + `<div class="page">
    <ol class="list hits">${hits.map(({ t, p }) => `<li data-act="${t.kind === 'channel' ? 'channelchat' : 'post'}" data-key="${t.key}" data-n="${p.n}" tabindex="0" style="grid-template-columns:36px minmax(0,1fr) auto">${av(p.author, 32)}<div style="min-width:0"><div class="t" style="font-size:14.5px">${t.kind === 'channel' ? `<span class="chan" style="color:var(--accent)">${esc(t.title)}/chat</span>` : esc(t.title)} <span class="mono" style="color:var(--mute);font-weight:400">#${p.n}</span></div><div style="font-size:14px;color:var(--ink-2);margin-top:3px">${mark(p.text.length > 180 ? p.text.slice(0, 180) + '…' : p.text)}</div></div><div class="age">${age(p.ago)}</div></li>`).join('')}</ol></div>`;
}

// Preview-only control: who the page is shown as.
function renderViewAs() {
  const cur = VIEWERS.find((v) => v.id === S.viewer);
  document.getElementById('viewas').innerHTML = (S.viewMenu ? `<div class="viewas-menu" role="menu" aria-label="View the preview as">
    <p>Real threads from atmosphere.community. Most are shortened, but the five longest are copied in full. These viewers are made-up sample accounts. Nothing leaves this page.</p>
    ${VIEWERS.map((v) => `<button role="menuitemradio" aria-checked="${S.viewer === v.id}" data-act="viewer" data-id="${v.id}">${v.label}${v.as ? `<span>${esc(M[v.as].n.split(' ')[0])}</span>` : ''}</button>`).join('')}</div>` : '')
    + `<button class="viewas-btn" data-act="viewmenu" aria-expanded="${!!S.viewMenu}" aria-haspopup="menu">${I.eye}<span class="viewas-long">Viewing as </span><b>${cur.label}</b></button>`;
}
function render() {
  renderViewAs();
  const r = S.route;
  const html = r.v === 'channel' ? viewChannel() : r.v === 'thread' ? viewThread() : r.v === 'review' ? viewReview() : DIRS[r.v] ? viewDir(r.v) : r.v === 'events' ? viewEvents() : r.v === 'search' ? viewSearch() : viewLatest();
  renderSide(); // after the view, so badges reflect what this view just marked read
  document.getElementById('main').innerHTML = html;
  if (r.v === 'thread' && r.n) requestAnimationFrame(() => document.getElementById('post-' + r.n)?.scrollIntoView({ block: 'center' }));
  if (r.v === 'channel' && r.tab === 'chat') requestAnimationFrame(() => { const m = document.getElementById('main'); m.scrollTop = m.scrollHeight; });
  alignSideHead(); clipDesc(); measureHead();
}
// The sidebar's divider sits exactly on the top bar's, whatever fonts or zoom make that bar's height.
const topObserver = new ResizeObserver(() => alignSideHead());
function alignSideHead() {
  const top = document.querySelector('.top'), head = document.querySelector('.side-head');
  if (!top || !head) return;
  topObserver.disconnect(); topObserver.observe(top);
  head.style.height = matchMedia('(max-width: 820px)').matches ? '' : `${top.getBoundingClientRect().bottom - head.getBoundingClientRect().top}px`;
}
addEventListener('resize', () => { alignSideHead(); clipDesc(); measureHead(); });

// ---------- Modals ----------
function modal(html) {
  const layer = document.getElementById('layer');
  layer.innerHTML = `<div class="scrim" data-act="close"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  layer.querySelector('input, button:not(.av)')?.focus();
}
function profile(id) {
  const p = M[id];
  const staff = isStaff(id);
  const names = ['New', 'Basic', 'Member', 'Regular', 'Leader'];
  modal(`<div style="display:flex;gap:14px;align-items:center">${av(id, 64)}<div style="min-width:0"><h2>${esc(p.n)}</h2><div class="small-print mono">@${esc(p.h)}</div>
    <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">${staff ? `<span class="pill staff">${p.roles[0]}</span>` : ''}<span class="pill tl">trust level ${p.tl} · ${names[p.tl]}</span></div></div></div>
    <p class="small-print" style="margin:16px 0 6px">Trust level</p>
    <div class="ladder">${names.map((n, i) => `<div class="${i === p.tl ? 'on' : ''}"><b>${i}</b>${n}</div>`).join('')}</div>
    <p class="small-print" style="margin:0 0 14px">${p.tl === 4 ? 'Leaders are appointed by staff.' : p.tl === 3 ? 'Regulars keep their level by staying active over the last 100 days.' : 'Levels go up automatically as you read and take part.'}</p>
    ${p.read == null ? '' : `<div class="stats"><div><b>${p.posts}</b><span>posts</span></div><div><b>${p.read.toLocaleString('en')}</b><span>posts read</span></div><div><b>${p.days}</b><span>days visited</span></div></div>`}
    <p class="small-print" style="margin-top:12px">Reading stats stay private to this forum. Posts are public records under <span class="mono">did:plc:${keyOf(id + 'did')}…</span></p>
    <div style="display:flex;justify-content:flex-end;margin-top:14px">${me()?.staff && !staff ? '<button class="btn small" data-act="close" style="margin-right:auto">Set trust level…</button>' : ''}<button class="btn" data-act="close">Close</button></div>`);
}
function signin() {
  modal(`<h2>Sign in to Atmosphere Community</h2><p class="small-print" style="margin-top:6px">Use the handle from Bluesky or any atproto service. You'll approve the sign-in on your own server, and this forum never sees your password.</p>
    <form data-form="signin"><div class="field"><label for="handle" style="font-weight:600;font-size:14px">Your handle</label><input id="handle" name="handle" placeholder="you.bsky.social" value="carol.bsky.social" autocomplete="username"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Continue</button></div></form>
    <p class="small-print" style="margin-top:14px">No account yet? <a href="https://bsky.app" target="_blank" rel="noopener" style="color:var(--accent)">Create one on Bluesky</a> or pick any other atproto host.</p>`);
}
function moveDialog(postKey) {
  const t = byKey(S.route.key);
  const others = T.filter((x) => x !== t && can.see(chanOf(x)));
  modal(`<h2>Move post</h2><p class="small-print" style="margin-top:6px">The author's record stays as written. The forum records a move, and the post's <span class="mono">/p/</span> link follows it to its new thread.</p>
    <div class="field"><label for="dest" style="font-weight:600;font-size:14px">Destination thread</label><select id="dest" style="height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 8px;font:inherit">${others.map((o) => `<option value="${o.key}">${esc(o.title)}</option>`).join('')}</select></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="domove" data-key="${postKey}">Move post</button></div>`);
}

// ---------- Events ----------
function findPost(key) {
  for (const t of [...CH, ...T]) { const p = t.posts.find((x) => x.key === key); if (p) return { t, p }; }
}
document.addEventListener('click', (e) => {
  if (S.viewMenu && !e.target.closest('#viewas')) { S.viewMenu = false; renderViewAs(); }
  if (S.notifyMenu && !e.target.closest('.rail-actions')) { S.notifyMenu = false; render(); }
  if (S.descOpen && !e.target.closest('.top-desc')) { S.descOpen = false; render(); }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'close' && el.classList.contains('scrim') && e.target !== el) return;
  if (el.tagName === 'A') e.preventDefault();
  const k = el.dataset.key;
  switch (act) {
    case 'viewmenu': S.viewMenu = !S.viewMenu; renderViewAs(); break;
    case 'viewer': S.viewer = el.dataset.id; S.viewMenu = false; S.open = {}; S.composeThread = null; if (S.route.v === 'review' && !me()?.staff) S.route = { v: 'latest', sort: 'latest' }; render(); break;
    case 'latest': S.query = ''; go({ v: 'latest', sort: 'latest' }); break;
    case 'sort': go({ v: el.dataset.view, sort: el.dataset.sort }); break;
    case 'review': go({ v: 'review' }); break;
    case 'sideall': S.sideAll = S.sideAll === el.dataset.dir ? null : el.dataset.dir; renderSide(); break;
    case 'events': go({ v: 'events', tab: 'upcoming' }); break;
    case 'evtab': go({ v: 'events', tab: el.dataset.tab }); break;
    case 'rsvp': toast(`RSVPs aren't wired up in the preview yet.`); break;
    case 'evdetails': toast('In the app this opens the event on Smoke Signal or OpenMeet.'); break;
    case 'dir': go({ v: el.dataset.dir, sort: 'overview' }); break;
    case 'joingroup': toast(`${el.dataset.verb} ${el.dataset.name} isn't wired up in the preview yet.`); break;
    case 'channel': go({ v: 'channel', key: k, tab: 'threads' }); break;
    case 'channelchat': go({ v: 'channel', key: k, tab: 'chat' }); break;
    case 'tab': go({ ...S.route, tab: el.dataset.tab }); break;
    case 'thread': go({ v: 'thread', key: k }); break;
    case 'post': go({ v: 'thread', key: k, n: +el.dataset.n }); break;
    case 'jump': case 'permalink': S.route = { ...S.route, n: +el.dataset.n }; render(); break;
    case 'menu': S.side = !S.side; renderSide(); break;
    case 'profile': e.stopPropagation(); profile(el.dataset.id); break;
    case 'close': document.getElementById('layer').innerHTML = ''; break;
    case 'signin': signin(); break;
    case 'signout': S.viewer = 'visitor'; render(); break;
    case 'join': S.carolJoined = true; toast('Welcome to Atmosphere Community'); render(); break;
    case 'replythread': S.quote = null; S.dockActive = true; render(); { const ta = document.querySelector('.dock textarea'); ta?.scrollIntoView({ block: 'center' }); ta?.focus(); } break;
    case 'notifymenu': S.notifyMenu = !S.notifyMenu; render(); break;
    case 'notify': S.notify[S.route.key] = el.dataset.id; S.notifyMenu = false; render(); toast(`Notifications: ${NOTIFY.find((x) => x.id === el.dataset.id).label}`); break;
    case 'desc': S.descOpen = !S.descOpen; render(); break;
    case 'newthread': S.composeThread = {}; render(); document.getElementById('new-title')?.focus(); break;
    case 'palette': S.open['rx:' + k] = !S.open['rx:' + k]; render(); break;
    case 'history': S.open['hist:' + k] = !S.open['hist:' + k]; render(); break;
    case 'react': {
      const { p } = findPost(k); const u = me(); if (!u?.joined) { toast('Join the forum to react'); break; }
      const a = (p.rx[el.dataset.e] ??= []); const i = a.indexOf(u.id); i >= 0 ? a.splice(i, 1) : a.push(u.id);
      S.open['rx:' + k] = false; render(); break;
    }
    case 'reply': case 'quote': { const { t, p } = findPost(k); S.quote = [t.key, p.n]; S.dockActive = true; render(); document.querySelector('.dock textarea')?.focus(); break; }
    case 'unquote': S.quote = null; render(); break;
    case 'share': {
      const { t, p } = findPost(k); const url = `https://atmosphere.community/p/${p.key}`;
      navigator.clipboard?.writeText(url).then(() => toast('Copied ' + url.replace('https://', '')), () => toast(url.replace('https://', '')));
      if (!navigator.clipboard) toast(url.replace('https://', ''));
      break;
    }
    case 'spawn': {
      const { p } = findPost(k);
      go({ ...S.route, tab: 'threads' }); S.composeThread = { seed: `> ${p.text.split('\n')[0]}\n> — ${M[p.author].n}, in chat\n\n` }; render(); document.getElementById('new-title')?.focus();
      break;
    }
    case 'hide': { const { p } = findPost(k); p.hidden = !p.hidden; toast(p.hidden ? 'Post hidden. Staff can still see it.' : 'Post restored'); render(); break; }
    case 'movepost': moveDialog(k); break;
    case 'domove': {
      const from = byKey(S.route.key); const to = byKey(document.getElementById('dest').value); const { p } = findPost(k);
      from.posts.splice(from.posts.indexOf(p), 1); from.posts.forEach((x, i) => (x.n = i + 1));
      p.n = to.posts.length + 1; p.replyTo = undefined; to.posts.push(p);
      document.getElementById('layer').innerHTML = ''; toast(`Moved to “${to.title}”. Its /p/ link still works.`); go({ v: 'thread', key: to.key, n: p.n }); break;
    }
    case 'lock': { const t = byKey(S.route.key); t.locked = !t.locked; t.lockedBy = t.locked ? me().id : null; render(); break; }
    case 'pin': { const t = byKey(S.route.key); t.pinned = !t.pinned; render(); break; }
    case 'approve': case 'reject': REVIEW = REVIEW.filter((r) => r.id !== +el.dataset.id); toast(act === 'approve' ? 'Approved and posted' : 'Done'); render(); break;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { document.getElementById('layer').innerHTML = ''; if (S.viewMenu) { S.viewMenu = false; renderViewAs(); } }
  if (e.key === 'Enter' && e.target.matches('li[data-act]')) e.target.click();
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches('#text-chat, #text-reply')) { e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'whisper') S.whisper = e.target.checked; });
document.addEventListener('input', (e) => {
  if (e.target.id === 'text-reply' && e.target.value && !S.dockActive) { S.dockActive = true; e.target.closest('.dock').classList.add('active'); }
  if (e.target.id !== 'q') return;
  S.query = e.target.value;
  const caret = e.target.selectionStart;
  if (S.query.trim().length >= 2) { S.route = { v: 'search' }; document.getElementById('main').innerHTML = viewSearch(); }
  else if (S.route.v === 'search') { S.route = { v: 'latest', sort: 'latest' }; document.getElementById('main').innerHTML = viewLatest(); }
  else return;
  // The search box lives in the re-rendered top bar, so put the cursor back.
  const q = document.getElementById('q'); q.focus(); q.setSelectionRange(caret, caret);
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, u = me();
  if (kind === 'signin') { S.viewer = 'newcomer'; document.getElementById('layer').innerHTML = ''; toast('Signed in as @' + (f.handle.value || 'carol.bsky.social')); render(); return; }
  const text = f.text.value.trim(); if (!text || !u) return;
  if (!u.joined) { toast('Join the forum first'); return; }
  if (u.tl === 0 && /https?:\/\/|\]\(/.test(text)) {
    REVIEW.push({ id: Date.now(), kind: 'held', who: u.id, where: S.route.v === 'thread' ? byKey(S.route.key).title : '#' + byKey(S.route.key).title + ' chat', text, why: 'Held: a trust level 0 member posted a link.' });
    toast('Your post has a link, so it waits for a moderator. That rule lifts at trust level 1.'); f.reset(); return;
  }
  if (kind === 'chat') {
    const c = byKey(S.route.key); const quote = S.quote ? byKey(S.quote[0]).posts[S.quote[1] - 1] : null;
    c.posts.push({ n: c.posts.length + 1, key: keyOf(c.key + Date.now()), author: u.id, text: quote ? `> ${quote.text.split('\n')[0]}\n\n${text}` : text, ago: 0, rx: {} });
    S.quote = null; render();
  } else if (kind === 'reply') {
    const t = byKey(S.route.key);
    t.posts.push({ n: t.posts.length + 1, key: keyOf(t.key + Date.now()), author: u.id, text, ago: 0, rx: {}, replyTo: S.quote?.[1], whisper: S.whisper && u.staff });
    S.quote = null; S.whisper = false; S.dockActive = false; S.route = { ...S.route, n: t.posts.length }; render();
  } else if (kind === 'thread') {
    const c = byKey(f.chan ? f.chan.value : S.route.key); const title = f.title.value.trim(); if (!title) return;
    const t = { kind: 'thread', key: keyOf('t:' + title + Date.now()), slug: slug(title), title, parent: c.key, author: u.id, tags: [], posts: [{ n: 1, key: keyOf(title + Date.now()), author: u.id, text, ago: 0, rx: {} }] };
    T.push(t); go({ v: 'thread', key: t.key });
  }
});
render();
</script>

</html>
